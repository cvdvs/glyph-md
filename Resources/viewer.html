    user-select: none;
    -webkit-user-select: none;
    list-style: none;

  .props summary::after { content: " ›"; opacity: 0.6; }

    gap: 7px;

    border: none;

    white-space: nowrap;

    line-height: 1.6;
    tab-size: 4;
  }
  body.glyph-raw #glyph-raw { display: block; }
  body.glyph-raw #content { visibility: hidden; }

  #glyph-drop {
    position: fixed; inset: 0; z-index: 40;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(var(--accent-rgb), 0.12);

    color: var(--accent);
    font: 600 15px -apple-system, system-ui, sans-serif;
  }
  body.glyph-dropping #glyph-drop { display: flex; }

  /* ---- server mode: the file drawer ---- */

    position: fixed; top: 0; left: 0; bottom: 0; z-index: 60;
    width: 300px; max-width: 82vw;
    background: var(--bg);
    border-right: 1px solid var(--border);
    transform: translateX(-102%);
    transition: transform 0.2s ease;
    display: flex; flex-direction: column;
    overscroll-behavior: contain;
  }
  body.glyph-drawer-open #glyph-drawer { transform: none; }
  #glyph-drawer-backdrop {
    position: fixed; inset: 0; z-index: 55;
    background: rgba(0, 0, 0, 0.35);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  body.glyph-drawer-open #glyph-drawer-backdrop { opacity: 1; pointer-events: auto; }
  .glyph-drawer-head {
    padding: max(14px, env(safe-area-inset-top)) 16px 8px;
    font: 600 13px -apple-system, system-ui, sans-serif;
    color: var(--fg);
  }
  .glyph-drawer-search {
    margin: 0 12px 8px; padding: 9px 11px;
    border: 1px solid var(--border); border-radius: 8px;

    font-size: 15px; -webkit-appearance: none; outline: none;
  }
  .glyph-drawer-search:focus { border-color: var(--accent); }
  .glyph-drawer-list {
    list-style: none; margin: 0; padding: 0 8px 24px;
    overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch;
  }
  .glyph-drawer-item {
    display: flex; flex-direction: column; gap: 2px; width: 100%;
    text-align: left; border: none; background: transparent; cursor: pointer;
    padding: 11px 10px; border-radius: 8px; color: var(--fg);
  }
  .glyph-drawer-item:hover { background: rgba(var(--fg-rgb), 0.06); }
  .glyph-drawer-item.current { background: rgba(var(--accent-rgb), 0.12); color: var(--accent); }
  .glyph-drawer-name { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glyph-drawer-sub { font-size: 11px; color: var(--faint); }
  .glyph-drawer-empty { padding: 12px 14px; color: var(--muted); font-size: 13px; }

  /* ---- the drawer's folder tree ---- */

    display: flex; align-items: center; gap: 6px; width: 100%;
    text-align: left; border: none; background: transparent; cursor: pointer;
    color: var(--fg); border-radius: 8px;
    padding: 9px 8px; font-size: 14px; line-height: 1.25;

  .glyph-tree-row .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glyph-tree-row.folder .tn { color: var(--muted); font-weight: 600; }
  .glyph-tree-row .tc { margin-left: auto; color: var(--faint); font-size: 11px; flex: none; padding-left: 8px; }
  .glyph-tree-kids { display: none; }

    display: none;
    flex: none; width: 42px; border: none; background: transparent;
    color: var(--muted); font-size: 15px; cursor: pointer;
    border-right: 1px solid var(--border);

  @media (max-width: 640px) {
    body.glyph-chrome #content { padding-left: 16px; padding-right: 16px; padding-top: 14px; }
    /* Scale the READER, not #md directly: a fixed font-size here would win over

    body.glyph-chrome { --reader-size: 17px; }
    body.glyph-chrome .glyph-btn { min-width: 40px; height: 40px; }
    body.glyph-chrome #glyph-tools { height: 56px; gap: 2px; }
    body.glyph-chrome #glyph-tabs { height: 42px; }

    body.glyph-chrome .glyph-tab .x { width: 22px; height: 22px; line-height: 21px; font-size: 15px; }
    body.glyph-chrome #glyph-drawer { width: 88vw; max-width: 88vw; }
    body.glyph-chrome .glyph-tree-row { padding: 11px 8px; font-size: 15px; }
    body.glyph-chrome #glyph-status { bottom: max(10px, env(safe-area-inset-bottom)); }
    body.glyph-chrome #content { padding-bottom: max(120px, env(safe-area-inset-bottom)); }
    body.glyph-chrome #glyph-raw { padding-bottom: max(60px, env(safe-area-inset-bottom)); }
  }

<body>
<div id="content"><article id="md"></article></div>
<script nonce="/*__CSP_NONCE__*/">/*__MARKED_JS__*/</script>
<script nonce="/*__CSP_NONCE__*/">
"use strict";

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

marked.use({ gfm: true, breaks: true });

const wikilink = {
  name: "wikilink",
  level: "inline",
  start(src) { const i = src.indexOf("[["); return i < 0 ? undefined : i; },
  tokenizer(src) {
    const m = /^(!?)\[\[([^\[\]\n]+?)\]\]/.exec(src);
    if (!m) return;
    return { type: "wikilink", raw: m[0], embed: m[1] === "!", target: m[2] };
  },
  renderer(token) {
    // Two kinds of escaped pipe can appear here. U+E000 is one guardInput added
    // so the table row would parse — it must come back as a plain pipe. A
    // backslash is the author's own escaping, which Obsidian expects inside
    // tables, so it is written back exactly as they wrote it.
    const rawTarget = token.target.replace(/\uE000/g, "|").replace(/\uE001/g, "\\|");
    const shown = rawTarget.replace(/\\\|/g, "|");
    const raw = (token.embed ? "!" : "") + "[[" + rawTarget + "]]";
    const parts = shown.split("|");
    const target0 = parts[0].trim();
    const alias = parts.length > 1 ? parts.slice(1).join("|").trim() : null;
    if (token.embed && /\.(png|jpe?g|gif|webp|svg|avif|bmp)$/i.test(target)) {
      const w = alias && /^\d+$/.test(alias) ? ` width="${alias}"` : "";
      return `<img src="${esc(encodeURI(target0))}"${w} alt="${esc(target0)}" data-raw="${esc(raw)}">`;
    }
    return `<span class="wikilink" data-raw="${esc(raw)}">${esc(alias || target0)}</span>`;
  },
};

const obsidianHighlight = {
  name: "obsidianHighlight",
  level: "inline",
  start(src) { const i = src.indexOf("=="); return i < 0 ? undefined : i; },
  tokenizer(src) {
    const m = /^==([^\n]+?)==/.exec(src);
    if (!m) return;
    return {
      type: "obsidianHighlight",
      raw: m[0],
      text: m[1],
      tokens: this.lexer.inlineTokens(m[1]),
    };
  },
  renderer(token) {
    return `<mark>${this.parser.parseInline(token.tokens)}</mark>`;
  },
};

marked.use({ extensions: [wikilink, obsidianHighlight] });

/* ---------- input guards ----------
   Two problems that fire on OPEN, before anything else runs.

   1. Content destruction. An unclosed raw-text tag (<style>, <script>, ...)
      makes marked swallow the rest of the document as that tag's contents; the
      sanitizer then removes it, and the serializer writes the shortened result
      back to the file. A malformed note therefore DELETES the user's text.
      Measured before this guard: a 10-paragraph note kept 2 paragraphs.

      The invariant is: GLYPH NEVER DELETES CONTENT. IT MAY ESCAPE IT SO IT
      STAYS INERT. Escaping the opening bracket makes these render as visible
      literal text — nothing is swallowed, nothing is lost, and the result is
      stable on the next open. This is content preservation, not a security
      control: the DOM sanitizer remains authoritative, so a miss here is free.

   2. Quadratic parsing. marked's emphasis tokenizer is O(n^2) in the number of
      * or _ on a line, so a long run freezes the app on open with no progress
      and no cancel. An LLM emitting a wall of punctuation is enough to trigger
      it; nobody has to be malicious. 200 emphasis characters on one line is 100
      bold spans — real prose never comes close.

   Both skip fenced and indented code, where escaping would put visible
   backslashes into the user's document. */

const SWALLOWING_TAGS =
  /<(\/?)(script|style|iframe|object|embed|noscript|xmp|textarea|template|title|base|link|meta|noembed|noframes|plaintext)\b/gi;
const EMPHASIS_LIMIT = 200;

function guardInput(src) {
  let fence = null;
  const lines = String(src || "").split("\n");

  // An unclosed "<!--" swallows everything after it, and the sanitizer then
  // removes the swallowed text — the same deletion the tag list above prevents,
  // which comments are not part of because they are not tags. Escape only the
  // opener that never gets closed, and only outside code.
  let open = -1, depth = 0, codeFence = null;
  for (let i = 0; i < lines.length; i++) {
    const f = /^\s{0,3}(```+|~~~+)/.exec(lines[i]);
    if (f) {
      if (codeFence && lines[i].trim().startsWith(codeFence)) codeFence = null;
      else if (!codeFence) codeFence = f[1][0].repeat(3);
      continue;
    }
    if (codeFence || /^(\s{4,}|\t)/.test(lines[i])) continue;
    let col = 0;
    for (;;) {
      const o = lines[i].indexOf("<!--", col);
      const c = lines[i].indexOf("-->", col);
      if (o >= 0 && (c < 0 || o < c)) { if (!depth++) open = i; col = o + 4; }
      else if (c >= 0) { if (depth) depth--; col = c + 3; }
      else break;
    }
  }
  if (depth > 0 && open >= 0) {
    lines[open] = lines[open].replace("<!--", "&lt;!--");
  }

  return lines.map((line) => {
    const f = /^\s{0,3}(```+|~~~+)/.exec(line);
    if (f) {
      if (fence && line.trim().startsWith(fence)) fence = null;
      else if (!fence) fence = f[1][0].repeat(3);
      return line;
    }
    if (fence) return line;
    if (/^(\s{4,}|\t)/.test(line)) return line;

    // Two trailing spaces are a hard line break. Rendered they look the same as
    // a soft newline here, but they do NOT elsewhere — in Obsidian a soft
    // newline joins the lines — so dropping them changes how the document reads
    // in the app she also uses. A word-joiner marks them for the serializer and
    // is invisible in the meantime.
    let out = line.replace(/(\S)[ \t]{2,}$/, "$1\u2060");
    out = out.replace(SWALLOWING_TAGS, (m, slash, tag) => "&lt;" + slash + tag);

    // A table row containing [[target|alias]] loses everything after that pipe,
    // because GFM reads it as a column break. Escaping it for the parser fixes
    // the row; the serializer unescapes on the way out, so the file keeps the
    // author's original syntax byte for byte.
    if (/^\s{0,3}\|/.test(out)) {
      // The table parser consumes a backslash escape when it splits cells, so
      // the author's "\\|" cannot be recovered later — both forms are marked
      // here and restored in the renderer. U+E001 was written by the author,
      // U+E000 by us.
      out = out.replace(/\[\[[^\[\]\n]*\]\]/g, (link) =>
        link.replace(/\\\|/g, "\uE001").replace(/\|/g, "\uE000"));
    }

    let stars = 0, unders = 0;
    for (let i = 0; i < out.length; i++) {
      const c = out.charCodeAt(i);
      if (c === 42) stars++;
      else if (c === 95) unders++;
    }
    if (stars > EMPHASIS_LIMIT || unders > EMPHASIS_LIMIT) {
      out = out.replace(/[*_]/g, (m) => "\\" + m);
    }
    return out;
  }).join("\n");
}

/* ---------- sanitizer ----------
   Markdown allows raw HTML and marked passes it straight through, so a document
   is untrusted input: notes arrive from model output, downloads and cloned
   repos. Without this, <img src=x onerror=...> and <svg onload=...> execute in a
   page that holds a bridge to the app and, on macOS, a file:// base URL.

   Allowlist, not blocklist: anything not named here is dropped. Our own trusted
   markup (callout icons, tag chips, the Properties panel) is added AFTER this
   runs, so it is unaffected. */

const SAFE_TAGS = new Set([
  "p", "br", "hr", "div", "span",
  "h1", "h2", "h3", "h4", "h5", "h6",
  "strong", "b", "em", "i", "u", "s", "del", "ins", "mark", "small", "sub", "sup",
  "code", "pre", "kbd", "samp", "var", "abbr", "cite", "q",
  "blockquote", "ul", "ol", "li", "dl", "dt", "dd",
  "a", "img", "input",
  "table", "thead", "tbody", "tfoot", "tr", "th", "td", "caption", "colgroup", "col",
  "details", "summary", "figure", "figcaption",
]);

// Per-element attribute allowlist. Deliberately excludes id and name (DOM
// clobbering), style (CSS injection and url() exfiltration), and every on* handler.
const SAFE_ATTRS = {
  "*": new Set(["title", "lang", "dir"]),
  a: new Set(["href"]),
  img: new Set(["src", "alt", "width", "height", "data-raw"]),
  input: new Set(["type", "checked", "disabled"]),
  td: new Set(["colspan", "rowspan", "align"]),
  th: new Set(["colspan", "rowspan", "align", "scope"]),
  col: new Set(["span"]),
  colgroup: new Set(["span"]),
  ol: new Set(["start", "reversed", "type"]),
  li: new Set(["value"]),
  details: new Set(["open"]),
  span: new Set(["data-raw"]),
  // Validated in the pre-loop step above; only "language-xxx" ever survives,
  // and the serializer reads it to emit the fence language.
  code: new Set(["class"]),
};

function safeURL(value, forImage) {
  const v = String(value || "").trim();
  // Strip control characters before looking at the scheme: "java\tscript:" and
  // "&#x6a;avascript:" are still parsed as a scheme by browsers.
  const flat = v.replace(/[\u0000-\u0020\u00a0\u2028\u2029]/g, "").toLowerCase();
  const scheme = /^([a-z][a-z0-9+.-]*):/.exec(flat);
  // No scheme at all — a relative path, an anchor, a query — is fine.
  if (!scheme) return v;
  const name = scheme[1];
  if (forImage) {
    // http/https are kept so the URL survives into the file untouched; the
    // caller then holds the image behind a click rather than fetching it.
    if (name === "http" || name === "https" || name === "file") return v;
    return /^data:image\/(png|jpe?g|gif|webp|avif|bmp|svg\+xml)[;,]/.test(flat) ? v : null;
  }
  // Allowlist, not deny-list: an unknown scheme is refused rather than passed
  // through, so tomorrow's scheme cannot become today's hole.
  return (name === "http" || name === "https" || name === "mailto") ? v : null;
}

// data-raw is emitted by the wikilink renderer and written back to the file
// verbatim by the serializer, so a document that supplies its own would choose
// what gets saved — text that reads as one thing and saves as another.
function safeDataRaw(value) {
  return /^!?\[\[[^\[\]\n]{1,300}\]\]$/.test(String(value || "")) ? value : null;
}

function scrubNode(root) {
  const drop = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach((el) => {
    const tag = el.tagName.toLowerCase();
    if (!SAFE_TAGS.has(tag)) { drop.push(el); return; }

    // Handled before the loop: the serializer and the render passes key off
    // class names, so a document could use them to choose which of the user's
    // paragraphs are deleted on save (class="props" makes serializeBlock return
    // null), turn a paragraph into a callout, or forge the remote-image notice.
    // Only the code fence language survives, because the serializer reads it.
    const cls = el.getAttribute("class");
    if (cls !== null) {
      const keep = tag === "code" && /^language-[\w+-]+$/.test(cls.trim());
      if (keep) el.setAttribute("class", cls.trim());
      else el.removeAttribute("class");
    }

    const allowed = SAFE_ATTRS[tag];
    [...el.attributes].forEach((attr) => {
      const name = attr.name.toLowerCase();
      // Every event handler, plus anything the allowlists do not name.
      const ok = (SAFE_ATTRS["*"].has(name) || (allowed && allowed.has(name)))
        && !name.startsWith("on");
      if (!ok) { el.removeAttribute(attr.name); return; }
      if (name === "data-raw") {
        if (safeDataRaw(attr.value) === null) el.removeAttribute(attr.name);
        return;
      }
      if (name === "href" || name === "src") {
        const safe = safeURL(attr.value, tag === "img");
        if (safe === null) { el.removeAttribute(attr.name); return; }
        el.setAttribute(attr.name, safe);
        // A remote image loads the moment the note opens, which tells a server
        // you read it — the tracking-pixel trick, and these notes come from
        // elsewhere. Hold it behind one click, the way mail apps do.
        if (name === "src" && /^https?:/i.test(safe)) {
          el.removeAttribute("src");
          el.setAttribute("data-remote-src", safe);
          el.className = ((el.getAttribute("class") || "") + " remote-img").trim();
        } else if (name === "src" && window.__glyphDocDir &&
                   !/^[a-z][a-z0-9+.-]*:/i.test(safe) && !safe.startsWith("//")) {
          // The portable shell loads ONE page and switches documents inside it,
          // so a note's relative image path has nothing to resolve against: the
          // page lives in a temp folder, not next to the note. A single <base>
          // could not follow a tab switch anyway, and the CSP forbids one. So
          // the folder is resolved here, per document, and the original path is
          // kept for the serializer — writing the absolute one back would
          // rewrite the author's file with a path only this machine can follow.
          // macOS sets a real baseURL per document and never sets __glyphDocDir.
          // data-local-src is deliberately NOT in SAFE_ATTRS, so a note cannot
          // forge one and choose what gets written back in its place.
          el.setAttribute("data-local-src", safe);
          el.setAttribute("src", window.__glyphDocDir + safe);
        }
      }
    });

    if (tag === "input" && (el.getAttribute("type") || "").toLowerCase() !== "checkbox") {
      drop.push(el);
    }
  });

  // Unwrap rather than delete, so the words inside a stripped tag survive.
  drop.forEach((el) => {
    if (!el.parentNode) return;
    if (/^(script|style|iframe|object|embed|link|meta|base|template)$/i.test(el.tagName)) {
      el.remove();
      return;
    }
    while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
    el.remove();
  });
  return root;
}

// A <template> parses HTML inertly: scripts do not run and images do not load,
// so nothing fires before the scrub.
function sanitizeHTML(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  scrubNode(tpl.content);
  return tpl.innerHTML;
}
window.glyphSanitize = sanitizeHTML;

/* ---------- frontmatter ---------- */

function splitFrontmatter(src) {
  const m = /^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(src);
  if (!m) return { fm: null, body: src, prefix: "" };
  return { fm: m[1], body: src.slice(m[0].length), prefix: m[0] };
}

function fmValueHtml(val) {
  if (!val) return '<span class="fm-empty">—</span>';
  if (val.includes("\n")) {
    const lines = val.split("\n").map((s) => s.trim()).filter(Boolean);
    if (lines.length && lines.every((l) => l.startsWith("- "))) {
      return lines.map((l) => `<span class="pill">${esc(l.slice(2))}</span>`).join("");
    }
    return `<pre class="fmv">${esc(val)}</pre>`;
  }
  const list = /^\[(.*)\]$/.exec(val);
  if (list) {
    const items = list[1].split(",").map((s) => s.trim()).filter(Boolean);
    if (items.length) {
      return items.map((s) => `<span class="pill">${esc(s.replace(/^["']|["']$/g, ""))}</span>`).join("");
    }
  }
  return esc(val.replace(/^["']|["']$/g, ""));
}

function propsHtml(fm) {
  const lines = fm.split(/\r?\n/);
  const rows = [];
  let i = 0;
  while (i < lines.length) {
    const km = /^([^\s:#][^:]*):\s*(.*)$/.exec(lines[i]);
    if (!km) { i++; continue; }
    const key = km[1].trim();
    let val = km[2].trim();
    const sub = [];
    let j = i + 1;
    while (j < lines.length && /^\s+\S/.test(lines[j])) {
      sub.push(lines[j].replace(/^\s+/, ""));
      j++;
    }
    if (sub.length) {
      val = (val ? val + "\n" : "") + sub.join("\n");
      i = j;
    } else {
      i++;
    }
    rows.push([key, val]);
  }
  if (!rows.length) return "";
  const body = rows
    .map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${fmValueHtml(v)}</td></tr>`)
    .join("");
  return `<details class="props" contenteditable="false" open><summary>Properties</summary><table>${body}</table></details>`;
}

/* ---------- callouts ---------- */

const CALLOUT_META = {
  note: { c: "note", i: "pencil" },
  info: { c: "note", i: "info" },
  todo: { c: "note", i: "check-circle" },

const CALLOUT_ICONS = {
