function calloutIcon(name) {
  const body = CALLOUT_ICONS[name] || CALLOUT_ICONS.pencil;
  return '<svg class="callout-icon" contenteditable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
       + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + body + "</svg>";
}

function transformCallouts(root) {
  root.querySelectorAll("blockquote").forEach((bq) => {
    const p = bq.querySelector(":scope > p:first-child");
    if (!p) return;
    const marker = /^\[!(\w+)\]([+-])?\s?/.exec((p.textContent || "").trimStart());
    if (!marker) return;
    const rawType = marker[1];
    const meta = CALLOUT_META[rawType.toLowerCase()] || CALLOUT_META.note;
    const type = meta.c;
    const icon = calloutIcon(meta.i);

    let html = p.innerHTML.replace(/^\s*\[!\w+\]([+-])?\s*/, "");
    let titleHtml = "";
    let restHtml = "";
    const brAt = html.search(/<br\s*\/?>/i);
    if (brAt >= 0) {
      titleHtml = html.slice(0, brAt).trim();
      restHtml = html.slice(brAt).replace(/^<br\s*\/?>/i, "").trim();
    } else {
      titleHtml = html.trim();
    }
    if (!titleHtml) {
      titleHtml = rawType.charAt(0).toUpperCase() + rawType.slice(1).toLowerCase();
    }

    const fold = marker[2] || "";
    if (restHtml) { p.innerHTML = restHtml; } else { p.remove(); }
    const titleContent = icon + "<span>" + titleHtml + "</span>";

    if (fold) {
      const details = document.createElement("details");
      details.className = "callout";
      details.setAttribute("data-callout", type);
      details.setAttribute("data-raw-type", rawType);
      if (fold === "+") details.open = true;
      const summary = document.createElement("summary");
      summary.className = "callout-title";
      summary.setAttribute("contenteditable", "false");
      summary.innerHTML = titleContent;
      details.appendChild(summary);
      while (bq.firstChild) details.appendChild(bq.firstChild);
      bq.replaceWith(details);
    } else {
      bq.className = "callout";
      bq.setAttribute("data-callout", type);
      bq.setAttribute("data-raw-type", rawType);
      const title = document.createElement("div");
      title.className = "callout-title";
      title.innerHTML = titleContent;
      bq.insertBefore(title, bq.firstChild);
    }
  });
}

function tagTaskItems(root) {
  root.querySelectorAll('li > input[type="checkbox"]').forEach((cb) => {
    cb.parentElement.classList.add("task");
    cb.removeAttribute("disabled");
  });
}

function tagClass(tag) {
  let h = 0;
  for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) >>> 0;
  return "tag-c" + (h % 6);
}

function styleTags(root) {
  const re = /(^|[\s(])#([A-Za-z_][\w/-]*)/g;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || node.nodeValue.indexOf("#") < 0) return NodeFilter.FILTER_SKIP;
      const parent = node.parentElement;
      if (parent && parent.closest("code, pre, a, .wikilink, h1, h2, h3, h4, h5, h6")) {
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((node) => {
    re.lastIndex = 0;
    if (!re.test(node.nodeValue)) return;
    re.lastIndex = 0;
    const span = document.createElement("span");
    span.innerHTML = esc(node.nodeValue).replace(
      re,
      (_, pre, tag) => `${pre}<span class="tag ${tagClass(tag)}">#${tag}</span>`
    );
    node.parentNode.replaceChild(span, node);
  });
}

/* ---------- serializer: formatted DOM -> markdown ---------- */

// The backtick fence for a code span or fenced block, one longer than the
// longest backtick run in the content (CommonMark). A fixed-length fence is a
// silent corruption: a single backtick cannot wrap text that itself contains a
// backtick (`` `a`b` `` reads as code "a" then a stray backtick, not code
// "a`b"), and a three-backtick fence around a body that shows a ``` example
// closes early and splits one block into pieces on the next render.
function backtickFence(content, min) {
  const runs = content.match(/`+/g);
  const n = runs ? Math.max(...runs.map((r) => r.length)) + 1 : min;
  return "`".repeat(Math.max(min, n));
}

// An inline code span whose delimiter adapts to its content, with a space pad
// when the content starts or ends with a backtick so the delimiters stay
// distinct (the reader strips one padding space from each end).
function serializeCodeSpan(text) {
  const fence = backtickFence(text, 1);
  const pad = /^`|`$/.test(text) ||
    (/^ /.test(text) && / $/.test(text) && text.trim() !== "");
  return fence + (pad ? " " + text + " " : text) + fence;
}

// data-remote-src / data-local-src / data-alt / .remote-img are ours, added for
// display only. The file must get back exactly the image the author wrote.
function serializeImg(el) {
  if (el.dataset && el.dataset.raw) return el.dataset.raw;
  const src = el.getAttribute("data-remote-src") ||
    el.getAttribute("data-local-src") || el.getAttribute("src") || "";
  const alt = el.hasAttribute("data-alt")
    ? el.getAttribute("data-alt")
    : (el.getAttribute("alt") || "");
  return `![${alt}](${src})`;
}

// A comment is inert in both engines Glyph runs, and the owner uses them as
// provenance markers, so it is written back as a comment rather than escaped.
function serializeComment(node) {
  const data = node.nodeValue || "";
  if (/--!?>/.test(data)) return "&lt;!--" + data + "--&gt;";
  return "<!--" + data + "-->";
}

function serializeInline(node) {
  let out = "";
  node.childNodes.forEach((ch) => {
    if (ch.nodeType === Node.COMMENT_NODE) { out += serializeComment(ch); return; }
    if (ch.nodeType === Node.TEXT_NODE) {
      out += ch.nodeValue
        .replace(/\u00a0/g, " ")
        .replace(/\u200b/g, "")
        .replace(/\u2060/g, "")
        // marked escapes stray markup into text; writing it back raw would arm
        // it for the next open (and for every other renderer of this file).
        // "a < b" is untouched because only a tag-shaped bracket is escaped.
        .replace(/<(?=\/?[a-zA-Z])/g, "&lt;");
      return;
    }
    if (ch.nodeType !== Node.ELEMENT_NODE) return;
    if (ch.classList && ch.classList.contains("wikilink")) {
      out += ch.dataset.raw || `[[${ch.textContent}]]`;
      return;
    }
    switch (ch.tagName) {
      case "STRONG": case "B": {
        const inner = serializeInline(ch);
        out += inner.trim() ? `**${inner}**` : inner;
        break;
      }
      case "EM": case "I": {
        const inner = serializeInline(ch);
        out += inner.trim() ? `*${inner}*` : inner;
        break;
      }
      case "U": out += `<u>${serializeInline(ch)}</u>`; break;
      case "DEL": case "S": case "STRIKE": out += `~~${serializeInline(ch)}~~`; break;
      case "MARK": out += `==${serializeInline(ch)}==`; break;
      case "CODE": out += serializeCodeSpan(ch.textContent); break;
      case "A": {
        const href = ch.getAttribute("href") || "";
        out += `[${serializeInline(ch)}](${href})`;
        break;
      }
      case "IMG": out += serializeImg(ch); break;
      case "BR": {
        // The marker sits at the end of the text immediately before the break.
        const prev = ch.previousSibling;
        const marked = prev && prev.nodeType === Node.TEXT_NODE &&
                       /\u2060$/.test(prev.nodeValue || "");
        out += marked ? "  \n" : "\n";
        break;
      }
      case "INPUT": case "SVG": case "svg": break;
      case "SPAN": {
        // Chromium/WebView2 sometimes styles a selection with an inline-styled
        // span instead of <b>/<i>. Without this the formatting looks applied on
        // screen and is silently dropped when the file is written.
        const inner = serializeInline(ch);
        const st = ch.style || {};
        const weight = st.fontWeight || "";
        let out2 = inner;
        if (inner.trim()) {
          if (weight === "bold" || weight === "bolder" || parseInt(weight, 10) >= 600) {
            out2 = "**" + out2 + "**";
          }
          if (st.fontStyle === "italic") out2 = "*" + out2 + "*";
          if ((st.textDecorationLine || st.textDecoration || "").indexOf("line-through") >= 0) {
            out2 = "~~" + out2 + "~~";
          }
        }
        out += out2;
        break;
      }
      default: out += serializeInline(ch); break;
    }
  });
  return out;
}

function serializeList(listEl, indent, ordered) {
  const out = [];
  let n = 1;
  listEl.querySelectorAll(":scope > li").forEach((li) => {
    const clone = li.cloneNode(true);
    clone.querySelectorAll(":scope > ul, :scope > ol").forEach((s) => s.remove());
    clone.querySelectorAll('input[type="checkbox"]').forEach((s) => s.remove());
    const text = serializeInline(clone).replace(/\n+/g, " ").trim();
    const checkbox = li.querySelector(':scope > input[type="checkbox"], :scope > p > input[type="checkbox"]');
    let marker = ordered ? `${n}. ` : "- ";
    if (checkbox) marker = `- [${checkbox.checked ? "x" : " "}] `;
    out.push(indent + marker + text);
    li.querySelectorAll(":scope > ul, :scope > ol").forEach((sub) => {
      out.push(serializeList(sub, indent + "    ", sub.tagName === "OL"));
    });
    n++;
  });
  return out.join("\n");
}

function serializeTable(table) {
  const rows = [...table.querySelectorAll("tr")];
  if (!rows.length) return "";
  // Escape pipes that would break the row, but leave the ones inside a wikilink
  // alone — those are the author's syntax and re-escaping them would rewrite the
  // file on every save.
  const escapePipes = (t) => t.split(/(\[\[[^\]]*\]\])/)
    .map((part, i) => (i % 2 ? part : part.replace(/\|/g, "\\|")))
    .join("");
  const cells = (r) => [...r.children].map(
    (c) => escapePipes(serializeInline(c)).replace(/\n/g, " ").trim() || " "
  );
  const header = cells(rows[0]);
  let out = "| " + header.join(" | ") + " |\n";
  out += "|" + header.map(() => " --- ").join("|") + "|";
  for (let i = 1; i < rows.length; i++) {
    out += "\n| " + cells(rows[i]).join(" | ") + " |";
  }
  return out;
}

function serializeCallout(el) {
  const type = el.dataset.rawType || el.dataset.callout || "note";
  const isDetails = el.tagName === "DETAILS";
  const fold = isDetails ? (el.open ? "+" : "-") : "";
  const titleEl = el.querySelector(":scope > .callout-title");
  let title = "";
  if (titleEl) {
    const span = titleEl.querySelector("span");
    title = (span ? span.textContent : titleEl.textContent).replace(/\u00a0/g, " ").replace(/\u200b/g, "").trim();
  }
  const bodyParts = [];
  el.childNodes.forEach((ch) => {
    if (ch === titleEl) return;
    if (ch.nodeType === Node.COMMENT_NODE) { bodyParts.push(serializeComment(ch)); return; }
    if (ch.nodeType === Node.ELEMENT_NODE) {
      const s = serializeBlock(ch);
      if (s !== null && s !== "") bodyParts.push(s);
    } else if (ch.nodeType === Node.TEXT_NODE && ch.nodeValue.trim()) {
      bodyParts.push(ch.nodeValue.trim());
    }
  });
  const head = `[!${type}]${fold}${title ? " " + title : ""}`;
  const body = bodyParts.join("\n\n");
  const lines = [head, ...(body ? body.split("\n") : [])];
  return lines.map((l) => (l ? "> " + l : ">")).join("\n");
}

function serializeBlock(el) {
  if (el.classList && el.classList.contains("props")) return null;
  if (el.classList && el.classList.contains("callout")) return serializeCallout(el);
  switch (el.tagName) {
    case "H1": return "# " + serializeInline(el).trim();
    case "H2": return "## " + serializeInline(el).trim();
    case "H3": return "### " + serializeInline(el).trim();
    case "H4": return "#### " + serializeInline(el).trim();
    case "H5": return "##### " + serializeInline(el).trim();
    case "H6": return "###### " + serializeInline(el).trim();
    case "P": case "DIV": {
      // Editing can leave real blocks nested inside a paragraph wrapper.
      if (el.querySelector(":scope > ul, :scope > ol, :scope > table, :scope > pre, " +
                           ":scope > blockquote, :scope > h1, :scope > h2, :scope > h3, " +
                           ":scope > h4, :scope > h5, :scope > h6")) {
        const parts = [];
        el.childNodes.forEach((ch) => {
          if (ch.nodeType === Node.ELEMENT_NODE) {
            const s = serializeBlock(ch);
            if (s !== null && s !== "") parts.push(s);
          } else if (ch.nodeType === Node.TEXT_NODE && ch.nodeValue.trim()) {
            parts.push(ch.nodeValue.replace(/\u00a0/g, " ").trim());
          }
        });
        return parts.length ? parts.join("\n\n") : null;
      }
      const t = serializeInline(el).replace(/\n+$/, "");
      if (t.trim()) return t;
      // Not empty — an intentional blank answer line. Emitted as the entity so
      // it survives, and so no invisible character enters the file (rule 7).
      return (el.textContent || "").indexOf("\u00a0") >= 0 ? "&nbsp;" : null;
    }
    case "UL": return serializeList(el, "", false);
    case "OL": return serializeList(el, "", true);
    case "BLOCKQUOTE": {
      const parts = [];
      el.childNodes.forEach((ch) => {
        if (ch.nodeType === Node.COMMENT_NODE) { parts.push(serializeComment(ch)); return; }
        if (ch.nodeType === Node.ELEMENT_NODE) {
          const s = serializeBlock(ch);
          if (s !== null && s !== "") parts.push(s);
        } else if (ch.nodeType === Node.TEXT_NODE && ch.nodeValue.trim()) {
          parts.push(ch.nodeValue.trim());
        }
      });
      return parts.join("\n\n").split("\n").map((l) => (l ? "> " + l : ">")).join("\n");
    }
    case "PRE": {
      const code = el.querySelector("code");
      const langMatch = code ? /language-([\w+-]+)/.exec(code.className || "") : null;
      const lang = langMatch ? langMatch[1] : "";
      const body = (code || el).textContent.replace(/\n$/, "");
      const fence = backtickFence(body, 3);
      return fence + lang + "\n" + body + "\n" + fence;
    }
    case "TABLE": return serializeTable(el);
    case "IMG": return serializeImg(el);
    case "HR": return "---";
    default:
      return el.outerHTML;
  }
}

function serializeDoc() {
  const md = document.getElementById("md");
  if (!md) return lastSerialized;
  const parts = [];
  md.childNodes.forEach((el) => {
    if (el.nodeType === Node.COMMENT_NODE) { parts.push(serializeComment(el)); return; }
    if (el.nodeType === Node.TEXT_NODE) {
      const t = el.nodeValue.trim();
      if (t) parts.push(t);
      return;
    }
    if (el.nodeType !== Node.ELEMENT_NODE) return;
    const s = serializeBlock(el);
    if (s !== null && s !== "") parts.push(s);
  });
  return parts.length ? parts.join("\n\n") + "\n" : "";
}

/* ---------- live editing session ---------- */

let curPrefix = "";
let lastSerialized = "";
let syncTimer = null;

// Which modifier means "command" here. The shell may set __glyphPlatform before
// the page loads; otherwise sniff. On macOS this resolves to "mac" with no shell
// change at all, so the existing app is untouched.
window.__glyphPlatform = window.__glyphPlatform ||
  (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? "mac"
    : /Win/.test(navigator.userAgent) ? "win" : "linux");
const MOD = (e) => (window.__glyphPlatform === "mac" ? e.metaKey : e.ctrlKey);

// One exit point, four hosts. WKWebView (macOS) takes the object directly;
// WebView2 (Windows) only accepts strings and publishes its bridge
// asynchronously during startup — so an early edit must queue rather than vanish.
// Dropping a message here would be invisible: doSync() has already recorded the
// text as synced, so the file would silently stop receiving edits.
//
// __glyphNative is the portable shell (shell/glyph.cc), which binds one function
// through the webview library on all three platforms. It is checked BEFORE
// chrome.webview because on Windows that object belongs to the LIBRARY's own
// bind protocol: our message would be delivered to a handler that cannot read it
// and would be dropped without a word. macOS is unaffected either way — it
// registers the `glyph` handler and never reaches this far down.
const __glyphPending = [];

function __glyphBridgeReady() {
  return !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.glyph) ||
    typeof window.__glyphNative === "function" ||
    !!(window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === "function");
}

function __glyphDeliver(msg) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.glyph) {
    window.webkit.messageHandlers.glyph.postMessage(msg);
    return true;
  }
  if (typeof window.__glyphNative === "function") {
    window.__glyphNative(JSON.stringify(msg));
    return true;
  }
  if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === "function") {
    window.chrome.webview.postMessage(JSON.stringify(msg));
    return true;
  }
  return false;
}

function postToApp(msg) {
  if (__glyphDeliver(msg)) return;
  // Running as a standalone page: the chrome layer is the shell.
  if (window.__glyphLocalSink) { window.__glyphLocalSink(msg); return; }
  __glyphPending.push(msg);
  if (__glyphPending.length > 1) return;
  let tries = 0;
  const timer = setInterval(() => {
    if (__glyphBridgeReady()) {
      clearInterval(timer);
      __glyphPending.splice(0).forEach(__glyphDeliver);
    } else if (++tries > 100) {
      clearInterval(timer);
    }
  }, 50);
}

function doSync() {
  if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
  const md = serializeDoc();
  const full = curPrefix + md;
  if (md !== lastSerialized) {
    lastSerialized = md;
    postToApp({ type: "source", text: full });
  }
  // Returned so the app can flush synchronously before saving or closing,
  // instead of posting and hoping a fixed delay was long enough.
  return full;
}
window.glyphFlush = doSync;
window.glyphSerialize = serializeDoc;

function scheduleSync() {
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(doSync, 600);
}

function currentBlock() {
  const sel = getSelection();
  if (!sel.rangeCount) return null;
  let n = sel.anchorNode;
  if (!n) return null;
  if (n.nodeType === Node.TEXT_NODE) n = n.parentElement;
  const md = document.getElementById("md");
  if (!md.contains(n)) return null;
  while (n && n.parentElement !== md) n = n.parentElement;
  return n;
}

/* Markdown-as-you-type: block rules fire when the block contains only the marker. */
function tryBlockRules() {
  const sel = getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return false;

  // Inside a list item, "[ ] " / "[x] " turns the item into a checkbox.
  let selEl = sel.anchorNode;
  if (selEl && selEl.nodeType === Node.TEXT_NODE) selEl = selEl.parentElement;
  const inLi = selEl && selEl.closest ? selEl.closest("#md li") : null;
  if (inLi && !inLi.querySelector(':scope > input[type="checkbox"]')) {
    const t = (inLi.textContent || "").replace(/\u00a0/g, " ");
    const tm = /^\[( |x)?\] $/.exec(t);
    if (tm) {
      inLi.textContent = "";
      inLi.classList.add("task");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      if (tm[1] === "x") cb.checked = true;
      inLi.appendChild(cb);
      const r = document.createRange();
      r.selectNodeContents(inLi);
      r.collapse(false);
      sel.removeAllRanges();
      sel.addRange(r);
      return true;
    }
  }

  const blk = currentBlock();
  if (!blk || !(blk.tagName === "P" || blk.tagName === "DIV")) return false;
  const text = (blk.textContent || "").replace(/\u00a0/g, " ");

  const clearBlock = () => {
    const r = document.createRange();
    r.selectNodeContents(blk);
    sel.removeAllRanges();
    sel.addRange(r);
    document.execCommand("delete");
  };

  // The browser sometimes nests the freshly made list inside the old
  // paragraph; unwrap it and put the caret back in the item.
  const convertToList = (ordered) => {
    clearBlock();
    document.execCommand(ordered ? "insertOrderedList" : "insertUnorderedList");
    const sel2 = getSelection();
    let li = sel2.anchorNode;
    if (li && li.nodeType === Node.TEXT_NODE) li = li.parentElement;
    li = li && li.closest ? li.closest("li") : null;
    if (!li) return null;
    const list = li.parentElement;
    const wrap = list ? list.parentElement : null;
    if (wrap && /^(P|DIV)$/.test(wrap.tagName) && wrap.parentElement &&
        (wrap.textContent || "").trim() === (list.textContent || "").trim()) {
      wrap.replaceWith(list);
    }
    const r = document.createRange();
    r.selectNodeContents(li);
    r.collapse(false);
    sel2.removeAllRanges();
    sel2.addRange(r);
    return li;
  };

  let m;
  if ((m = /^(#{1,6}) $/.exec(text))) {
    const level = m[1].length;
    clearBlock();
    document.execCommand("formatBlock", false, "<h" + level + ">");
    return true;
  }
  if (/^[-*] \[[ x]?\] ?$/.test(text)) {
    const li = convertToList(false);
    if (li) {
      li.classList.add("task");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      li.insertBefore(cb, li.firstChild);
      const r = document.createRange();
      r.selectNodeContents(li);
      r.collapse(false);
      sel.removeAllRanges();
      sel.addRange(r);
    }
    return true;
  }
  if (/^[-*] $/.test(text)) {
    convertToList(false);
    return true;
  }
  if (/^1[.)] $/.test(text)) {
    convertToList(true);
    return true;
  }
  if (/^> $/.test(text)) {
    clearBlock();
    document.execCommand("formatBlock", false, "<blockquote>");
    return true;
  }
  return false;
}

/* Inline rules: closing **bold**, *italic*, ==mark==, ~~strike~~, `code` converts live. */
function tryInlineRules() {
  const sel = getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return false;
  const node = sel.anchorNode;
  if (!node || node.nodeType !== Node.TEXT_NODE) return false;
  const parent = node.parentElement;
  if (!parent || parent.closest("code, pre")) return false;
  const upto = node.nodeValue.slice(0, sel.anchorOffset);
  const rules = [
    { re: /\*\*([^*\n]+)\*\*$/, tag: "strong" },
    { re: /(^|[^*])\*([^*\n]+)\*$/, tag: "em", group: 2 },
    { re: /==([^=\n]+)==$/, tag: "mark" },
    { re: /~~([^~\n]+)~~$/, tag: "del" },
    { re: /`([^`\n]+)`$/, tag: "code" },
  ];
  for (const r of rules) {
    const m = r.re.exec(upto);
    if (!m) continue;
    const inner = m[r.group || 1];
    const matchLen = r.group ? m[0].length - m[1].length : m[0].length;
    const start = sel.anchorOffset - matchLen;
    const range = document.createRange();
    range.setStart(node, start);
    range.setEnd(node, sel.anchorOffset);
    const el = document.createElement(r.tag);
    el.textContent = inner;
    range.deleteContents();
    range.insertNode(el);
    const space = document.createTextNode("\u200b");
    el.parentNode.insertBefore(space, el.nextSibling);
    const after = document.createRange();
    after.setStart(space, 1);
    after.collapse(true);
    sel.removeAllRanges();
    sel.addRange(after);
    return true;
  }
  return false;
}

/* ---------- toolbar API (called from the native formatting bar) ---------- */

function wrapSelectionWith(tag) {
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const container = range.startContainer.nodeType === Node.TEXT_NODE
    ? range.startContainer.parentElement
    : range.startContainer;
  const existing = container && container.closest(tag);
  if (existing && document.getElementById("md").contains(existing)) {
    const parent = existing.parentNode;
    while (existing.firstChild) parent.insertBefore(existing.firstChild, existing);
    existing.remove();
    return;
  }
  const el = document.createElement(tag);
  try {
    range.surroundContents(el);
  } catch (e) {
    const frag = range.extractContents();
    el.appendChild(frag);
    range.insertNode(el);
  }
  sel.removeAllRanges();
  const r = document.createRange();
  r.selectNodeContents(el);
  sel.addRange(r);
}

function insertBlockAfterCurrent(node) {
  const blk = currentBlock();
  const md = document.getElementById("md");
  if (blk) blk.insertAdjacentElement("afterend", node);
  else md.appendChild(node);
  const sel = getSelection();
  const r = document.createRange();
  r.selectNodeContents(node.querySelector("p, td, span") || node);
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);
}

window.glyphToolbar = function (cmd) {
  const md = document.getElementById("md");
  md.focus();
  switch (cmd) {
    case "bold": document.execCommand("bold"); break;
    case "italic": document.execCommand("italic"); break;
    case "underline": document.execCommand("underline"); break;
    case "strike": document.execCommand("strikeThrough"); break;
    case "highlight": wrapSelectionWith("mark"); break;
    case "code": wrapSelectionWith("code"); break;
    case "h1": case "h2": case "h3": {
      const blk = currentBlock();
      const target = cmd.toUpperCase();
      document.execCommand("formatBlock", false,
        blk && blk.tagName === target ? "<p>" : "<" + cmd + ">");
      break;
    }
    case "bullets": document.execCommand("insertUnorderedList"); break;
    case "quote": document.execCommand("formatBlock", false, "<blockquote>"); break;
    case "codeblock": document.execCommand("formatBlock", false, "<pre>"); break;
    case "checklist": {
      const ul = document.createElement("ul");
      const li = document.createElement("li");
      li.className = "task";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      li.appendChild(cb);
      li.appendChild(document.createTextNode(" "));
      ul.appendChild(li);
      insertBlockAfterCurrent(ul);
      break;
    }
    case "link": {
      const sel = getSelection();
      if (sel.rangeCount && !sel.isCollapsed) {
        document.execCommand("createLink", false, "url");
      } else {
        document.execCommand("insertHTML", false, '<a href="url">link text</a>');
      }
      break;
    }
    case "callout": {
      const d = document.createElement("div");
      d.className = "callout";
      d.setAttribute("data-callout", "tip");
      d.setAttribute("data-raw-type", "tip");
      d.innerHTML = '<div class="callout-title">' + calloutIcon("flame")
        + "<span>Title</span></div><p>Text</p>";
      insertBlockAfterCurrent(d);
      break;
    }
    case "table": {
      const t = document.createElement("table");
      t.innerHTML = "<thead><tr><th>Column</th><th>Column</th></tr></thead>"
        + "<tbody><tr><td>Cell</td><td>Cell</td></tr></tbody>";
      insertBlockAfterCurrent(t);
      break;
    }
    case "eraser": document.execCommand("removeFormat"); break;
    case "undo": document.execCommand("undo"); break;
    case "redo": document.execCommand("redo"); break;
  }
  scheduleSync();
};

window.glyphInsertImage = function (src) {
  const md = document.getElementById("md");
  md.focus();
  document.execCommand("insertImage", false, src);
  scheduleSync();
};

/* ---------- render ---------- */

function ensureTrailingParagraph(md) {
  const last = md.lastElementChild;
  if (!last || /^(TABLE|PRE|UL|OL|BLOCKQUOTE|DETAILS|HR)$/.test(last.tagName) ||
      (last.classList && last.classList.contains("callout"))) {
    const p = document.createElement("p");
    p.innerHTML = "<br>";
    md.appendChild(p);
  }
}

function attachEditing(md) {
  md.contentEditable = "true";
  md.spellcheck = false;
  document.execCommand("defaultParagraphSeparator", false, "p");

  // Chromium sometimes emits <span style="font-weight:700"> where WebKit emits
  // <b>. Asking for tags rather than inline CSS keeps the serializer's job simple.
  try { document.execCommand("styleWithCSS", false, false); } catch (e) {}

  md.addEventListener("input", (e) => {
    // Never rewrite the DOM mid-composition: with a CJK or accent IME the typing
    // rules would inject nodes into a live composition and corrupt it.
    if (e && e.isComposing) { scheduleSync(); return; }
    // Deferred so the browser's own editing operation finishes first;
    // running conversions re-entrantly makes them half-apply.
    setTimeout(() => { tryBlockRules() || tryInlineRules(); }, 0);
    scheduleSync();
  });

  md.addEventListener("keydown", (e) => {
    if (MOD(e) && (e.key === "s" || e.key === "e")) { doSync(); return; }
    if (e.key === "Enter" && !e.shiftKey) {
      const blk = currentBlock();
      if (blk && /^H[1-6]$/.test(blk.tagName)) {
        e.preventDefault();
        const p = document.createElement("p");
        p.innerHTML = "<br>";
        blk.insertAdjacentElement("afterend", p);
        const sel = getSelection();
        const r = document.createRange();
        r.setStart(p, 0);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
        scheduleSync();
      }
    }
  });

  // Paste as plain text; pasted markdown becomes formatted after a quick re-render.
  md.addEventListener("paste", (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    if (!text) return;
    document.execCommand("insertText", false, text);
    if (/[#*`>\[\]|=~-]/.test(text) && text.includes("\n")) {
      setTimeout(() => {
        doSync();
        window.renderMarkdown(curPrefix + lastSerialized);
      }, 120);
    }
  });

  md.addEventListener("change", (e) => {
    if (e.target && e.target.matches && e.target.matches('input[type="checkbox"]')) {
      scheduleSync();
    }
  });

  md.addEventListener("toggle", () => scheduleSync(), true);

  md.addEventListener("click", (e) => {
    const a = e.target.closest ? e.target.closest("a") : null;
    if (a && MOD(e)) {
      e.preventDefault();
      postToApp({ type: "openURL", url: a.href });
    }
  });

  const modName = window.__glyphPlatform === "mac" ? "⌘" : "Ctrl";
  md.querySelectorAll("a").forEach((a) => { a.title = modName + "-click to open"; });

  // A wikilink names a note. The app resolves the name — the page never sends a
  // path and never builds an href, so a document cannot point this anywhere.
  md.querySelectorAll("span.wikilink").forEach((el) => {
    const raw = el.getAttribute("data-raw") || "";
    const target = raw.replace(/^!?\[\[/, "").replace(/\]\]$/, "");
    el.title = modName + "-click to open this note";
    el.addEventListener("click", (e) => {
      if (!MOD(e)) return;          // plain click still places the cursor
      e.preventDefault();
      e.stopPropagation();
      postToApp({ type: "openWikilink", target: target });
    });
  });

  // Click a held-back remote image to fetch it.
  md.querySelectorAll("img.remote-img").forEach((img) => {
    let host = "";
    try { host = new URL(img.dataset.remoteSrc).host; } catch (e) {}
    // Keep the author's alt text: the placeholder label is only for display, and
    // overwriting alt would write our label into the user's file on the next save.
    if (!img.hasAttribute("data-alt")) img.setAttribute("data-alt", img.getAttribute("alt") || "");
    img.setAttribute("alt", "Remote image" + (host ? " from " + host : "") + " — click to load");
    img.title = "This image lives on " + (host || "another server") +
      ". Loading it tells that server you opened this note.";
    img.addEventListener("click", () => {
      img.setAttribute("alt", img.getAttribute("data-alt") || "");
      img.src = img.dataset.remoteSrc;
      img.classList.remove("remote-img");
    }, { once: true });
  });
}

// Past this size, both marked and the sanitizer run long enough on the main
// thread to freeze the window (a 3.3MB note never finished). The macOS app
// guards this natively and opens such files raw; the portable shell has no
// native editor, so the chrome layer installs __glyphRawFallback and the render
// bails to the raw textarea instead of parsing. macOS never sets that hook (and
// never sends a document this large here), so it is unaffected.
const GLYPH_RENDER_LIMIT = 300000;

window.renderMarkdown = function (src) {
  if (typeof window.__glyphRawFallback === "function" &&
      src && src.length > GLYPH_RENDER_LIMIT) {
    window.__glyphRawFallback(src);
    return;
  }
  const y = window.scrollY;
  const { fm, body, prefix } = splitFrontmatter(src || "");
  curPrefix = prefix;
  lastSerialized = body.length && !body.endsWith("\n") ? body + "\n" : body;
  let html = "";
  if (fm && fm.trim()) html += propsHtml(fm);
  let mdHtml = "";
  try {
    // Sanitize before anything reaches the document. Our own trusted markup —
    // callout icons, tag chips, the Properties panel — is added afterwards.
    mdHtml = sanitizeHTML(marked.parse(guardInput(body)));
  } catch (e) {
    mdHtml = `<pre>${esc(body)}</pre>`;
  }
  html += `<article id="md">${mdHtml}</article>`;
  const content = document.getElementById("content");
  content.innerHTML = html;
  const md = document.getElementById("md");
  // Restore the class the sanitizer stripped, only where our own renderer put a
  // validated data-raw. A document cannot reach this: its data-raw was dropped.
  md.querySelectorAll("span[data-raw]").forEach((el) => el.classList.add("wikilink"));
  transformCallouts(md);
  tagTaskItems(md);
  styleTags(md);
  ensureTrailingParagraph(md);
  attachEditing(md);
  // attachEditing re-enables editing unconditionally, so a document already
  // judged unsafe to write back must be re-protected here — otherwise toggling
  // to the raw view and back silently removed both the lock and the warning.
  if (window.__glyphProtected) {
    window.glyphSetProtected(true, window.__glyphProtectedDetail);
  }
  window.scrollTo(0, y);
};

// The whole markdown of the open document, frontmatter included.
// Called by the app when a document does not survive a render/serialize cycle
// intact. The formatted view is where the serializer writes, so switching it off
// is what protects the file; the raw view (Cmd-E) writes the text literally and
// stays available.
window.__glyphProtected = false;
window.__glyphProtectedDetail = "";

window.glyphSetProtected = function (on, detail) {
  window.__glyphProtected = !!on;
  window.__glyphProtectedDetail = detail || "";
  const md = document.getElementById("md");
  const content = document.getElementById("content");
  if (!md || !content) return;
  const existing = document.getElementById("glyph-protected");
  if (existing) existing.remove();
  md.contentEditable = on ? "false" : "true";
  if (!on) return;
  const note = document.createElement("div");
  note.id = "glyph-protected";
  note.setAttribute("contenteditable", "false");
  note.innerHTML = "<b>Read-only — protecting this file.</b> Glyph cannot rewrite "
    + "this document exactly as it was written"
    + (detail ? " (" + detail + ")" : "")
    + ", so editing here is switched off rather than risk changing it. "
    + "Press \u2318E for the raw markdown, which edits and saves the text exactly.";
  content.insertBefore(note, content.firstChild);
};

window.glyphGetText = function () {
  return curPrefix + serializeDoc();
};

/* ================= optional chrome =================
   Tabs, toolbar, open/save, word count, theme and a raw view — everything the
   macOS app gets from AppKit. Runs ONLY when window.__glyphChrome is set, so on
   macOS not one element is created and not one listener is bound. */
window.__glyphInstallChrome = function () {
  const MODNAME = window.__glyphPlatform === "mac" ? "⌘" : "Ctrl";
  const svg = (d) =>
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round">' + d + "</svg>";

  const ICON = {
    undo: svg('<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>'),
    redo: svg('<path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>'),
    bold: svg('<path d="M6 4h8a4 4 0 0 1 0 8H6z"/><path d="M6 12h9a4 4 0 0 1 0 8H6z"/>'),
    italic: svg('<line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/>'),
    underline: svg('<path d="M6 3v7a6 6 0 0 0 12 0V3"/><line x1="4" y1="21" x2="20" y2="21"/>'),
    strike: svg('<path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/>'),
    highlight: svg('<path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-4.2-4.2a2 2 0 0 1 0-2.8L15 5"/>'),
    code: svg('<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>'),
    link: svg('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'),
    image: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>'),
    bullets: svg('<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>'),
    checklist: svg('<polyline points="3 7 5 9 9 5"/><polyline points="3 17 5 19 9 15"/><line x1="13" y1="7" x2="21" y2="7"/><line x1="13" y1="17" x2="21" y2="17"/>'),
    quote: svg('<path d="M10 11H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6a4 4 0 0 1-4 4"/><path d="M20 11h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6a4 4 0 0 1-4 4"/>'),
    callout: svg('<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'),
    table: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/>'),
    codeblock: svg('<path d="M8 3H7a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-1"/>'),
    eraser: svg('<path d="M20 20H7L3 16a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 20"/>'),
    open: svg('<path d="M4 20h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-7L11 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/>'),
    save: svg('<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>'),
    raw: svg('<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>'),
    theme: svg('<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>'),
  };

  /* ---------- documents ---------- */
  let docs = [];
  let activeId = null;
  let nextId = 1;

  const active = () => docs.find((d) => d.id === activeId) || null;

  // Edits arrive here instead of a native shell.
  window.__glyphLocalSink = function (msg) {
    if (!msg || msg.type !== "source") return;
    const d = active();
    if (!d) return;
    if (d.text !== msg.text) {
      d.text = msg.text;
      d.dirty = true;
      paintTabs();
      // In server mode a changed document autosaves to its file on the server.
      if (serverHost() && d.serverPath) scheduleServerSave(d);
    }
    paintStatus();
  };

  function captureActive() {
    const d = active();
    if (!d) return;
    if (document.body.classList.contains("glyph-raw")) {
      if (rawArea.value !== d.text) { d.text = rawArea.value; d.dirty = true; }
    } else {
      const now = window.glyphGetText();
      if (now !== d.text) { d.text = now; d.dirty = true; }
    }
    d.scrollY = window.scrollY;
    // Switching away from a note flushes its edit now, so nothing is left
    // waiting on a tab that may be evicted before its timer fires.
    if (serverHost() && d.serverPath && d.dirty) scheduleServerSave(d, { immediate: true });
  }

  // A native host is present when the portable shell has bound its one
  // function. Then files are opened and saved through real dialogs instead of
  // the browser's, which matters because showOpenFilePicker does not exist in
  // WebKitGTK at all and is unavailable on the file:// page the shell loads.
  const nativeHost = () => typeof window.__glyphNative === "function";

  // The Glyph server (server/glyph-server.mjs) serves this page and a folder of
  // .md files. In that mode, open reads a file over its API, and every edit
  // autosaves back to it — there is one copy of the file, on the server, so the
  // phone is a live window into it rather than a second copy to reconcile.
  const serverHost = () => !!window.__glyphServer;
  if (serverHost()) {
    // The token arrives once in the URL fragment (never sent to the server), is
    // stored, and is stripped from the address bar. After that the phone is
    // paired until localStorage is cleared.
    const m = (location.hash || "").match(/token=([a-f0-9]+)/);
    if (m) {
      try { localStorage.setItem("glyphToken", m[1]); } catch (e) { /* private mode */ }
      history.replaceState(null, "", location.pathname + location.search);
    }
  }
  function glyphToken() {
    try { return localStorage.getItem("glyphToken") || ""; } catch (e) { return ""; }
  }
  function glyphApi(path, opts) {
    opts = opts || {};
    return fetch(path, Object.assign({}, opts, {
      headers: Object.assign({ Authorization: "Bearer " + glyphToken() }, opts.headers || {}),
    }));
  }

  // A .txt is PLAIN TEXT, not markdown: it opens in the literal view and stays
  // there, so the renderer and serializer never touch it and it is saved exactly
  // as typed. The formatted view normalizes what it edits (bullet markers,
  // spacing) — right for a .md, wrong for a file that must come back byte for
  // byte. Mirrors -isPlainText in the macOS app.
  const PLAIN_EXT = /\.(txt|text|log)$/i;
  const isPlainName = (name) => PLAIN_EXT.test(name || "");

  function openDoc(name, text, handle, dir) {
    const d = { id: nextId++, name: name || "Untitled.md", text: text || "",
                dirty: false, handle: handle || null, scrollY: 0,
                dir: dir || null, plain: isPlainName(name) };
    docs.push(d);
    activate(d.id);
    return d;
  }

  function activate(id) {
    if (activeId === id) return;
    if (activeId != null) captureActive();
    activeId = id;
    const d = active();
    if (!d) return;
    // Each tab's images resolve against its OWN folder, so this must be set
    // before the render and cleared for a document that has no folder yet.
    if (nativeHost()) {
      window.__glyphDocDir = d.dir || null;
      // Which tab is in front decides which folder the shell resolves a
      // relative link against. Without this it answers for whichever document
      // opened first, and a link in the second note looks beside the first one.
      postToApp({ type: "active", id: d.id });
    }
    if (d.plain) {
      // Plain text never reaches the renderer. The literal view IS the editor
      // for it, so the file comes back exactly as it went in.
      document.body.classList.add("glyph-raw");
      rawArea.value = d.text;
    } else {
      document.body.classList.remove("glyph-raw");
      window.renderMarkdown(d.text);
    }
    paintTabs();
    paintStatus();
    document.title = d.name + " — Glyph";
    window.scrollTo(0, d.scrollY || 0);
  }

  function closeDoc(id) {
    const i = docs.findIndex((d) => d.id === id);
    if (i < 0) return;
    const d = docs[i];
    if (d.dirty && !confirm('"' + d.name + '" has unsaved changes. Close it anyway?')) return;
    docs.splice(i, 1);
    if (activeId === id) {
      activeId = null;
      if (docs.length) activate(docs[Math.min(i, docs.length - 1)].id);
      else openDoc("Untitled.md", "");
    }
    paintTabs();
  }

  /* ---------- files ---------- */
  const canPick = typeof window.showOpenFilePicker === "function";
  const MD_TYPES = [{ description: "Markdown", accept: { "text/markdown": [".md", ".markdown", ".mdown", ".mkd"] } }];

  async function doOpen() {
    if (serverHost()) { toggleDrawer(); return; }
    if (nativeHost()) { postToApp({ type: "pickOpen" }); return; }
    if (canPick) {
      try {
        const handles = await window.showOpenFilePicker({ multiple: true, types: MD_TYPES });
        for (const h of handles) {
          const f = await h.getFile();
          openDoc(f.name, await f.text(), h);
        }
      } catch (e) { /* user cancelled */ }
      return;
    }
    fileInput.click();
  }

  async function doSave() {
    captureActive();
    const d = active();
    if (!d) return;
    if (serverHost()) {
      // Autosave already keeps the file current; this flushes it now. It forces
      // past the stale-write check ONLY when a conflict is already showing — so
      // a reflexive Save cannot silently overwrite a version edited on the
      // computer, but a deliberate second Save after the warning does.
      if (d.serverPath) scheduleServerSave(d, { immediate: true, force: d.conflict === true });
      return;
    }
    if (nativeHost()) {
      // The shell owns the path. It writes the file, or asks for one if this
      // document has never been saved, and reports back through __glyphSaved.
      postToApp({ type: "save", id: d.id, name: d.name, text: d.text });
      return;
    }
    if (canPick) {
      try {
        let h = d.handle;
        if (!h) {
          h = await window.showSaveFilePicker({ suggestedName: d.name, types: MD_TYPES });
          d.handle = h;
          d.name = h.name || d.name;
        }
        const w = await h.createWritable();
        await w.write(d.text);
        await w.close();
        d.dirty = false;
        paintTabs();
        flash("Saved");
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    // Browsers without the file-system API can still download the file.
    const blob = new Blob([d.text], { type: "text/markdown" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = d.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    d.dirty = false;
    paintTabs();
    flash("Downloaded");
  }

  async function loadFiles(fileList) {
    for (const f of fileList) {
      if (!/\.(md|markdown|mdown|mkd|txt)$/i.test(f.name)) continue;
      openDoc(f.name, await f.text(), null);
    }
  }

  /* ---------- server mode ---------- */
  // The file browser drawer and the read/autosave loop against the Glyph server.
  // All of this is inert unless serverHost() — the native app and the plain
  // standalone page never build it.
  const drawer = document.createElement("aside");
  drawer.id = "glyph-drawer";
  const backdrop = document.createElement("div");
  backdrop.id = "glyph-drawer-backdrop";
  backdrop.addEventListener("click", () => closeDrawer());
  if (serverHost()) {
    document.body.appendChild(backdrop);
    document.body.appendChild(drawer);
  }

  function openDrawer() { document.body.classList.add("glyph-drawer-open"); }
  function closeDrawer() { document.body.classList.remove("glyph-drawer-open"); }
  function toggleDrawer() {
    if (document.body.classList.contains("glyph-drawer-open")) closeDrawer();
    else { openDrawer(); loadServerList(); }
  }

  let serverFiles = [];
  async function loadServerList() {
    drawer.innerHTML = '<div class="glyph-drawer-head">Loading…</div>';
    try {
      const res = await glyphApi("/api/files");
      if (res.status === 401) { drawer.innerHTML = drawerError("Not paired. Reopen the link from the server."); return; }
      if (!res.ok) { drawer.innerHTML = drawerError("Could not reach the server."); return; }
      const data = await res.json();
      serverFiles = data.files || [];
      renderDrawer(data.root || "Files");
    } catch (e) {
      drawer.innerHTML = drawerError("Offline — the computer is not reachable.");
    }
  }

  function drawerError(msg) {
    const d = document.createElement("div");
    d.className = "glyph-drawer-head";
    d.textContent = msg;
    return d.outerHTML;
  }

  // Which folders are expanded, remembered between visits.
  const openFolders = (() => {
    try { return new Set(JSON.parse(localStorage.getItem("glyphOpenFolders") || "[]")); }
    catch (e) { return new Set(); }
  })();
  function rememberFolders() {
    try { localStorage.setItem("glyphOpenFolders", JSON.stringify([...openFolders])); }
    catch (e) { /* private mode */ }
  }

  function buildTree(files) {
    const root = { dirs: new Map(), files: [], count: 0 };
    for (const f of files) {
      const parts = f.path.split("/");
      const base = parts.pop();
      let node = root;
      node.count++;
      for (const p of parts) {
        if (!node.dirs.has(p)) node.dirs.set(p, { dirs: new Map(), files: [], count: 0 });
        node = node.dirs.get(p);
        node.count++;
      }
      node.files.push({ path: f.path, base: base });
    }
    return root;
  }

  // Markdown loses its extension — it is the norm here — while a .txt keeps it,
  // so it is obvious at a glance which files are plain text.
  function fileLabel(base) {
    return isPlainName(base) ? base : base.replace(/\.(md|markdown|mdown|mkd)$/i, "");
  }

  // Files are shown as a FOLDER TREE, not a flat list: a folder holding
  // warhammer-fanfic/drafts/chapters repeated on fourteen rows is unreadable on
  // a phone. Filtering flattens it again — when you are searching you want the
  // matches, not the structure.
  function renderDrawer(rootName, filter) {
    drawer.textContent = "";
    const head = document.createElement("div");
    head.className = "glyph-drawer-head";
    head.textContent = rootName;
    drawer.appendChild(head);

    const search = document.createElement("input");
    search.className = "glyph-drawer-search";
    search.type = "search";
    search.placeholder = "Filter…";
    search.value = filter || "";
    search.addEventListener("input", () => paint(search.value.trim().toLowerCase()));
    drawer.appendChild(search);

    const list = document.createElement("div");
    list.className = "glyph-drawer-list";
    drawer.appendChild(list);

    function makeRow(cls, depth, twisty, label, trailing) {
      const b = document.createElement("button");
      b.className = "glyph-tree-row " + cls;
      b.style.paddingLeft = (8 + depth * 14) + "px";
      const t = document.createElement("span");
      t.className = "tw";
      t.textContent = twisty;
      const n = document.createElement("span");
      n.className = "tn";
      n.textContent = label;
      b.appendChild(t);
      b.appendChild(n);
      if (trailing != null) {
        const c = document.createElement("span");
        c.className = "tc";
        c.textContent = trailing;
        b.appendChild(c);
      }
      return b;
    }

    function makeFileRow(path, base, depth, trailing) {
      const b = makeRow("file", depth, "·", fileLabel(base), trailing);
      const cur = active();
      if (cur && cur.serverPath === path) b.classList.add("current");
      b.addEventListener("click", () => openFromServer(path));
      return b;
    }

    function renderNode(node, depth, prefix, into) {
      const dirs = [...node.dirs.entries()].sort((a, b) => a[0].localeCompare(b[0]));
      for (const entry of dirs) {
        const name = entry[0], child = entry[1];
        const path = prefix ? prefix + "/" + name : name;
        const isOpen = openFolders.has(path);
        const row = makeRow("folder", depth, isOpen ? "▾" : "▸", name, String(child.count));
        const kids = document.createElement("div");
        kids.className = "glyph-tree-kids" + (isOpen ? " open" : "");
        row.addEventListener("click", () => {
          const nowOpen = !kids.classList.contains("open");
          kids.classList.toggle("open", nowOpen);
          row.querySelector(".tw").textContent = nowOpen ? "▾" : "▸";
          if (nowOpen) openFolders.add(path); else openFolders.delete(path);
          rememberFolders();
        });
        into.appendChild(row);
        renderNode(child, depth + 1, path, kids);
        into.appendChild(kids);
      }
      for (const f of node.files) into.appendChild(makeFileRow(f.path, f.base, depth));
    }

    function paint(q) {
      list.textContent = "";
      if (q) {
        const hits = serverFiles.filter((f) => f.path.toLowerCase().indexOf(q) >= 0);
        if (!hits.length) {
          const e = document.createElement("div");
          e.className = "glyph-drawer-empty";
          e.textContent = "No match.";
          list.appendChild(e);
          return;
        }
        for (const f of hits) {
          const folder = f.path.indexOf("/") >= 0 ? f.path.slice(0, f.path.lastIndexOf("/")) : "";
          list.appendChild(makeFileRow(f.path, f.name, 0, folder || null));
        }
        return;
      }
      if (!serverFiles.length) {
        const e = document.createElement("div");
        e.className = "glyph-drawer-empty";
        e.textContent = "No notes in this folder.";
        list.appendChild(e);
        return;
      }
      renderNode(buildTree(serverFiles), 0, "", list);
    }
    paint((filter || "").trim().toLowerCase());
  }

  async function openFromServer(rel) {
    // Already open? Just show it.
    const existing = docs.find((d) => d.serverPath === rel);
    if (existing) { activate(existing.id); closeDrawer(); return; }
    try {
      const res = await glyphApi("/api/file?path=" + encodeURIComponent(rel));
      if (!res.ok) { flash("Could not open that file"); return; }
      const data = await res.json();
      const name = rel.indexOf("/") >= 0 ? rel.slice(rel.lastIndexOf("/") + 1) : rel;
      const d = openDoc(name, data.text, null);   // openDoc sets .plain from the name
      d.serverPath = rel;
      d.mtime = data.mtime;
      d.dirty = false;

      // An edit that never reached the Mac — the phone lost signal, or iOS
      // discarded the tab — is offered back rather than silently replaced by
      // the older copy from disk.
      const stash = readDrafts()[rel];
      if (stash && typeof stash.text === "string" && stash.text !== data.text) {
        d.text = stash.text;
        d.dirty = true;
        d.pendingSave = true;
        if (d.plain) rawArea.value = d.text; else window.renderMarkdown(d.text);
        holdStatus("Restored an edit that never saved — press Save to send it");
      }
      paintTabs();
      closeDrawer();
    } catch (e) {
      flash("Offline — the computer is not reachable");
    }
  }

  // Autosave to the server: one write in flight at a time, coalescing edits that
  // land while a write is running. A 409 means the file changed on the computer
  // since it was opened here; rather than clobber that, it warns and stops until
  // the user reloads or forces a save.
  // The save state is PER DOCUMENT (d.saveTimer / d.saving), not one shared
  // timer: with two notes open, a shared timer let one note's edit cancel the
  // other's pending save and orphan it forever. `force` (an acknowledged
  // overwrite after a conflict) is remembered on the doc so it survives an
  // in-flight save; `immediate` skips the debounce for an explicit Save.
  function scheduleServerSave(d, opts) {
    opts = opts || {};
    if (!d || !d.serverPath) return;
    d.pendingSave = true;
    if (opts.force) d.forceNext = true;
    if (d.saveTimer) clearTimeout(d.saveTimer);
    d.saveTimer = setTimeout(() => { d.saveTimer = null; flushServerSave(d); }, opts.immediate ? 0 : 800);
  }
  function scheduleServerRetry(d) {
    // A failed save (offline) is retried unconditionally — the point is that the
    // text never persisted, so it must resend even if nothing new was typed.
    // Backs off to 30s: on a walk the phone can be out of signal for minutes,
    // and hammering a dead link every 4 seconds only costs battery.
    if (!d || d.retryTimer) return;
    d.retryDelay = Math.min(30000, (d.retryDelay || 2000) * 2);
    d.retryTimer = setTimeout(() => {
      d.retryTimer = null;
      if (d.pendingSave) flushServerSave(d);
    }, d.retryDelay);
  }

  // An unsaved edit kept ONLY in a JavaScript variable is an edit iOS can throw
  // away: a backgrounded tab is discarded without warning and comes back blank,
  // and beforeunload does nothing on a phone. So every pending edit is also
  // written to localStorage, and offered back on the next load. This is the one
  // thing standing between a dead zone and losing what she wrote on a walk.
  const DRAFT_KEY = "glyphDrafts";
  function readDrafts() {
    try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function writeDrafts(all) {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(all)); }
    catch (e) { /* private mode, or quota: the in-memory copy is still live */ }
  }
  function stashDraft(d) {
    if (!d || !d.serverPath) return;
    const all = readDrafts();
    all[d.serverPath] = { text: d.text, mtime: d.mtime || 0, at: Date.now() };
    writeDrafts(all);
  }
  function clearDraft(d) {
    if (!d || !d.serverPath) return;
    const all = readDrafts();
    if (all[d.serverPath]) { delete all[d.serverPath]; writeDrafts(all); }
  }

  async function flushServerSave(d) {
    if (!d || !d.serverPath || !d.pendingSave || d.saving) return;
    d.saving = true;
    const sent = d.text;
    const force = !!d.forceNext;
    stashDraft(d);            // survive a tab discard from here until it lands
    try {
      const body = { path: d.serverPath, text: sent };
      // A normal save (and the FIRST explicit Save) sends baseMtime so the server
      // refuses to clobber a version edited on the computer meanwhile. Only a
      // save the user repeats AFTER seeing the conflict warning forces past it.
      if (!force && typeof d.mtime === "number") body.baseMtime = d.mtime;
      // A stalled cellular link otherwise hangs with no message at all while
      // d.saving blocks every retry. Ten seconds, then treat it as offline.
      const ctl = typeof AbortController === "function" ? new AbortController() : null;
      const bell = ctl ? setTimeout(() => ctl.abort(), 10000) : null;
      let res;
      try {
        res = await glyphApi("/api/file", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          signal: ctl ? ctl.signal : undefined,
        });
      } finally {
        if (bell) clearTimeout(bell);
      }
      if (res.status === 409) {
        d.conflict = true;                 // pendingSave stays set; next Save forces
        holdStatus("Changed on the computer — Save again to overwrite, or reopen to load it");
        return;                            // do NOT auto-retry: it would just 409 forever
      }
      if (res.status === 401) {
        // Retrying cannot help: this phone is no longer paired. Say so instead
        // of promising a retry that will never succeed.
        holdStatus("Not paired any more — open the link from the Mac again");
        return;
      }
      if (!res.ok) { holdStatus("Save failed — will retry"); scheduleServerRetry(d); return; }
      const info = await res.json();
      d.mtime = info.mtime;
      d.conflict = false;
      d.forceNext = false;
      d.retryDelay = 0;
      if (d.text === sent) {
        d.pendingSave = false;
        d.dirty = false;
        clearDraft(d);        // it is on the Mac now; the local copy is redundant
        paintTabs();
      }
      releaseStatus();
      paintStatus("Saved");
    } catch (e) {
      holdStatus("Offline — your edit is kept, and saves when you reconnect");
      scheduleServerRetry(d);
    } finally {
      d.saving = false;
      // Edits that landed mid-save, or a still-pending forced overwrite.
      if (d.pendingSave && (d.text !== sent || d.forceNext)) scheduleServerSave(d, { force: d.forceNext });
    }
  }

  function initServer() {
    // Land on the file list so the phone opens to "what can I read?".
    loadServerList();
    openDrawer();
    // When the wifi comes back, flush every note that still has an edit waiting.
    window.addEventListener("online", () => {
      docs.forEach((d) => { if (d.serverPath && d.pendingSave) scheduleServerSave(d, { immediate: true }); });
    });

    // visibilitychange is the ONLY hook that fires reliably on a phone:
    // beforeunload does nothing on iOS, and a backgrounded tab can be discarded
    // without any further warning. Going away: snapshot every pending edit so a
    // discard cannot lose it. Coming back: try again, because a timer inside a
    // hidden tab is throttled or stopped, so the retry that "should" have run
    // while she walked did not, and navigator.onLine usually never changed
    // either — losing cellular signal does not fire an offline/online event.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        captureActive();
        docs.forEach((d) => { if (d.serverPath && d.pendingSave) stashDraft(d); });
      } else {
        docs.forEach((d) => {
          if (d.serverPath && d.pendingSave) {
            d.retryDelay = 0;                       // she is back; try at once
            scheduleServerSave(d, { immediate: true });
          }
        });
      }
    });
  }

  /* ---------- images ---------- */
  // No shell to copy a picture next to the note, so the image is embedded in the
  // document itself. That keeps the file self-contained and portable.
  function insertImageFile(file) {
    const reader = new FileReader();
    reader.onload = () => window.glyphInsertImage(String(reader.result));
    reader.readAsDataURL(file);
  }

  /* ---------- chrome ---------- */
  const bar = document.createElement("div");
  bar.id = "glyph-bar";
  const tabsEl = document.createElement("div");
  tabsEl.id = "glyph-tabs";
  const toolsEl = document.createElement("div");
  toolsEl.id = "glyph-tools";
  bar.appendChild(tabsEl);
  bar.appendChild(toolsEl);
  document.body.appendChild(bar);
  document.body.classList.add("glyph-chrome");
  if (serverHost()) document.body.classList.add("glyph-server");

  // The bar is fixed at the top, so the page has to be padded by exactly its
  // height. That height differs between desktop and mobile (taller touch rows),
  // and a hardcoded guess hid the first lines of the document under the bar —
  // so it is measured, and re-measured when the window changes.
  function syncBarHeight() {
    const h = Math.round(bar.getBoundingClientRect().height);
    if (h > 0) document.documentElement.style.setProperty("--glyph-bar-h", h + "px");
  }
  window.addEventListener("resize", syncBarHeight);
  window.addEventListener("orientationchange", () => setTimeout(syncBarHeight, 120));
  if (window.ResizeObserver) new ResizeObserver(syncBarHeight).observe(bar);

  const rawArea = document.createElement("textarea");
  rawArea.id = "glyph-raw";
  rawArea.spellcheck = false;
  document.body.appendChild(rawArea);

  // renderMarkdown calls this when a document is too large to render live, so
  // the portable shell shows it raw instead of freezing the window parsing it.
  // The document's text is already in the active tab, so save still works.
  window.__glyphRawFallback = function (text) {
    document.body.classList.add("glyph-raw");
    rawArea.value = text;
    if (typeof paintStatus === "function") paintStatus();
  };

  const status = document.createElement("div");
  status.id = "glyph-status";
  document.body.appendChild(status);

  const drop = document.createElement("div");
  drop.id = "glyph-drop";
  drop.textContent = "Drop markdown files to open";
  document.body.appendChild(drop);

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.multiple = true;
  fileInput.accept = ".md,.markdown,.mdown,.mkd,.txt";
  fileInput.style.display = "none";
  fileInput.addEventListener("change", () => { loadFiles(fileInput.files); fileInput.value = ""; });
  document.body.appendChild(fileInput);

  const imgInput = document.createElement("input");
  imgInput.type = "file";
  imgInput.accept = "image/*";
  imgInput.style.display = "none";
  imgInput.addEventListener("change", () => {
    if (imgInput.files[0]) insertImageFile(imgInput.files[0]);
    imgInput.value = "";
  });
  document.body.appendChild(imgInput);

  function paintTabs() {
    tabsEl.replaceChildren();
    if (serverHost()) {
      // Left of the tabs and outside the horizontal scroll, so the way back to
      // the file list is always in the same place — the toolbar's own Open
      // button scrolls off screen on a phone.
      const menu = document.createElement("button");
      menu.id = "glyph-menu";
      menu.textContent = "☰";
      menu.title = "Files";
      menu.setAttribute("aria-label", "Files");
      menu.addEventListener("click", toggleDrawer);
      tabsEl.appendChild(menu);
    }
    docs.forEach((d) => {
      const t = document.createElement("button");
      t.className = "glyph-tab" + (d.dirty ? " dirty" : "");
      t.setAttribute("aria-selected", d.id === activeId ? "true" : "false");
      t.innerHTML = '<span class="dot"></span><span class="name"></span><span class="x">×</span>';
      t.querySelector(".name").textContent = d.name;
      t.addEventListener("click", (e) => {
        if (e.target.classList.contains("x")) { e.stopPropagation(); closeDoc(d.id); }
        else activate(d.id);
      });
      tabsEl.appendChild(t);
    });
    const plus = document.createElement("button");
    plus.id = "glyph-newtab";
    plus.textContent = "+";
    plus.title = "New note (" + MODNAME + "N)";
    plus.addEventListener("click", () => openDoc("Untitled.md", ""));
    tabsEl.appendChild(plus);
  }

  function btn(icon, title, fn) {
    const b = document.createElement("button");
    b.className = "glyph-btn";
    b.innerHTML = ICON[icon] || "";
    b.title = title;
    b.addEventListener("mousedown", (e) => e.preventDefault());  // keep the selection
    b.addEventListener("click", fn);
    return b;
  }
  function textBtn(label, title, fn) {
    const b = btn(null, title, fn);
    b.textContent = label;
    return b;
  }
  function sep() {
    const s = document.createElement("span");
    s.className = "glyph-sep";
    return s;
  }

  const T = (cmd) => () => window.glyphToolbar(cmd);
  [
    btn("undo", "Undo (" + MODNAME + "Z)", T("undo")),
    btn("redo", "Redo (⇧" + MODNAME + "Z)", T("redo")),
    sep(),
    textBtn("H1", "Heading 1 (" + MODNAME + "1)", T("h1")),
    textBtn("H2", "Heading 2 (" + MODNAME + "2)", T("h2")),
    textBtn("H3", "Heading 3 (" + MODNAME + "3)", T("h3")),
    sep(),
    btn("bold", "Bold (" + MODNAME + "B)", T("bold")),
    btn("italic", "Italic (" + MODNAME + "I)", T("italic")),
    btn("underline", "Underline (" + MODNAME + "U)", T("underline")),
    btn("strike", "Strikethrough", T("strike")),
    btn("highlight", "Highlight", T("highlight")),
    btn("code", "Inline code", T("code")),
    sep(),
    btn("link", "Link (" + MODNAME + "K)", T("link")),
    btn("image", "Insert picture", () => imgInput.click()),
    sep(),
    btn("bullets", "Bullet list", T("bullets")),
    btn("checklist", "Checklist", T("checklist")),
    btn("quote", "Quote", T("quote")),
    btn("callout", "Callout", T("callout")),
    btn("table", "Table", T("table")),
    btn("codeblock", "Code block", T("codeblock")),
    btn("eraser", "Clear formatting", T("eraser")),
    sep(),
    btn("open", "Open (" + MODNAME + "O)", doOpen),
    btn("save", "Save (" + MODNAME + "S)", doSave),
    btn("raw", "Raw markdown (" + MODNAME + "E)", toggleRaw),
    sep(),
    textSizeButton(-1),
    textSizeButton(1),
    btn("theme", "Light / dark / system", cycleTheme),
  ].forEach((el) => toolsEl.appendChild(el));

  applyReaderSize();

  /* ---------- raw view ---------- */
  function toggleRaw() {
    const d0 = active();
    if (d0 && d0.plain) {
      // A plain text file has no formatted view — rendering it as markdown and
      // serializing it back is exactly what would change the file.
      flash("Plain text — rename to .md to format it");
      return;
    }
    const on = document.body.classList.toggle("glyph-raw");
    const d = active();
    if (!d) return;
    if (on) {
      d.text = window.glyphGetText();
      rawArea.value = d.text;
      rawArea.focus();
    } else {
      d.text = rawArea.value;
      d.dirty = true;
      window.renderMarkdown(d.text);
      paintTabs();
    }
    paintStatus();
  }
  rawArea.addEventListener("input", () => {
    const d = active();
    if (!d) return;
    d.text = rawArea.value;
    d.dirty = true;
    paintTabs();
    paintStatus();
    // Edits to a plain text file arrive here rather than through the formatted
    // editor, so this is where its autosave has to be triggered.
    if (serverHost() && d.serverPath) scheduleServerSave(d);
  });

  /* ---------- theme ---------- */
  /* ---------- reader text size ---------- */
  // Reading in bed on a phone is the case this exists for. It scales the
  // DOCUMENT only: the whole page is sized in em from body's font-size, while
  // the chrome is in fixed px, so the toolbar and tabs stay put. Remembered
  // per device, and clamped so the page can never become unusable.
  const SIZE_MIN = 13, SIZE_MAX = 26;
  function defaultReaderSize() {
    return window.matchMedia && window.matchMedia("(max-width: 640px)").matches ? 17 : 15.5;
  }
  function storedReaderSize() {
    const v = parseFloat((() => {
      try { return localStorage.getItem("glyphReaderSize"); } catch (e) { return null; }
    })());
    return isFinite(v) ? Math.min(SIZE_MAX, Math.max(SIZE_MIN, v)) : null;
  }
  function applyReaderSize() {
    const v = storedReaderSize();
    // Unset means "follow the screen" — the mobile stylesheet's own default.
    if (v == null) document.body.style.removeProperty("--reader-size");
    else document.body.style.setProperty("--reader-size", v + "px");
  }
  function nudgeReaderSize(step) {
    const now = storedReaderSize() != null ? storedReaderSize() : defaultReaderSize();
    const next = Math.min(SIZE_MAX, Math.max(SIZE_MIN, Math.round((now + step) * 2) / 2));
    try { localStorage.setItem("glyphReaderSize", String(next)); } catch (e) { /* private mode */ }
    applyReaderSize();
    flash("Text size " + next + "px");
  }
  function textSizeButton(step) {
    const b = document.createElement("button");
    b.className = "glyph-btn";
    b.textContent = step < 0 ? "A−" : "A+";
    b.style.fontSize = step < 0 ? "11px" : "14px";
    b.title = step < 0 ? "Smaller text" : "Larger text";
    b.setAttribute("aria-label", b.title);
    b.addEventListener("click", () => nudgeReaderSize(step * 1));
    return b;
  }

  const THEMES = ["system", "light", "dark"];
  let themeIndex = 0;
  function cycleTheme() {
    themeIndex = (themeIndex + 1) % THEMES.length;
    const mode = THEMES[themeIndex];
    if (mode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    flash("Theme: " + mode);
  }
  window.glyphSetTheme = function (mode) {
    themeIndex = Math.max(0, THEMES.indexOf(mode));
    if (mode === "system" || !mode) document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
  };

  /* ---------- status ---------- */
  let flashTimer = null;
  // A warning about unsaved work STICKS until the work is saved. Without this
  // every keystroke calls paintStatus() with no argument and replaces the
  // warning with the word count — so "Offline" or "Changed on the computer"
  // vanished the moment she carried on typing, which is exactly when she most
  // needed to see it.
  let stickyStatus = null;
  function paintStatus(msg) {
    if (msg) {
      status.textContent = msg;
      return;
    }
    if (stickyStatus) { status.textContent = stickyStatus; return; }
    const d = active();
    const text = d ? d.text : "";
    const words = (text.match(/\S+/g) || []).length;
    status.textContent = words.toLocaleString() + " words";
  }
  function holdStatus(msg) { stickyStatus = msg; status.textContent = msg; }
  function releaseStatus() { stickyStatus = null; paintStatus(); }
  function flash(msg) {
    paintStatus(msg);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => paintStatus(), 1600);
  }

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", (e) => {
    const mod = window.__glyphPlatform === "mac" ? e.metaKey : e.ctrlKey;
    if (!mod) return;
    const k = e.key.toLowerCase();
    const map = {
      b: "bold", i: "italic", u: "underline", k: "link",
      1: "h1", 2: "h2", 3: "h3",
    };
    if (k === "s") { e.preventDefault(); doSave(); return; }
    if (k === "o") { e.preventDefault(); doOpen(); return; }
    if (k === "n") { e.preventDefault(); openDoc("Untitled.md", ""); return; }
    if (k === "e") { e.preventDefault(); toggleRaw(); return; }
    if (k === "w") { e.preventDefault(); if (activeId != null) closeDoc(activeId); return; }
    if (e.shiftKey && k === "x") { e.preventDefault(); window.glyphToolbar("strike"); return; }
    if (e.shiftKey && k === "h") { e.preventDefault(); window.glyphToolbar("highlight"); return; }
    if (e.shiftKey && k === "l") { e.preventDefault(); window.glyphToolbar("checklist"); return; }
    if (e.shiftKey && k === "8") { e.preventDefault(); window.glyphToolbar("bullets"); return; }
    if (!e.shiftKey && map[k]) { e.preventDefault(); window.glyphToolbar(map[k]); }
  });

  /* ---------- drag and drop ---------- */
  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => {
    if (!e.dataTransfer || !e.dataTransfer.types.includes("Files")) return;
    dragDepth++;
    document.body.classList.add("glyph-dropping");
  });
  window.addEventListener("dragleave", () => {
    if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("glyph-dropping"); }
  });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove("glyph-dropping");
    const files = [...(e.dataTransfer.files || [])];
    const img = files.find((f) => /^image\//.test(f.type));
    if (img && !files.some((f) => /\.md$/i.test(f.name))) { insertImageFile(img); return; }
    loadFiles(files);
  });

  window.addEventListener("beforeunload", (e) => {
    captureActive();
    if (docs.some((d) => d.dirty)) { e.preventDefault(); e.returnValue = ""; }
  });

  // The page starts holding whatever document was embedded in it.
  window.__glyphChromeReady = function (name, text, dir) {
    if (serverHost()) {
      // Land on the file list rather than a blank untitled tab; a document
      // opens when one is picked from the drawer.
      initServer();
      paintTabs();
      paintStatus();
      return;
    }
    openDoc(name || "Untitled.md", text || "", null, dir || null);
    paintTabs();
    paintStatus();
  };

  // The portable shell's side of the file dialogs. It opens a document it has
  // already read from disk, and confirms one it has written.
  window.__glyphOpened = function (name, text, dir) {
    // Reuse the tab if this file is already open, rather than stacking copies.
    const existing = docs.find((d) => d.dir === dir && d.name === name);
    let d;
    if (existing) {
      existing.text = text || "";
      existing.dirty = false;
      if (existing.id === activeId) { activeId = null; }
      activate(existing.id);
      d = existing;
    } else {
      d = openDoc(name || "Untitled.md", text || "", null, dir || null);
    }
    paintTabs();
    paintStatus();
    // The tab ids are minted here, and every later message about this document
    // carries this one. The shell parked the path it just read and is waiting
    // to learn which id it belongs to - without this, saving a file that came
    // from the Open dialog would ask where to put it.
    postToApp({ type: "opened", id: d.id, name: d.name });
  };

  window.__glyphSaved = function (id, name, dir) {
    const d = docs.find((x) => x.id === id);
    if (!d) return;
    d.dirty = false;
    if (name) d.name = name;
    if (dir) d.dir = dir;
    // A first save gives the document a folder, so its images can resolve now.
    if (d.id === activeId && nativeHost()) window.__glyphDocDir = d.dir || null;
    paintTabs();
    paintStatus();
    document.title = d.name + " — Glyph";
    flash("Saved");
  };
};

/*__INITIAL__*/
// The chrome flag is set by the block above, so installation happens here rather
// than where the module is defined.
if (window.__glyphChrome) {
  window.__glyphInstallChrome();
  window.__glyphChromeReady(window.__initialName, window.__initial, window.__initialDir);
  // Tell a native host the interface exists. Nothing may be evaluated into this
  // page before this point, so the portable shell waits for it rather than
  // sleeping and hoping.
  postToApp({ type: "ready" });
} else if (typeof window.__initial === "string") {
  window.renderMarkdown(window.__initial);
}
</script>
</body>
</html>
