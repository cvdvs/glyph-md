    table: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/>'),
    codeblock: svg('<path d="M8 3H7a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-1"/>'),
    eraser: svg('<path d="M20 20H7L3 16a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 20"/>'),
    open: svg('<path d="M4 20h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-7L11 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/>'),
    save: svg('<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>'),
    raw: svg('<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>'),
    copy: svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
    theme: svg('<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>'),
  };

  /* ---------- documents ---------- */
  let docs = [];
  let activeId = null;
  let nextId = 1;

  const active = () => docs.find((d) => d.id === activeId) || null;

  // Edits arrive here instead of a native shell.
  window.__glyphLocalSink = function (msg) {
    if (!msg || msg.type !== "source") return;
    const d = active();
    if (!d) return;
    if (d.text !== msg.text) {
      d.text = msg.text;
      d.dirty = true;
      paintTabs();
      // In server mode a changed document autosaves to its file on the server.
      if (serverHost() && d.serverPath) scheduleServerSave(d);
      if (d.isFresh) maybeCommitFresh(d);
    }
    paintStatus();
  };

  function captureActive() {
    const d = active();
    if (!d) return;
    // Nothing to capture, and #md still holds whichever note came before this
    // tab, so reading it here would hand a PDF that note's text.
    if (d.pdf || d.book) { d.scrollY = window.scrollY; return; }
    if (document.body.classList.contains("glyph-raw")) {
      if (rawArea.value !== d.text) { d.text = rawArea.value; d.dirty = true; }
    } else {
      // Flush, not just read: an edit's 600ms timer must not outlive the tab it
      // belongs to. Left running, it fired over whichever tab came next, and only
      // a re-render would have cleared #md, so a .txt or a PDF took the old
      // note's text for its own and a .txt was saved over with it.
      const now = window.glyphFlush();
      if (now !== d.text) { d.text = now; d.dirty = true; }
    }
    d.scrollY = window.scrollY;
    // Switching away from a note flushes its edit now, so nothing is left
    // waiting on a tab that may be evicted before its timer fires.
    if (serverHost() && d.serverPath && d.dirty) scheduleServerSave(d, { immediate: true });
  }

  // A native host is present when the portable shell has bound its one
  // function. Then files are opened and saved through real dialogs instead of
  // the browser's, which matters because showOpenFilePicker does not exist in
  // WebKitGTK at all and is unavailable on the file:// page the shell loads.
  const nativeHost = () => typeof window.__glyphNative === "function";

  // The Glyph server (server/glyph-server.mjs) serves this page and a folder of
  // .md files. In that mode, open reads a file over its API, and every edit
  // autosaves back to it — there is one copy of the file, on the server, so the
  // phone is a live window into it rather than a second copy to reconcile.
  const serverHost = () => !!window.__glyphServer;
  if (serverHost()) {
    // The token arrives once in the URL fragment (never sent to the server), is
    // stored, and is stripped from the address bar. After that the phone is
    // paired until localStorage is cleared.
    const m = (location.hash || "").match(/token=([a-f0-9]+)/);
    if (m) {
      try { localStorage.setItem("glyphToken", m[1]); } catch (e) { /* private mode */ }
      // The token is deliberately LEFT in the address. It used to be stripped
      // for tidiness, and that quietly broke "Add to Home Screen": iOS gives a
      // home-screen web app its own storage, separate from Safari, so the
      // pairing done in Safari does not carry over — and the bookmark it saved
      // no longer carried the token to pair with, so the app opened straight
      // onto "Not paired". Keeping it means the shortcut re-pairs on every
      // launch, which also self-heals when iOS clears storage for a site that
      // has not been opened in a week. A home-screen app shows no address bar,
      // so the token is not on display there.
    }
  }
  function glyphToken() {
    try { return localStorage.getItem("glyphToken") || ""; } catch (e) { return ""; }
  }
  function glyphApi(path, opts) {
    opts = opts || {};
    return fetch(path, Object.assign({}, opts, {
      headers: Object.assign({ Authorization: "Bearer " + glyphToken() }, opts.headers || {}),
    }));
  }

  // A phone has no console, so what goes wrong on one reaches the Mac's log or is
  // never seen at all. Never awaited: a failed report must not be a second problem.
  function reportToMac(what, e) {
    glyphApi("/api/log", {
      method: "POST",
      body: JSON.stringify({ what, error: e && e.stack ? e + "\n" + e.stack : String(e || ""),
                             device: navigator.userAgent }).slice(0, 7000),
    }).catch(() => {});
  }
  if (serverHost()) {
    window.addEventListener("error", (e) => reportToMac("page error", e.error || e.message));
    window.addEventListener("unhandledrejection", (e) => reportToMac("unhandled", e.reason));
  }

  // A .txt is PLAIN TEXT, not markdown: it opens in the literal view and stays
  // there, so the renderer and serializer never touch it and it is saved exactly
  // as typed. The formatted view normalizes what it edits (bullet markers,
  // spacing) — right for a .md, wrong for a file that must come back byte for
  // byte. Mirrors -isPlainText in the macOS app.
  const PLAIN_EXT = /\.(txt|text|log)$/i;
  const isPlainName = (name) => PLAIN_EXT.test(name || "");
  const isPdfName = (name) => /\.pdf$/i.test(name || "");
  const isBookName = (name) => /\.epub$/i.test(name || "");

  function openDoc(name, text, handle, dir) {
    const d = { id: nextId++, name: name || "Untitled.md", text: text || "",
                dirty: false, handle: handle || null, scrollY: 0,
                dir: dir || null, plain: isPlainName(name) };
    docs.push(d);
    activate(d.id);
    return d;
  }

  function activate(id) {
    if (activeId === id) return;
    if (activeId != null) captureActive();
    activeId = id;
    const d = active();
    if (!d) return;
    d.usedAt = Date.now();
    // Each tab's images resolve against its OWN folder, so this must be set
    // before the render and cleared for a document that has no folder yet.
    if (nativeHost()) {
      window.__glyphDocDir = d.dir || null;
      // Which tab is in front decides which folder the shell resolves a
      // relative link against. Without this it answers for whichever document
      // opened first, and a link in the second note looks beside the first one.
      postToApp({ type: "active", id: d.id });
    }
    document.body.classList.toggle("glyph-pdf", !!d.pdf);
    document.body.classList.toggle("glyph-reading", !!d.book);
    pdfHost.replaceChildren(...(d.pdf ? [d.pdfEl] : []));
    bookHost.replaceChildren(...(d.book ? [d.book.el] : []));
    if (d.pdf || d.book) {
      document.body.classList.remove("glyph-raw");
    } else if (d.plain) {
      // Plain text never reaches the renderer. The literal view IS the editor
      // for it, so the file comes back exactly as it went in.
      document.body.classList.add("glyph-raw");
      rawArea.value = d.text;
    } else {
      document.body.classList.remove("glyph-raw");
      window.renderMarkdown(d.text);
    }
    paintTabs();
    paintStatus();
    document.title = d.name + " — Glyph";
    window.scrollTo(0, d.scrollY || 0);
  }

  function closeDoc(id) {
    const i = docs.findIndex((d) => d.id === id);
    if (i < 0) return;
    const d = docs[i];
    if (d.dirty && !confirm('"' + d.name + '" has unsaved changes. Close it anyway?')) return;
    docs.splice(i, 1);
    if (d.pdf) { d.pdfSeen.disconnect(); d.pdfTask.destroy(); }
    if (d.book) d.book.close();
    if (activeId === id) {
      activeId = null;
      if (docs.length) activate(docs[Math.min(i, docs.length - 1)].id);
      else if (!serverHost()) openDoc("Untitled.md", "");
    }

  }

  /* ---------- files ---------- */
  const canPick = typeof window.showOpenFilePicker === "function";
  const MD_TYPES = [{ description: "Markdown", accept: { "text/markdown": [".md", ".markdown", ".mdown", ".mkd"] } }];

  async function doOpen() {
    if (serverHost()) { openLibrary(); return; }
    if (nativeHost()) { postToApp({ type: "pickOpen" }); return; }
    if (canPick) {
      try {
        const handles = await window.showOpenFilePicker({ multiple: true, types: MD_TYPES });
        for (const h of handles) {
          const f = await h.getFile();
          openDoc(f.name, await f.text(), h);
        }
      } catch (e) { /* user cancelled */ }
      return;
    }
    fileInput.click();
  }

  async function doSave() {
    captureActive();
    const d = active();
    if (!d) return;
    if (serverHost()) {
      // Autosave already keeps the file current; this flushes it now. It forces
      // past the stale-write check ONLY when a conflict is already showing — so
      // a reflexive Save cannot silently overwrite a version edited on the
      // computer, but a deliberate second Save after the warning does.
      if (d.serverPath) scheduleServerSave(d, { immediate: true, force: d.conflict === true });
      return;
    }
    if (nativeHost()) {
      // The shell owns the path. It writes the file, or asks for one if this
      // document has never been saved, and reports back through __glyphSaved.
      postToApp({ type: "save", id: d.id, name: d.name, text: d.text });
      return;
    }
    if (canPick) {
      try {
        let h = d.handle;
        if (!h) {
          h = await window.showSaveFilePicker({ suggestedName: d.name, types: MD_TYPES });
          d.handle = h;
          d.name = h.name || d.name;
        }
        const w = await h.createWritable();
        await w.write(d.text);
        await w.close();
        d.dirty = false;
        paintTabs();
        flash("Saved");
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    // Browsers without the file-system API can still download the file.
    const blob = new Blob([d.text], { type: "text/markdown" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = d.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    d.dirty = false;
    paintTabs();
    flash("Downloaded");
  }

  async function loadFiles(fileList) {
    for (const f of fileList) {
      if (!/\.(md|markdown|mdown|mkd|txt)$/i.test(f.name)) continue;
      openDoc(f.name, await f.text(), null);
    }
  }

  /* ---------- server mode ----------

     in: a folder is a page of its subfolders and its notes, newest first and
     grouped by when they last changed, and a note opens on a page of its own.
     All of this is inert unless serverHost(): the native app and the standalone
     page never build it. */
  const elem = (tag, className, text) => {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text != null) el.textContent = text;
    return el;
  };
  const UI = {
    back: svg('<polyline points="15 5 8 12 15 19"/>'),
    share: svg('<path d="M12 3v12"/><polyline points="8 7 12 3 16 7"/><path d="M7 10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/>'),
    more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>',
    done: svg('<polyline points="5 12.5 10 17.5 19 7"/>'),
    folder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><line x1="3" y1="10.5" x2="21" y2="10.5"/>'),
    chevron: svg('<polyline points="9 6 15 12 9 18"/>'),
    search: svg('<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>'),
    mic: svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><line x1="12" y1="17.5" x2="12" y2="21"/>'),
    compose: svg('<path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12.5 14.5 9 15.5l1-3.5z"/>'),
    close: svg('<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>'),
    newFolder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>'),
    move: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="12.5 11 15.5 14 12.5 17"/><line x1="8" y1="14" x2="15.5" y2="14"/>'),
    rename: svg('<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><line x1="14" y1="6" x2="17" y2="9"/>'),
    pin: svg('<path d="M9 3.5h6l-1 5.5 3.5 3.5v1.5h-11V12.5L10 9z"/><line x1="12" y1="14" x2="12" y2="20.5"/>'),
    trash: svg('<line x1="4" y1="7" x2="20" y2="7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M9.5 7V4h5v3"/>'),
    numbers: svg('<line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 5h1.5v4"/><path d="M3.5 13.5a1.5 1.5 0 0 1 3 .2c0 1-3 2-3 3.3h3"/>'),
  };
  const roundButton = (icon, label, cls) => {
    const b = elem("button", "glyph-round" + (cls ? " " + cls : ""));
    b.innerHTML = icon;
    b.setAttribute("aria-label", label);
    b.title = label;
    // Keeps the caret where it is: a tap on the bar must not take the note's focus.
    b.addEventListener("mousedown", (e) => e.preventDefault());
    return b;
  };

  const nav = elem("nav");
  nav.id = "glyph-nav";
  const backButton = roundButton(UI.back, "Back");
  const navPill = elem("div", "glyph-pill");
  const shareButton = roundButton(UI.share, "Share");
  const moreButton = roundButton(UI.more, "More");
  navPill.append(shareButton, moreButton);
  const doneButton = roundButton(UI.done, "Done", "glyph-done");
  nav.append(backButton, elem("div", "glyph-nav-gap"), navPill, doneButton);

  const library = elem("section");
  library.id = "glyph-library";
  const libraryInner = elem("div", "glyph-lib-inner");
  library.appendChild(libraryInner);

  const dock = elem("div");
  dock.id = "glyph-dock";
  const searchPill = elem("label", "glyph-search glyph-float");
  searchPill.innerHTML = UI.search;
  const searchInput = elem("input");
  searchInput.type = "search";
  searchInput.placeholder = "Search";
  searchInput.setAttribute("aria-label", "Search notes");
  searchPill.appendChild(searchInput);
  const toolsPill = elem("div", "glyph-pill glyph-float glyph-tools");
  const aaButton = roundButton("Aa", "Format", "glyph-aa");
  const checkButton = roundButton(ICON.checklist, "Checklist", "glyph-check");
  const micButton = roundButton(UI.mic, "Dictate", "glyph-mic");
  toolsPill.append(aaButton, checkButton, micButton);
  const voiceNoteButton = roundButton(UI.mic, "New voice note", "glyph-float glyph-new-voice");
  const composeButton = roundButton(UI.compose, "New note", "glyph-float");
  dock.append(searchPill, toolsPill, elem("div", "glyph-dock-gap"), voiceNoteButton, composeButton);

  const scrim = elem("div");
  scrim.id = "glyph-scrim";
  const formatSheet = elem("div", "glyph-sheet glyph-float");
  formatSheet.id = "glyph-format";
  const voiceSheet = elem("div", "glyph-sheet glyph-float");
  voiceSheet.id = "glyph-voice";
  const moreMenu = elem("div", "glyph-float");
  moreMenu.id = "glyph-more";
  // Asks one thing: a name, a folder to move to, or whether to use the Trash.
  const askSheet = elem("div", "glyph-sheet glyph-float");
  askSheet.id = "glyph-ask";
  // "Moved to the Trash", with a way back, for a few seconds.
  const undoBar = elem("div", "glyph-float");
  undoBar.id = "glyph-undo";
  const undoText = elem("span", "glyph-undo-text");
  const undoButton = elem("button", "glyph-undo-button", "Undo");
  undoButton.addEventListener("mousedown", (e) => e.preventDefault());
  undoBar.append(undoText, undoButton);

  const pdfHost = document.createElement("div");
  pdfHost.id = "glyph-pdf";
  const bookHost = document.createElement("div");
  bookHost.id = "glyph-book";
  if (serverHost()) {
    document.body.append(library, pdfHost, bookHost, nav, dock, scrim, formatSheet, voiceSheet, moreMenu, askSheet, undoBar);
  }

  let serverFiles = [];
  let serverFolders = [];   // every folder, empty ones included
  let askResolve = null;    // the open question sheet's answer
  let dragging = null;      // what is being dragged in a wide window
  let openSwipe = null;     // the phone row swiped open, showing its buttons
  let swallowTapUntil = 0;  // a tap that only closed a swiped row opens nothing
  let undoAction = null;
  let undoTimer = null;
  let rootName = "Notes";
  let libraryPath = "";
  let libraryProblem = null;
  const folderOf = (p) => (p.lastIndexOf("/") < 0 ? "" : p.slice(0, p.lastIndexOf("/")));
  const baseName = (p) => p.slice(p.lastIndexOf("/") + 1);
  const inside = (p, folder) => !!folder && (p === folder || p.startsWith(folder + "/"));
  // Folders in tree order: a folder, then what is inside it, then the next.
  function byPath(a, b) {
    const x = a.split("/"), y = b.split("/");
    for (let i = 0; i < Math.min(x.length, y.length); i++) {
      const c = x[i].localeCompare(y[i], undefined, { numeric: true, sensitivity: "base" });
      if (c) return c;
    }
    return x.length - y.length;
  }
  // Every folder: the ones the Mac listed (an empty one has no notes to show
  // it) and every folder a note sits in.
  function knownFolders() {
    const all = new Set(serverFolders);
    serverFiles.forEach((f) => { for (let p = folderOf(f.path); p; p = folderOf(p)) all.add(p); });
    return [...all].sort(byPath);
  }
  // A wide window shows everything at once, as Notes on a Mac does: every folder
  // on the left, the chosen folder's notes beside it, and the note on the right.
  // Below that width it is the phone's one page at a time.
  const wideQuery = window.matchMedia("(min-width: 900px)");
  const wide = () => serverHost() && wideQuery.matches;
  const inLibrary = () => !wide() && document.body.classList.contains("glyph-library");
  // In Glyph's own Mac window the page runs under the title bar, whose top strip
  // is where the window is dragged from and the traffic lights sit.
  if (new URLSearchParams(location.search).get("shell") === "mac") {
    document.documentElement.classList.add("glyph-mac-window");
  }

  function openLibrary(path) {
    if (path != null) libraryPath = path;
    closeOverlay();
    if (!wide()) document.body.classList.add("glyph-library");
    paintChrome();
    renderLibrary();
    loadServerList();
  }
  function closeLibrary() {
    closeOverlay();
    document.body.classList.remove("glyph-library");
    paintChrome();
  }

  async function loadServerList() {
    try {
      const res = await glyphApi("/api/files");
      if (res.status === 401) libraryProblem = "Not paired. Open the link from the computer once more.";
      else if (!res.ok) libraryProblem = "Could not reach the computer.";
      else {
        const data = await res.json();
        serverFiles = data.files || [];
        serverFolders = data.folders || [];
        rootName = data.root || rootName;
        libraryProblem = null;
      }
    } catch (e) {
      libraryProblem = "Offline. The computer is not reachable.";
    }
    renderLibrary();
  }

  // Markdown loses its extension, as it is the norm here, while a .txt, a PDF
  // or a book keeps it, so it is obvious at a glance which files are which.
  function fileLabel(base) {
    return isPlainName(base) || isPdfName(base) || isBookName(base) ? base : base.replace(/\.(md|markdown|mdown|mkd)$/i, "");
  }
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

  // Notes' own grouping: what changed today is not mixed in with last spring.
  function whenGroup(ms) {
    const now = new Date();
    const day = 86400000;
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (ms >= today) return "Today";
    if (ms >= today - day) return "Yesterday";
    if (ms >= today - 6 * day) return "Previous 7 Days";
    if (ms >= today - 29 * day) return "Previous 30 Days";
    const d = new Date(ms);
    return d.getFullYear() === now.getFullYear()
      ? d.toLocaleDateString(undefined, { month: "long" }) : String(d.getFullYear());
  }
  function shortDate(ms) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const d = new Date(ms);
    if (ms >= today) return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    if (ms >= today - 86400000) return "Yesterday";
    if (ms >= today - 6 * 86400000) return d.toLocaleDateString(undefined, { weekday: "long" });
    return d.toLocaleDateString(undefined, { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  function noteRow(f, showFolder) {
    const b = elem("button", "glyph-lib-row glyph-lib-note");
    b.dataset.path = f.path;
    b.appendChild(elem("span", "glyph-lib-title", f.title || fileLabel(f.name)));
    const sub = elem("span", "glyph-lib-sub");
    sub.appendChild(elem("span", "glyph-lib-date", shortDate(f.mtime)));
    const kind = isPdfName(f.name) ? "PDF" : isBookName(f.name) ? "Book" : "";
    const tail = showFolder ? (folderOf(f.path) || rootName) : (kind || f.preview || "");
    if (tail) sub.appendChild(elem("span", "glyph-lib-preview", tail));
    b.appendChild(sub);
    b.addEventListener("click", () => openFromServer(f.path));
    itemControls(b, f.path, false);
    return swipeRow(b, f.path, false);
  }
  function folderRow(path, count) {
    const b = elem("button", "glyph-lib-row glyph-lib-folder");
    b.dataset.folder = path;
    b.innerHTML = UI.folder;
    b.appendChild(elem("span", "glyph-lib-name", path.slice(path.lastIndexOf("/") + 1)));
    b.appendChild(elem("span", "glyph-lib-n", String(count)));
    b.insertAdjacentHTML("beforeend", UI.chevron);
    b.addEventListener("click", () => {
      libraryPath = path;
      searchInput.value = "";
      renderLibrary();
      library.scrollTop = 0;
      paintChrome();
    });
    itemControls(b, path, true);
    return swipeRow(b, path, true);
  }

  // Pinned notes first, as in Notes, and the rest by date. Returns the rest.
  function appendPinned(into, files) {
    const pinned = files.filter((f) => f.pinned).sort((a, b) => b.mtime - a.mtime);
    if (!pinned.length) return files;
    into.appendChild(elem("h2", "glyph-lib-when glyph-lib-pinned", "Pinned"));
    const group = elem("div", "glyph-lib-group");
    pinned.forEach((f) => group.appendChild(noteRow(f, false)));
    into.appendChild(group);
    return files.filter((f) => !f.pinned);
  }

  // Notes newest first, under Today, Yesterday, the last week and month, then
  // months and years.
  function appendGroups(into, files, showFolder) {
    let lastWhen = null;
    let group = null;
    files.sort((a, b) => b.mtime - a.mtime).forEach((f) => {
      const when = whenGroup(f.mtime);
      if (when !== lastWhen) {
        into.appendChild(elem("h2", "glyph-lib-when", when));
        group = elem("div", "glyph-lib-group");
        into.appendChild(group);
        lastWhen = when;
      }
      group.appendChild(noteRow(f, showFolder));
    });
  }
  function searchHits(query) {
    const words = query.split(/\s+/);
    return serverFiles.filter((f) => {
      const hay = [f.title, f.name, f.preview, f.path].join(" ").toLowerCase();
      return words.every((w) => hay.indexOf(w) >= 0);
    }).sort((a, b) => b.mtime - a.mtime);
  }

  const sidePane = elem("div", "glyph-lib-side");
  const listPane = elem("div", "glyph-lib-list");
  const listHead = elem("div", "glyph-lib-listhead");
  const listTitle = elem("h2", "glyph-lib-listtitle");
  const listCount = elem("p", "glyph-lib-count");
  const listRows = elem("div", "glyph-lib-rows");
  listHead.append(listTitle, listCount);
  listPane.append(listHead, listRows);
  const sideList = elem("div", "glyph-side-list");
  const newFolderButton = elem("button", "glyph-side-new");
  newFolderButton.innerHTML = UI.newFolder;
  newFolderButton.appendChild(elem("span", "", "New Folder"));
  newFolderButton.addEventListener("click", () => newFolder(libraryPath));
  const sideFoot = elem("div", "glyph-side-foot");
  sideFoot.appendChild(newFolderButton);
  sidePane.append(sideList, sideFoot);
  function sideRow(path, name, count, depth) {
    const b = elem("button", "glyph-side-row");
    b.dataset.folder = path;
    b.style.setProperty("--depth", String(Math.min(depth, 5)));
    b.innerHTML = UI.folder;
    b.appendChild(elem("span", "glyph-lib-name", name));
    b.appendChild(elem("span", "glyph-lib-n", String(count)));
    if (path === libraryPath && !searchInput.value.trim()) b.setAttribute("aria-current", "true");
    b.addEventListener("click", () => {
      libraryPath = path;
      searchInput.value = "";
      renderLibrary();
      listRows.scrollTop = 0;
      paintChrome();
    });
    itemControls(b, path, true);
    dropTarget(b, path);
    return b;
  }
  function renderWide() {
    // Built once and kept, so the search field keeps its focus while typing.
    if (library.firstChild !== sidePane) library.replaceChildren(sidePane, listPane);
    if (searchPill.parentNode !== listHead) listHead.appendChild(searchPill);
    const counts = new Map();
    serverFiles.forEach((f) => {
      for (let p = folderOf(f.path); ; p = folderOf(p)) {
        counts.set(p, (counts.get(p) || 0) + 1);
        if (!p) break;
      }
    });
    knownFolders().forEach((p) => { if (!counts.has(p)) counts.set(p, 0); });
    sideList.replaceChildren(sideRow("", rootName, counts.get("") || 0, 0));
    [...counts.keys()].filter(Boolean).sort(byPath)
      .forEach((p) => sideList.appendChild(sideRow(p, baseName(p), counts.get(p), p.split("/").length)));
    const query = searchInput.value.trim().toLowerCase();
    listRows.replaceChildren();
    if (libraryProblem && !serverFiles.length) {
      listTitle.textContent = rootName;
      listCount.textContent = libraryProblem;
      return;
    }
    const files = query ? searchHits(query) : serverFiles.filter((f) => folderOf(f.path) === libraryPath);
    listTitle.textContent = query ? "Search" : (libraryPath ? libraryPath.slice(libraryPath.lastIndexOf("/") + 1) : rootName);
    listCount.textContent = query ? (files.length ? plural(files.length, "result", "results") : "No results")
                                  : plural(files.length, "note", "notes");
    if (query) {
      const group = elem("div", "glyph-lib-group");
      files.slice(0, 200).forEach((f) => group.appendChild(noteRow(f, true)));
      listRows.appendChild(group);
    } else {
      appendGroups(listRows, appendPinned(listRows, files), false);
    }
    paintSelection();
  }
  // The note on the right is marked in the list, as in Notes.
  function paintSelection() {
    const d = active();
    listRows.querySelectorAll(".glyph-lib-note").forEach((r) => {
      r.setAttribute("aria-current", String(!!d && r.dataset.path === d.serverPath));
    });
  }
  function useWidth() {
    document.body.classList.toggle("glyph-wide", wide());
    if (wide()) document.body.classList.remove("glyph-library");
    else if (!active()) document.body.classList.add("glyph-library");
    if (!wide() && searchPill.parentNode !== dock) dock.insertBefore(searchPill, dock.firstChild);
    renderLibrary();
    paintChrome();
  }
  if (serverHost()) wideQuery.addEventListener("change", useWidth);

  function renderLibrary() {
    openSwipe = null;
    if (wide()) { renderWide(); return; }
    if (library.firstChild !== libraryInner) library.replaceChildren(libraryInner);
    const into = libraryInner;
    into.replaceChildren();
    const query = searchInput.value.trim().toLowerCase();
    const name = libraryPath ? libraryPath.slice(libraryPath.lastIndexOf("/") + 1) : rootName;
    into.appendChild(elem("h1", "glyph-lib-heading", query ? "Search" : name));
    if (libraryProblem && !serverFiles.length) {
      into.appendChild(elem("p", "glyph-lib-empty", libraryProblem));
      return;
    }
    if (query) {
      const hits = searchHits(query);
      into.appendChild(elem("p", "glyph-lib-count", hits.length ? plural(hits.length, "result", "results") : "No results"));
      if (hits.length) {
        const group = elem("div", "glyph-lib-group");
        hits.slice(0, 200).forEach((f) => group.appendChild(noteRow(f, true)));
        into.appendChild(group);
      }
      return;
    }
    const prefix = libraryPath ? libraryPath + "/" : "";
    const folders = new Map();
    const here = [];
    serverFiles.forEach((f) => {
      if (!f.path.startsWith(prefix)) return;
      const rest = f.path.slice(prefix.length);
      const cut = rest.indexOf("/");
      if (cut < 0) here.push(f);
      else folders.set(prefix + rest.slice(0, cut), (folders.get(prefix + rest.slice(0, cut)) || 0) + 1);
    });
    knownFolders().forEach((p) => { if (folderOf(p) === libraryPath && !folders.has(p)) folders.set(p, 0); });
    const counts = [];
    if (folders.size) counts.push(plural(folders.size, "folder", "folders"));
    if (here.length || !folders.size) counts.push(plural(here.length, "note", "notes"));
    into.appendChild(elem("p", "glyph-lib-count", counts.join(", ")));
    if (folders.size) {
      const group = elem("div", "glyph-lib-group");
      [...folders.entries()]
        .sort((a, b) => byPath(a[0], b[0]))
        .forEach(([path, count]) => group.appendChild(folderRow(path, count)));
      into.appendChild(group);
    }
    appendGroups(into, appendPinned(into, here), false);
    if (!folders.size && !here.length) into.appendChild(elem("p", "glyph-lib-empty", "Nothing here yet."));
  }
  searchInput.addEventListener("input", () => { renderLibrary(); library.scrollTop = 0; });
  searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") searchInput.blur(); });

  // Answers whether the note opened, for glyphOpenNote below.
  async function openFromServer(rel, quiet) {
    // Already open? Just show it.
    const existing = docs.find((d) => d.serverPath === rel);
    if (existing) { activate(existing.id); closeLibrary(); return true; }
    if (isPdfName(rel)) { openPdf(rel); return; }
    if (isBookName(rel)) { openBook(rel); return; }
    try {
      const res = await glyphApi("/api/file?path=" + encodeURIComponent(rel));
      if (!res.ok) { if (!quiet) flash("Could not open that file"); return false; }
      const data = await res.json();
      const name = rel.indexOf("/") >= 0 ? rel.slice(rel.lastIndexOf("/") + 1) : rel;
      const d = openDoc(name, data.text, null);   // openDoc sets .plain from the name
      d.serverPath = rel;
      d.mtime = data.mtime;
      d.dirty = false;

      // An edit that never reached the Mac — the phone lost signal, or iOS
      // discarded the tab — is offered back rather than silently replaced by
      // the older copy from disk.
      const stash = readDrafts()[rel];
      if (stash && typeof stash.text === "string" && stash.text !== data.text) {
        d.text = stash.text;
        d.dirty = true;
        d.pendingSave = true;
        if (d.plain) rawArea.value = d.text; else window.renderMarkdown(d.text);
        holdStatus("Restored an edit that never saved — press Save to send it");
      }
      paintTabs();
      closeLibrary();
      return true;
    } catch (e) {
      if (!quiet) flash("Offline — the computer is not reachable");
      return false;
    }
  }
  // The Mac app opens a note from Finder here when it lives in the served folder
  // (Sources/GlyphLibrary.m), with the list showing its folder, as if it had been
  // clicked. Only a note the list shows: a hidden file or one in a skipped folder
  // stays the Mac's. The answer matters, since on a no the Mac opens the file in
  // a window of its own, so this never puts up an error of its own.
  window.glyphOpenNote = async (rel) => {
    if (!serverHost() || typeof rel !== "string" || !rel || isPdfName(rel) || isBookName(rel)) return false;
    const listed = () => serverFiles.find((f) => f.path === rel) ||
      serverFiles.find((f) => f.path.toLowerCase() === rel.toLowerCase());   // the Mac's disk ignores case
    if (!listed()) await loadServerList();
    const f = listed();
    if (!f) return false;
    const opened = await openFromServer(f.path, true);
    if (opened && wide()) { libraryPath = folderOf(f.path); searchInput.value = ""; renderLibrary(); }
    return !!opened;
  };

  // A PDF is read through PDF.js rather than the browser's own viewer, because
  // Safari shows only the first page of a PDF embedded in a page. It is a tab
  // with no text: captureActive, scheduleServerSave and the keyboard all stand
  // aside for d.pdf, and the server refuses to write one in any case.
  const pdfOpening = new Set();
  async function openPdf(rel) {
    if (pdfOpening.has(rel)) return;
    pdfOpening.add(rel);
    paintStatus("Opening PDF…");
    let task = null;
    let d = null;
    try {
      const res = await glyphApi("/api/pdf?path=" + encodeURIComponent(rel));
      if (!res.ok) { flash("Could not open that file"); return; }
      const data = new Uint8Array(await res.arrayBuffer());
      const lib = await import(window.__glyphPdfJs);
      lib.GlobalWorkerOptions.workerSrc = window.__glyphPdfWorker;
      task = lib.getDocument({ data, isEvalSupported: false, verbosity: 0,
                               wasmUrl: window.__glyphPdfWasm });
      const pdf = await task.promise;
      const sizes = await Promise.all(Array.from({ length: pdf.numPages }, async (_, i) => {
        const v = (await pdf.getPage(i + 1)).getViewport({ scale: 1 });
        return v.width + " / " + v.height;
      }));
      d = { id: nextId++, name: rel.slice(rel.lastIndexOf("/") + 1), text: "",
            dirty: false, handle: null, scrollY: 0, dir: null, plain: false,
            serverPath: rel, pdf, pdfTask: task };
      buildPdfView(d, sizes);
    } catch (e) {
      if (task) task.destroy();
      reportToMac("pdf open", e);
      flash(e && e.name === "PasswordException" ? "This PDF needs a password, so it can't be opened here"
                                                : "Could not read that PDF");
      return;
    } finally {
      pdfOpening.delete(rel);
    }
    // Outside the try: from here the document is loaded, and a problem showing
    // it must not be answered by shutting it down underneath its own pages.
    docs.push(d);
    activate(d.id);
    closeLibrary();
    trimDocs();
  }

  // A book is a tab with no text too, so it stands aside everywhere a PDF does.
  async function openBook(rel) {
    if (pdfOpening.has(rel)) return;
    pdfOpening.add(rel);
    paintStatus("Opening book…");
    let d = null;
    try {
      const res = await glyphApi("/api/epub?path=" + encodeURIComponent(rel));
      if (!res.ok) { flash("Could not open that file"); return; }
      const reader = await window.glyphOpenBook(new Uint8Array(await res.arrayBuffer()), rel, {
        onMove: () => paintStatus(),
        onProblem: (e) => reportToMac("book chapter", e),
        openLink: (url) => window.open(url, "_blank", "noopener"),
      });
      d = { id: nextId++, name: reader.title || rel.slice(rel.lastIndexOf("/") + 1), text: "",
            dirty: false, handle: null, scrollY: 0, dir: null, plain: false,
            serverPath: rel, book: reader };
    } catch (e) {
      const known = e instanceof BookError;
      if (!known) reportToMac("book open", e);
      flash(known ? e.message : "Could not read that book");
      return;
    } finally {
      pdfOpening.delete(rel);
    }
    docs.push(d);
    activate(d.id);
    closeLibrary();
    trimDocs();
    await d.book.start();
  }

  // Every page gets a correctly sized empty box straight away, so scrolling and
  // the scroll position are right from the start, but only the pages near the
  // screen hold a picture. A rendered page is a bitmap, and a long document kept
  // whole would run a phone out of memory. A tab in the background is out of the
  // document, so its pages count as off screen and let go of theirs as well.
  // One page or two side by side, remembered on this device. Auto is two when a
  // wide screen is held sideways.
  const pdfSpread = () => {
    try { return localStorage.getItem("glyphPdfSpread") || "auto"; } catch (e) { return "auto"; }
  };
  const pdfTwoUp = () => pdfSpread() === "two" ||
    (pdfSpread() === "auto" && window.innerWidth > window.innerHeight && (pdfHost.clientWidth || window.innerWidth) >= 800);
  function applyPdfSpread(d) {
    if (!d || !d.pdf) return;
    const two = pdfTwoUp();
    if (d.pdfEl.classList.contains("glyph-pdf-two") === two) return;
    // Keeps the page at the top of the screen at the top of the screen.
    const boxes = [...d.pdfEl.children];
    const top = boxes.find((b) => b.getBoundingClientRect().bottom > 80) || boxes[0];
    d.pdfEl.classList.toggle("glyph-pdf-two", two);
    boxes.forEach((box) => {
      if (!box.firstChild) return;
      clearPdfPage(box);
      d.pdfSeen.unobserve(box);
      d.pdfSeen.observe(box);
    });
    if (top && d.pdfEl.isConnected) window.scrollTo(0, top.getBoundingClientRect().top + window.scrollY - 80);
  }
  window.addEventListener("resize", () => {
    const d = active();
    if (d && d.pdf) applyPdfSpread(d);
    if (d && d.book && d.book.relayout) d.book.relayout();
  });

  function buildPdfView(d, sizes) {
    d.pdfEl = document.createElement("div");
    d.pdfEl.className = "glyph-pdf-view" + (pdfTwoUp() ? " glyph-pdf-two" : "");
    d.pdfSeen = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) paintPdfPage(d.pdf, e.target); else clearPdfPage(e.target);
      });
    }, { rootMargin: "100% 0px" });
    sizes.forEach((ratio, i) => {
      const box = document.createElement("div");
      box.className = "glyph-pdf-page";
      box.style.aspectRatio = ratio;
      box.dataset.page = String(i + 1);
      d.pdfEl.appendChild(box);
      d.pdfSeen.observe(box);
    });
  }

  // PDF.js's own limit for phones. Past it iOS can hand back a canvas that takes
  // drawing without error and shows nothing.
  const PDF_MAX_PIXELS = 5242880;
  async function paintPdfPage(pdf, box) {
    if (box.firstChild) return;
    const canvas = document.createElement("canvas");
    box.appendChild(canvas);
    try {
      const page = await pdf.getPage(Number(box.dataset.page));
      if (canvas.parentNode !== box) return;        // scrolled away meanwhile
      const base = page.getViewport({ scale: 1 });
      // Drawn a little past the screen's own sharpness so a pinch zoom holds up.
      const want = box.clientWidth * Math.min(window.devicePixelRatio || 1, 3) * 1.5 / base.width;
      const cap = Math.sqrt(PDF_MAX_PIXELS / (base.width * base.height));
      const viewport = page.getViewport({ scale: Math.min(want, cap) });
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      box.renderTask = page.render({ canvas, viewport });
      await box.renderTask.promise;
    } catch (e) {
      if (e && e.name === "RenderingCancelledException") return;   // scrolled away
      // Said on the page rather than left a blank sheet, which reads as an empty
      // one. Clearing it means scrolling back tries again.
      clearPdfPage(box);
      const note = document.createElement("p");
      note.className = "glyph-pdf-failed";
      note.textContent = "This page could not be drawn";
      box.appendChild(note);
      reportToMac("pdf page " + box.dataset.page, e);
    }
  }
  function clearPdfPage(box) {
    if (box.renderTask) { box.renderTask.cancel(); box.renderTask = null; }
    const canvas = box.firstChild;
    if (!canvas) return;
    canvas.width = canvas.height = 0;               // iOS holds the memory otherwise
    canvas.remove();
  }

  // Autosave to the server: one write in flight at a time, coalescing edits that
  // land while a write is running. A 409 means the file changed on the computer
  // since it was opened here; rather than clobber that, it warns and stops until
  // the user reloads or forces a save.
  // The save state is PER DOCUMENT (d.saveTimer / d.saving), not one shared
  // timer: with two notes open, a shared timer let one note's edit cancel the
  // other's pending save and orphan it forever. `force` (an acknowledged
  // overwrite after a conflict) is remembered on the doc so it survives an
  // in-flight save; `immediate` skips the debounce for an explicit Save.
  function scheduleServerSave(d, opts) {
    opts = opts || {};
    if (!d || !d.serverPath || d.pdf || d.book) return;
    d.pendingSave = true;
    if (opts.force) d.forceNext = true;
    if (d.saveTimer) clearTimeout(d.saveTimer);
    d.saveTimer = setTimeout(() => { d.saveTimer = null; flushServerSave(d); }, opts.immediate ? 0 : 800);
  }
  function scheduleServerRetry(d) {
    // A failed save (offline) is retried unconditionally — the point is that the
    // text never persisted, so it must resend even if nothing new was typed.
    // Backs off to 30s: on a walk the phone can be out of signal for minutes,
    // and hammering a dead link every 4 seconds only costs battery.
    if (!d || d.retryTimer) return;
    d.retryDelay = Math.min(30000, (d.retryDelay || 2000) * 2);
    d.retryTimer = setTimeout(() => {
      d.retryTimer = null;
      if (d.pendingSave) flushServerSave(d);
    }, d.retryDelay);
  }

  // An unsaved edit kept ONLY in a JavaScript variable is an edit iOS can throw
  // away: a backgrounded tab is discarded without warning and comes back blank,
  // and beforeunload does nothing on a phone. So every pending edit is also
  // written to localStorage, and offered back on the next load. This is the one
  // thing standing between a dead zone and losing what she wrote on a walk.
  const DRAFT_KEY = "glyphDrafts";
  function readDrafts() {
    try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function writeDrafts(all) {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(all)); }
    catch (e) { /* private mode, or quota: the in-memory copy is still live */ }
  }
  function stashDraft(d) {
    if (!d || !d.serverPath) return;
    const all = readDrafts();
    all[d.serverPath] = { text: d.text, mtime: d.mtime || 0, at: Date.now() };
    writeDrafts(all);
  }
  function clearDraft(d) {
    if (!d || !d.serverPath) return;
    const all = readDrafts();
    if (all[d.serverPath]) { delete all[d.serverPath]; writeDrafts(all); }
  }

  async function flushServerSave(d) {
    if (!d || !d.serverPath || !d.pendingSave || d.saving) return;
    d.saving = true;
    const sent = d.text;
    const force = !!d.forceNext;
    stashDraft(d);            // survive a tab discard from here until it lands
    try {
      const body = { path: d.serverPath, text: sent };
      // A normal save (and the FIRST explicit Save) sends baseMtime so the server
      // refuses to clobber a version edited on the computer meanwhile. Only a
      // save the user repeats AFTER seeing the conflict warning forces past it.
      if (!force && typeof d.mtime === "number") body.baseMtime = d.mtime;
      // A stalled cellular link otherwise hangs with no message at all while
      // d.saving blocks every retry. Ten seconds, then treat it as offline.
      const ctl = typeof AbortController === "function" ? new AbortController() : null;
      const bell = ctl ? setTimeout(() => ctl.abort(), 10000) : null;
      let res;
      try {
        res = await glyphApi("/api/file", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          signal: ctl ? ctl.signal : undefined,
        });
      } finally {
        if (bell) clearTimeout(bell);
      }
      if (res.status === 409) {
        d.conflict = true;                 // pendingSave stays set; next Save forces
        holdStatus("Changed on the computer — Save again to overwrite, or reopen to load it");
        return;                            // do NOT auto-retry: it would just 409 forever
      }
      if (res.status === 401) {
        // Retrying cannot help: this phone is no longer paired. Say so instead
        // of promising a retry that will never succeed.
        holdStatus("Not paired any more — open the link from the Mac again");
        return;
      }
      if (!res.ok) { holdStatus("Save failed — will retry"); scheduleServerRetry(d); return; }
      const info = await res.json();
      d.mtime = info.mtime;
      d.conflict = false;
      d.forceNext = false;
      d.retryDelay = 0;
      if (d.text === sent) {
        d.pendingSave = false;
        d.dirty = false;
        clearDraft(d);        // it is on the Mac now; the local copy is redundant
        paintTabs();
      }
      releaseStatus();
      paintStatus("Saved");
    } catch (e) {
      holdStatus("Offline — your edit is kept, and saves when you reconnect");
      scheduleServerRetry(d);
    } finally {
      d.saving = false;
      // Edits that landed mid-save, or a still-pending forced overwrite.
      if (d.pendingSave && (d.text !== sent || d.forceNext)) scheduleServerSave(d, { force: d.forceNext });
    }
  }

  // Arriving from the plain address's "Open secure Glyph", or Safari reusing the
  // tab it opened for it last time: open the note or folder named, then keep only
  // the pairing in the address (rule 46), so a Home Screen icon saved from here
  // opens the library rather than that one note.
  function arrive() {
    const ask = new URLSearchParams((location.hash || "").slice(1));
    const note = ask.get("open");
    const folder = ask.get("folder");
    if (note == null && folder == null) return;
    history.replaceState(null, "", location.pathname + location.search +
      "#token=" + encodeURIComponent(ask.get("token") || glyphToken()));
    if (note) {
      libraryPath = folderOf(note);
      renderLibrary();
      openFromServer(note);
    } else {
      openLibrary(folder);
    }
  }

  function initServer() {
    // Land on the file list so the phone opens to "what can I read?".
    document.body.classList.toggle("glyph-wide", wide());
    openLibrary("");
    checkVoice();
    arrive();
    window.addEventListener("hashchange", arrive);
    // When the wifi comes back, flush every note that still has an edit waiting.
    window.addEventListener("online", () => {
      docs.forEach((d) => { if (d.serverPath && d.pendingSave) scheduleServerSave(d, { immediate: true }); });
    });

    // visibilitychange is the ONLY hook that fires reliably on a phone:
    // beforeunload does nothing on iOS, and a backgrounded tab can be discarded
    // without any further warning. Going away: snapshot every pending edit so a
    // discard cannot lose it. Coming back: try again, because a timer inside a
    // hidden tab is throttled or stopped, so the retry that "should" have run
    // while she walked did not, and navigator.onLine usually never changed
    // either — losing cellular signal does not fire an offline/online event.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        captureActive();
        docs.forEach((d) => { if (d.serverPath && d.pendingSave) stashDraft(d); });
        docs.forEach((d) => { if (d.isFresh) commitFresh(d); });
      } else {
        docs.forEach((d) => {
          if (d.serverPath && d.pendingSave) {
            d.retryDelay = 0;                       // she is back; try at once
            scheduleServerSave(d, { immediate: true });
          }
        });
      }
    });
  }

  /* ---------- images ---------- */
  // No shell to copy a picture next to the note, so the image is embedded in the
  // document itself. That keeps the file self-contained and portable.
  function insertImageFile(file) {
    const reader = new FileReader();
    reader.onload = () => window.glyphInsertImage(String(reader.result));
    reader.readAsDataURL(file);
  }

  /* ---------- chrome ---------- */
  const bar = document.createElement("div");
  bar.id = "glyph-bar";
  const tabsEl = document.createElement("div");
  tabsEl.id = "glyph-tabs";
  const toolsEl = document.createElement("div");
  toolsEl.id = "glyph-tools";
  bar.appendChild(tabsEl);
  bar.appendChild(toolsEl);
  document.body.appendChild(bar);
  document.body.classList.add("glyph-chrome");
  if (serverHost()) document.body.classList.add("glyph-server");

  // The bar is fixed at the top, so the page has to be padded by exactly its
  // height. That height differs between desktop and mobile (taller touch rows),
  // and a hardcoded guess hid the first lines of the document under the bar —
  // so it is measured, and re-measured when the window changes.
  function syncBarHeight() {
    const h = Math.round((serverHost() ? nav : bar).getBoundingClientRect().height);
    if (h > 0) document.documentElement.style.setProperty("--glyph-bar-h", h + "px");
  }
  window.addEventListener("resize", syncBarHeight);
  window.addEventListener("orientationchange", () => setTimeout(syncBarHeight, 120));
  if (window.ResizeObserver) new ResizeObserver(syncBarHeight).observe(serverHost() ? nav : bar);

  const rawArea = document.createElement("textarea");
  rawArea.id = "glyph-raw";
  rawArea.spellcheck = false;
  document.body.appendChild(rawArea);

  // renderMarkdown calls this when a document is too large to render live, so
  // the portable shell shows it raw instead of freezing the window parsing it.
  // The document's text is already in the active tab, so save still works.
  window.__glyphRawFallback = function (text) {
    document.body.classList.add("glyph-raw");
    rawArea.value = text;
    if (typeof paintStatus === "function") paintStatus();
  };

  const status = document.createElement("div");
  status.id = "glyph-status";
  document.body.appendChild(status);

  const drop = document.createElement("div");
  drop.id = "glyph-drop";
  drop.textContent = "Drop markdown files to open";
  document.body.appendChild(drop);

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.multiple = true;
  fileInput.accept = ".md,.markdown,.mdown,.mkd,.txt";
  fileInput.style.display = "none";
  fileInput.addEventListener("change", () => { loadFiles(fileInput.files); fileInput.value = ""; });
  document.body.appendChild(fileInput);

  const imgInput = document.createElement("input");
  imgInput.type = "file";
  imgInput.accept = "image/*";
  imgInput.style.display = "none";
  imgInput.addEventListener("change", () => {
    if (imgInput.files[0]) insertImageFile(imgInput.files[0]);
    imgInput.value = "";
  });
  document.body.appendChild(imgInput);

  function paintTabs() {
    // The phone has no tabs: one page at a time, with Back.
    if (serverHost()) { paintChrome(); return; }
    tabsEl.replaceChildren();
    docs.forEach((d) => {
      const t = document.createElement("button");
      t.className = "glyph-tab" + (d.dirty ? " dirty" : "");
      t.setAttribute("aria-selected", d.id === activeId ? "true" : "false");
      t.innerHTML = '<span class="dot"></span><span class="name"></span><span class="x">×</span>';
      t.querySelector(".name").textContent = d.name;
      t.addEventListener("click", (e) => {
        if (e.target.classList.contains("x")) { e.stopPropagation(); closeDoc(d.id); }
        else activate(d.id);
      });
      tabsEl.appendChild(t);
    });
    const plus = document.createElement("button");
    plus.id = "glyph-newtab";
    plus.textContent = "+";
    plus.title = "New note (" + MODNAME + "N)";
    plus.addEventListener("click", () => openDoc("Untitled.md", ""));
    tabsEl.appendChild(plus);
  }

  function btn(icon, title, fn) {
    const b = document.createElement("button");
    b.className = "glyph-btn";
    b.innerHTML = ICON[icon] || "";
    b.title = title;
    b.addEventListener("mousedown", (e) => e.preventDefault());  // keep the selection
    b.addEventListener("click", fn);
    return b;
  }
  function textBtn(label, title, fn) {
    const b = btn(null, title, fn);
    b.textContent = label;
    return b;
  }
  function sep() {
    const s = document.createElement("span");
    s.className = "glyph-sep";
    return s;
  }

  const T = (cmd) => () => window.glyphToolbar(cmd);
  [
    btn("undo", "Undo (" + MODNAME + "Z)", T("undo")),
    btn("redo", "Redo (⇧" + MODNAME + "Z)", T("redo")),
    sep(),
    // Third from the left on purpose. The toolbar scrolls sideways on a phone,
    // and the phone is the one surface with no keyboard to press ⇧⌘C with — put
    // this with Open and Save and it sits twenty icons off the edge of the
    // screen, which is the same as not shipping it.
    btn("copy", "Copy the whole note as markdown (⇧" + MODNAME + "C)", () => doCopy("all")),
    sep(),
    textBtn("H1", "Heading 1 (" + MODNAME + "1)", T("h1")),
    textBtn("H2", "Heading 2 (" + MODNAME + "2)", T("h2")),
    textBtn("H3", "Heading 3 (" + MODNAME + "3)", T("h3")),
    sep(),
    btn("bold", "Bold (" + MODNAME + "B)", T("bold")),
    btn("italic", "Italic (" + MODNAME + "I)", T("italic")),
    btn("underline", "Underline (" + MODNAME + "U)", T("underline")),
    btn("strike", "Strikethrough", T("strike")),
    btn("highlight", "Highlight", T("highlight")),
    btn("code", "Inline code", T("code")),
    sep(),
    btn("link", "Link (" + MODNAME + "K)", T("link")),
    btn("image", "Insert picture", () => imgInput.click()),
    sep(),
    btn("bullets", "Bullet list", T("bullets")),
    btn("checklist", "Checklist", T("checklist")),
    btn("quote", "Quote", T("quote")),
    btn("callout", "Callout", T("callout")),
    btn("table", "Table", T("table")),
    btn("codeblock", "Code block", T("codeblock")),
    btn("eraser", "Clear formatting", T("eraser")),
    sep(),
    btn("open", "Open (" + MODNAME + "O)", doOpen),
    btn("save", "Save (" + MODNAME + "S)", doSave),
    btn("raw", "Raw markdown (" + MODNAME + "E)", toggleRaw),
    sep(),
    textSizeButton(-1),
    textSizeButton(1),
    btn("theme", "Light / dark / system", cycleTheme),
  ].forEach((el) => toolsEl.appendChild(el));

  /* ---------- raw view ---------- */
  // The toolbar button always copies the WHOLE note, because that is what a
  // button with no selection behind it should predictably do. ⇧⌘C copies the
  // selection when there is one and the whole note when there is not.
  function doCopy(scope) {
    const sel = window.getSelection();
    const partial = scope === "selection" && sel && !sel.isCollapsed &&
                    !!sel.toString().trim();
    const text = window.glyphCopyText(scope);
    if (!text) { flash("Nothing to copy"); return; }
    Promise.resolve(window.glyphCopyToClipboard(text)).then((ok) => {
      if (!ok) { flash("Could not reach the clipboard — copy it by hand"); return; }
      flash(partial ? "Copied the selection as markdown"
                    : "Copied the whole note as markdown");
    });
  }

  function toggleRaw() {
    const d0 = active();
    if (d0 && d0.plain) {
      // A plain text file has no formatted view — rendering it as markdown and
      // serializing it back is exactly what would change the file.
      flash("Plain text — rename to .md to format it");
      return;
    }
    const on = document.body.classList.toggle("glyph-raw");
    const d = active();
    if (!d) return;
    if (on) {
      d.text = window.glyphFlush();
      rawArea.value = d.text;
      rawArea.focus();
    } else {
      if (rawArea.value !== d.text) { d.text = rawArea.value; d.dirty = true; }
      window.renderMarkdown(d.text);
      paintTabs();
    }
    paintStatus();
  }
  rawArea.addEventListener("input", () => {
    const d = active();
    if (!d) return;
    d.text = rawArea.value;
    d.dirty = true;
    paintTabs();
    paintStatus();
    // Edits to a plain text file arrive here rather than through the formatted
    // editor, so this is where its autosave has to be triggered.
    if (serverHost() && d.serverPath) scheduleServerSave(d);
  });

  /* ---------- theme ---------- */
  /* ---------- reader text size ---------- */
  // Reading in bed on a phone is the case this exists for. It scales the
  // DOCUMENT only: the whole page is sized in em from body's font-size, while
  // the chrome is in fixed px, so the toolbar and tabs stay put. Remembered
  // per device, and clamped so the page can never become unusable.
  const SIZE_MIN = 13, SIZE_MAX = 26;
  function defaultReaderSize() {
    return window.matchMedia && window.matchMedia("(max-width: 640px)").matches ? 17 : 15.5;
  }
  function storedReaderSize() {
    const v = parseFloat((() => {
      try { return localStorage.getItem("glyphReaderSize"); } catch (e) { return null; }
    })());
    return isFinite(v) ? Math.min(SIZE_MAX, Math.max(SIZE_MIN, v)) : null;
  }
  function applyReaderSize() {
    const v = storedReaderSize();
    // Unset means "follow the screen" — the mobile stylesheet's own default.
    if (v == null) document.body.style.removeProperty("--reader-size");
    else document.body.style.setProperty("--reader-size", v + "px");
  }
  // Called here, after the consts it reads. It used to run above them, which only
  // failed on a device with a saved size, and there it stopped the whole chrome
  // from starting: no menu button, and every later status update threw.
  applyReaderSize();
  function nudgeReaderSize(step) {
    const now = storedReaderSize() != null ? storedReaderSize() : defaultReaderSize();
    const next = Math.min(SIZE_MAX, Math.max(SIZE_MIN, Math.round((now + step) * 2) / 2));
    try { localStorage.setItem("glyphReaderSize", String(next)); } catch (e) { /* private mode */ }
    applyReaderSize();
    flash("Text size " + next + "px");
  }
  function textSizeButton(step) {
    const b = document.createElement("button");
    b.className = "glyph-btn";
    b.textContent = step < 0 ? "A−" : "A+";
    b.style.fontSize = step < 0 ? "11px" : "14px";
    b.title = step < 0 ? "Smaller text" : "Larger text";
    b.setAttribute("aria-label", b.title);
    b.addEventListener("click", () => nudgeReaderSize(step * 1));
    return b;
  }

  const THEMES = ["system", "light", "dark"];
  let themeIndex = 0;
  function cycleTheme() {
    themeIndex = (themeIndex + 1) % THEMES.length;
    const mode = THEMES[themeIndex];
    if (mode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    flash("Theme: " + mode);
  }
  window.glyphSetTheme = function (mode) {
    themeIndex = Math.max(0, THEMES.indexOf(mode));
    if (mode === "system" || !mode) document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
  };

  /* ---------- status ---------- */
  let flashTimer = null;
  // A warning about unsaved work STICKS until the work is saved. Without this
  // every keystroke calls paintStatus() with no argument and replaces the
  // warning with the word count — so "Offline" or "Changed on the computer"
  // vanished the moment she carried on typing, which is exactly when she most
  // needed to see it.
  let stickyStatus = null;
  function paintStatus(msg) {
    // Quiet means a count rather than a message, which the phone does not show.
    status.removeAttribute("data-quiet");
    if (msg) {
      status.textContent = msg;
      return;
    }
    if (stickyStatus) { status.textContent = stickyStatus; return; }
    status.dataset.quiet = "";
    const d = active();
    if (d && d.pdf) {
      status.textContent = d.pdf.numPages.toLocaleString() + (d.pdf.numPages === 1 ? " page" : " pages");
      return;
    }
    if (d && d.book) { status.textContent = d.book.progress(); return; }
    const text = d ? d.text : "";
    const words = (text.match(/\S+/g) || []).length;
    status.textContent = words.toLocaleString() + " words";
  }
  function holdStatus(msg) { stickyStatus = msg; status.textContent = msg; }
  function releaseStatus() { stickyStatus = null; paintStatus(); }
  function flash(msg) {
    paintStatus(msg);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => paintStatus(), 1600);
  }

  /* ---------- server mode: moving around, and the bars ---------- */
  // Which page is showing decides which buttons make sense.
  function paintChrome() {
    if (!serverHost()) return;
    const d = active();
    const atLibrary = inLibrary();
    const kind = !d || atLibrary ? "" : d.pdf || d.book ? "file" : d.plain ? "plain" : "note";
    ["note", "plain", "file"].forEach((k) => document.body.classList.toggle("glyph-kind-" + k, kind === k));
    backButton.hidden = wide() || (atLibrary && !libraryPath && !searchInput.value.trim());
    document.body.classList.toggle("glyph-no-doc", !d);
    if (wide()) paintSelection();
    // A book has its own Aa; a PDF has only the menu, for one or two pages.
    // On a folder page "..." holds the folder's own actions.
    navPill.hidden = atLibrary ? !!searchInput.value.trim() : !d || !!d.book;
    shareButton.hidden = atLibrary || kind === "file";
    doneButton.hidden = atLibrary || !document.body.classList.contains("glyph-editing");
    backButton.setAttribute("aria-label", atLibrary ? "Back" : "Back to " + (libraryLabelFor(d) || rootName));
    if (d && !atLibrary) document.title = d.name + " — Glyph";
    else document.title = (libraryPath ? libraryPath.slice(libraryPath.lastIndexOf("/") + 1) : rootName) + " — Glyph";
  }
  function libraryLabelFor(d) {
    const folder = d ? (d.serverPath ? folderOf(d.serverPath) : d.freshFolder || "") : libraryPath;
    return folder ? folder.slice(folder.lastIndexOf("/") + 1) : rootName;
  }

  async function goBack() {
    closeOverlay();
    if (inLibrary()) {
      if (searchInput.value.trim()) { searchInput.value = ""; renderLibrary(); }
      else if (libraryPath) { libraryPath = folderOf(libraryPath); renderLibrary(); library.scrollTop = 0; }
      paintChrome();
      return;
    }
    const d = active();
    leaveEditing();
    const folder = d ? (d.serverPath ? folderOf(d.serverPath) : d.freshFolder || "") : libraryPath;
    if (d && d.isFresh) await commitFresh(d);
    openLibrary(folder);
    // Open documents stay in memory, so going back to one is instant and an edit
    // still on its way to the Mac keeps going. An empty new note was never a file.
    if (d && d.isFresh && !hasWords(d.text)) dropDoc(d);
    trimDocs();
  }
  backButton.addEventListener("click", goBack);

  function dropDoc(d) {
    const i = docs.indexOf(d);
    if (i < 0) return;
    docs.splice(i, 1);
    if (d.pdf) { d.pdfSeen.disconnect(); d.pdfTask.destroy(); }
    if (d.book) d.book.close();
    if (activeId === d.id) {
      activeId = null;
      document.body.classList.remove("glyph-pdf", "glyph-reading");
      pdfHost.replaceChildren();
      bookHost.replaceChildren();
    }
  }
  // A PDF or a book is heavy, so only the last one stays open, which is enough
  // for one to come back where it was left. Eight notes stay; one with an edit
  // still on its way to the Mac is never let go.
  function trimDocs() {
    const cur = active();
    const byUse = docs.filter((d) => d !== cur).sort((a, b) => (a.usedAt || 0) - (b.usedAt || 0));
    const files = byUse.filter((d) => d.pdf || d.book);
    files.slice(0, Math.max(0, files.length - (cur && (cur.pdf || cur.book) ? 0 : 1))).forEach(dropDoc);
    const notes = byUse.filter((d) => !d.pdf && !d.book && !d.dirty && !d.pendingSave && !d.saving && !d.isFresh);
    notes.slice(0, Math.max(0, notes.length - 8)).forEach(dropDoc);
  }

  /* ---------- editing ---------- */
  const isEditor = (el) => !!el && (el === rawArea || (el.closest && !!el.closest("#md")));
  function paintEditing() {
    document.body.classList.toggle("glyph-editing", isEditor(document.activeElement));
    paintChrome();
  }
  document.addEventListener("focusin", paintEditing);
  document.addEventListener("focusout", () => setTimeout(paintEditing, 0));
  function leaveEditing() {
    if (isEditor(document.activeElement)) document.activeElement.blur();
    captureActive();
  }
  doneButton.addEventListener("click", () => {
    leaveEditing();
    const d = active();
    if (d && d.isFresh) commitFresh(d);
  });

  // The keyboard covers the bottom of the screen without moving anything fixed,
  // so the bar is lifted by exactly the part it covers.
  function placeDock() {
    const vv = window.visualViewport;
    const lift = vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
    document.documentElement.style.setProperty("--dock-lift", lift + "px");
    document.body.classList.toggle("glyph-keyboard", lift > 80);
  }
  if (serverHost() && window.visualViewport) {
    window.visualViewport.addEventListener("resize", placeDock);
    window.visualViewport.addEventListener("scroll", placeDock);
  }

  // A tool needs a caret in the note. Tapped while reading, it goes at the end.
  function caretInNote() {
    const md = document.getElementById("md");
    const sel = window.getSelection();
    if (sel.rangeCount && md.contains(sel.getRangeAt(0).startContainer) && document.activeElement === md) return;
    md.focus();
    const r = document.createRange();
    r.selectNodeContents(md.lastElementChild || md);
    r.collapse(false);
    sel.removeAllRanges();
    sel.addRange(r);
  }
  checkButton.addEventListener("click", () => { caretInNote(); window.glyphToolbar("checklist"); });

  /* ---------- new notes ----------
     A new note has no file until it has a first line, and the file is named after
     that line, the way Notes titles a note. Nothing empty is ever left behind. */
  // A new note starts on an empty title line, which is a "#" in the file and no
  // writing at all. Only a letter or a number makes it worth a file.
  const hasWords = (text) => /[\p{L}\p{N}]/u.test(text || "");
  function noteName(text) {
    const line = (text.split("\n").find((l) => l.trim()) || "")
      .replace(/^\s*(#{1,6}\s+|[-*+]\s+(\[[ xX]\]\s+)?|>\s*|\d+[.)]\s+)/, "")
      .replace(/[*_`~=[\]]/g, "")
      .replace(/[\\/:*?"<>|\u0000-\u001f]/g, " ")
      .replace(/\s+/g, " ").trim().replace(/^\.+/, "");
    let name = line.slice(0, 60);
    if (line.length > 60) name = name.replace(/\s+\S*$/, "") || name;
    return name.replace(/[.\s]+$/, "") || "New note";
  }
  function currentFolder() {
    if (inLibrary() || wide()) return libraryPath;
    const d = active();
    return d ? (d.serverPath ? folderOf(d.serverPath) : d.freshFolder || "") : libraryPath;
  }
  function newNote(text) {
    const folder = currentFolder();
    leaveEditing();
    const d = openDoc("New note.md", text || "", null);
    d.isFresh = true;
    d.freshFolder = folder;
    closeLibrary();
    window.scrollTo(0, 0);
    if (text) commitFresh(d);
    else {
      // The first line is the title, as in Notes, and the file is named after it.
      caretInNote();
      document.execCommand("formatBlock", false, "<h1>");
    }
    return d;
  }
  composeButton.addEventListener("click", () => newNote(""));

  async function commitFresh(d) {
    if (!d.isFresh) return;
    if (d.committing) return d.committing;
    const text = d.text || "";
    if (!hasWords(text)) return;
    d.committing = (async () => {
      const base = noteName(text);
      const prefix = d.freshFolder ? d.freshFolder + "/" : "";
      const taken = new Set(serverFiles.map((f) => f.path.toLowerCase()));
      for (let n = 1; n < 100; n++) {
        const name = base + (n > 1 ? " " + n : "") + ".md";
        if (taken.has((prefix + name).toLowerCase())) continue;
        let res;
        try {
          res = await glyphApi("/api/file", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ path: prefix + name, text, create: true }),
          });
        } catch (e) {
          holdStatus("Offline. This note is kept here and saves when you reconnect");
          return;
        }
        if (res.status === 409) continue;
        if (!res.ok) { flash("Could not save this note"); return; }
        const data = await res.json();
        d.isFresh = false;
        d.serverPath = prefix + name;
        d.name = name;
        d.mtime = data.mtime;
        serverFiles.push({ path: d.serverPath, name, size: text.length, mtime: data.mtime,
                           title: noteName(text), preview: "" });
        releaseStatus();
        // Anything typed while the file was being made goes the usual way.
        if (d.text !== text) scheduleServerSave(d);
        else d.dirty = false;
        if (wide()) renderLibrary();
        paintChrome();
        return;
      }
      flash("Could not find a free name for this note");
    })();
    try { await d.committing; } finally { d.committing = null; }
  }
  // The first line is finished once there is a second one.
  function maybeCommitFresh(d) {
    if (d.isFresh && /\S[^\n]*\n\s*\S/.test(d.text)) commitFresh(d);
  }

  /* ---------- sharing and the menu ---------- */
  shareButton.addEventListener("click", async () => {
    const d = active();
    if (!d || d.pdf || d.book) return;
    captureActive();
    const title = d.serverPath ? fileLabel(d.name) : noteName(d.text);
    if (navigator.share) {
      try { await navigator.share({ title, text: d.text }); } catch (e) { /* cancelled */ }
      return;
    }
    doCopy("all");
  });

  function overlay(which) {
    document.body.dataset.overlay = which;
  }
  function closeOverlay() {
    if (document.body.dataset.overlay === "voice") cancelVoice();
    delete document.body.dataset.overlay;
    moreMenu.removeAttribute("style");
    moreMenu.classList.remove("glyph-context");
    if (askResolve) { const r = askResolve; askResolve = null; r(null); }
  }
  scrim.addEventListener("click", closeOverlay);

  function menuItem(label, icon, fn, cls) {
    const b = elem("button", "glyph-menu-item" + (cls ? " " + cls : ""));
    b.innerHTML = icon || "";
    b.appendChild(elem("span", "", label));
    b.addEventListener("mousedown", (e) => e.preventDefault());
    b.addEventListener("click", () => { closeOverlay(); fn(); });
    return b;
  }
  function segmented(options) {
    const seg = elem("div", "glyph-seg");
    options.forEach(([label, title, fn, pressed]) => {
      const b = elem("button", "", label);
      b.title = title;
      b.setAttribute("aria-label", title);
      if (pressed != null) b.setAttribute("aria-pressed", String(!!pressed));
      b.addEventListener("mousedown", (e) => e.preventDefault());
      b.addEventListener("click", fn);
      seg.appendChild(b);
    });
    return seg;
  }
  function paintMore() {
    const d = active();
    moreMenu.replaceChildren();
    if (d && d.pdf) {
      const spread = pdfSpread();
      const set = (v) => () => {
        try { localStorage.setItem("glyphPdfSpread", v); } catch (e) { /* private mode */ }
        applyPdfSpread(d);
        paintMore();
      };
      const pages = elem("div", "glyph-menu-row");
      pages.append(elem("span", "glyph-menu-label", "Pages"),
        segmented([["Auto", "Two when the screen is sideways", set("auto"), spread === "auto"],
                   ["One", "One page", set("one"), spread === "one"],
                   ["Two", "Two pages side by side", set("two"), spread === "two"]]));
      moreMenu.appendChild(pages);
      if (d.serverPath) moreMenu.append(elem("div", "glyph-menu-sep"), ...fileItems(d.serverPath));
      return;
    }
    if (inLibrary()) {
      moreMenu.append(...folderItems(libraryPath));
      return;
    }
    moreMenu.appendChild(menuItem("Copy as Markdown", ICON.copy, () => doCopy("all")));
    if (d && !d.plain) {
      const raw = document.body.classList.contains("glyph-raw");
      moreMenu.appendChild(menuItem(raw ? "Show Formatted" : "Show Markdown", ICON.raw, toggleRaw));
    }
    if (d && d.serverPath) moreMenu.append(elem("div", "glyph-menu-sep"), ...fileItems(d.serverPath));
    const size = elem("div", "glyph-menu-row");
    size.append(elem("span", "glyph-menu-label", "Text size"),
      segmented([["A−", "Smaller text", () => nudgeReaderSize(-1)], ["A+", "Larger text", () => nudgeReaderSize(1)]]));
    moreMenu.appendChild(size);
    const mode = document.documentElement.getAttribute("data-theme") || "system";
    const look = elem("div", "glyph-menu-row");
    const pick = (m) => () => {
      window.glyphSetTheme(m);
      try { localStorage.setItem("glyphTheme", m); } catch (e) { /* private mode */ }
      paintMore();
    };
    look.append(elem("span", "glyph-menu-label", "Look"),
      segmented([["Auto", "Follow the phone", pick("system"), mode === "system"],
                 ["Light", "Light", pick("light"), mode === "light"],
                 ["Dark", "Dark", pick("dark"), mode === "dark"]]));
    moreMenu.appendChild(look);
  }
  moreButton.addEventListener("click", () => {
    if (document.body.dataset.overlay === "more") { closeOverlay(); return; }
    paintMore();
    overlay("more");
  });
  try {
    const savedLook = localStorage.getItem("glyphTheme");
    if (serverHost() && savedLook) window.glyphSetTheme(savedLook);
  } catch (e) { /* private mode */ }

  /* ---------- folders: make, move, rename, and the Trash ----------
     Everything here asks the Mac (/api/folder, /api/move, /api/trash), which
     refuses anything outside the Writing folder. Nothing is ever deleted: the
     Trash is the Mac's own, so whatever goes there can be taken back. */
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));
  const folderLabel = (p) => (p ? baseName(p) : rootName);
  function itemLabel(path, isDir) {
    if (isDir) return folderLabel(path);
    const f = serverFiles.find((x) => x.path === path);
    return f ? f.title || fileLabel(f.name) : fileLabel(baseName(path));
  }

  // One question at a time, answered by a button or by closing the sheet (null).
  function ask(title, build) {
    return new Promise((resolve) => {
      closeOverlay();
      askResolve = resolve;
      const head = elem("div", "glyph-sheet-head");
      const close = roundButton(UI.close, "Cancel");
      close.addEventListener("click", () => answer(null));
      head.append(elem("span", "glyph-sheet-title", title), close);
      askSheet.replaceChildren(head);
      const focus = build(askSheet);
      overlay("ask");
      // Within the tap that asked, or an iPhone will not raise the keyboard.
      if (focus) { focus.focus(); if (focus.select) focus.select(); }
    });
  }
  function answer(value) {
    const r = askResolve;
    askResolve = null;
    if (document.body.dataset.overlay === "ask") delete document.body.dataset.overlay;
    if (document.activeElement && askSheet.contains(document.activeElement)) document.activeElement.blur();
    if (r) r(value);
  }
  askSheet.addEventListener("keydown", (e) => { if (e.key === "Escape") answer(null); });
  function askButtons(cancelLabel, goLabel, goClass, onGo) {
    const row = elem("div", "glyph-ask-actions");
    const cancel = elem("button", "glyph-ask-button", cancelLabel);
    const go = elem("button", "glyph-ask-button " + goClass, goLabel);
    cancel.addEventListener("click", () => answer(null));
    go.addEventListener("click", onGo);
    row.append(cancel, go);
    return row;
  }
  function nameProblem(v) {
    if (!v) return "Type a name.";
    if (/[\/\\:]/.test(v)) return "A name can’t have / \\ or : in it.";
    if (v.startsWith(".")) return "A name can’t start with a dot.";
    if (/[\u0000-\u001f\u007f]/.test(v)) return "That name has a character a file can’t use.";
    if ([...v].length > 120) return "That name is too long.";
    return null;
  }
  function askName(title, value, goLabel, note) {
    return ask(title, (sheet) => {
      const input = elem("input", "glyph-ask-input");
      input.type = "text";
      input.value = value || "";
      input.setAttribute("aria-label", title);
      input.setAttribute("autocomplete", "off");
      input.setAttribute("enterkeyhint", "done");
      input.spellcheck = false;
      const msg = elem("p", "glyph-ask-note", note || "");
      const submit = () => {
        const v = input.value.trim();
        const why = nameProblem(v);
        if (why) { msg.textContent = why; msg.classList.add("glyph-ask-warn"); input.focus(); return; }
        answer(v);
      };
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
      sheet.append(input, msg, askButtons("Cancel", goLabel, "glyph-ask-primary", submit));
      return input;
    });
  }
  function askConfirm(title, message, goLabel) {
    return ask(title, (sheet) => {
      sheet.append(elem("p", "glyph-ask-text", message),
                   askButtons("Cancel", goLabel, "glyph-ask-danger", () => answer(true)));
      return null;
    });
  }
  // Where to? Every folder, with the one it is in now and (for a folder) itself
  // and everything inside it greyed out.
  function pickFolder(path, isDir) {
    return ask("Move “" + itemLabel(path, isDir) + "”", (sheet) => {
      const list = elem("div", "glyph-pick");
      [""].concat(knownFolders()).forEach((p) => {
        const b = elem("button", "glyph-pick-row");
        b.dataset.folder = p;
        b.innerHTML = UI.folder;
        b.appendChild(elem("span", "glyph-lib-name", folderLabel(p)));
        b.style.setProperty("--depth", String(p ? Math.min(p.split("/").length, 6) : 0));
        if (p === folderOf(path) || (isDir && inside(p, path))) b.disabled = true;
        b.addEventListener("click", () => answer(p));
        list.appendChild(b);
      });
      sheet.appendChild(list);
      return null;
    });
  }

  async function folderApi(route, body, name) {
    let res;
    try {
      res = await glyphApi("/api/" + route, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    } catch (e) {
      flash("Offline. The computer is not reachable");
      return null;
    }
    if (res.ok) return res.json().catch(() => ({}));
    if (res.status === 409) flash("There is already something called “" + name + "” there");
    else if (res.status === 401) flash("Not paired any more. Open the link from the Mac again");
    else if (res.status === 404) { flash("That is not there any more"); loadServerList(); }
    else flash("Could not do that. Nothing was changed");
    return null;
  }

  const openUnder = (path, isDir) =>
    docs.filter((d) => d.serverPath && (isDir ? inside(d.serverPath, path) : d.serverPath === path));
  // Before a file moves, every edit to it reaches the Mac first: a save still on
  // its way would otherwise land at the old name and bring the file back there.
