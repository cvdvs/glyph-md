  #md strong { font-weight: 600; }

  #md details.callout > summary.callout-title::after {

    transform: rotate(90deg);

  /* ---------- frontmatter properties ---------- */
  .props {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px 9px;
    margin: 0 0 2.3em;
  }
  .props summary {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    list-style: none;
  }
  .props summary::-webkit-details-marker { display: none; }
  .props summary::marker { content: none; }
  .props summary::after { content: " ›"; opacity: 0.6; }
  .props[open] summary::after { content: ""; }
  .props table { border-collapse: collapse; margin: 9px 0 3px; }
  .props td { padding: 3px 0; vertical-align: top; font-size: 13.5px; border: none; }
  .props td.k {
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, "Cascadia Code", "Cascadia Mono",

    font-size: 12px;
    padding-right: 24px;
    padding-top: 5px;
    white-space: nowrap;
    width: 1%;
  }
  .props .pill {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 1px 9px;
    font-size: 12.5px;
    margin: 1px 5px 1px 0;

  .props pre.fmv {
    margin: 0;
    padding: 0;
    background: none;
    border: none;
    font-family: ui-monospace, "SF Mono", Menlo, "Cascadia Code", "Cascadia Mono",

    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    color: var(--fg);

    position: sticky;
    top: 0;
    z-index: 30;
    margin: 0 0 22px;
    padding: 11px 15px;
    border: 1px solid rgba(var(--co-warning-rgb), 0.45);
    border-radius: 9px;
    background: rgba(var(--co-warning-rgb), 0.1);
    color: var(--fg);
    font-size: 13.5px;
    line-height: 1.5;

  body.glyph-chrome #glyph-protected { top: var(--glyph-bar-h, 86px); }

     Everything below is inert unless window.__glyphChrome is set, which the
     macOS app never does — there the tabs, toolbar and menus are native. */

  body.glyph-chrome #content { padding-top: 20px; }

  /* iOS 27 blurs whatever sits in the top of a home-screen web app, and a page has
     no way to turn that off: it is the system's scroll edge effect, and it reaches
     about 25pt past the status bar (measured from screenshots on an iPhone 14 Pro
     Max, where the inset is 59pt). So the chrome starts below it. Nothing is added
     where the inset is 0, which is every desktop and any browser tab. */
  :root { --glyph-top: calc(env(safe-area-inset-top, 0px) + min(26px, env(safe-area-inset-top, 0px))); }
  #glyph-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    user-select: none;
    -webkit-user-select: none;
    /* Added to the home screen, the page runs UNDER the iOS status bar (the
       status-bar style is black-translucent, and the viewport is
       viewport-fit=cover). Without this the tab strip sits beneath the clock and
       the battery, and the menu button cannot be tapped at all. The inset is 0
       in a normal browser window and on every desktop, so this costs nothing
       there — and syncBarHeight measures the padded height, so the document is
       still offset by exactly the right amount. */
    padding-top: var(--glyph-top);
    /* A notch leaves the corners unusable in landscape. */
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  #glyph-tabs {
    display: flex;
    align-items: stretch;
    gap: 1px;
    height: 38px;
    overflow-x: auto;
    scrollbar-width: none;
    background: rgba(var(--fg-rgb), 0.04);
  }
  #glyph-tabs::-webkit-scrollbar { display: none; }
  .glyph-tab {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 10px 0 14px;
    font-size: 12.5px;
    color: var(--muted);
    background: transparent;
    border: none;
    border-right: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
    max-width: 220px;
  }
  .glyph-tab[aria-selected="true"] { background: var(--bg); color: var(--fg); }
  .glyph-tab .name { overflow: hidden; text-overflow: ellipsis; }
  .glyph-tab .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    flex: none;
    opacity: 0;
  }
  .glyph-tab.dirty .dot { opacity: 1; }
  .glyph-tab .x {
    width: 16px; height: 16px; line-height: 15px;
    border-radius: 4px; text-align: center;
    font-size: 13px; color: var(--faint); flex: none;
  }
  .glyph-tab .x:hover { background: rgba(var(--fg-rgb), 0.12); color: var(--fg); }
  #glyph-newtab {
    border: none; background: transparent; color: var(--faint);
    font-size: 17px; width: 34px; cursor: pointer; flex: none;
  }
  #glyph-newtab:hover { color: var(--fg); }

  #glyph-tools {
    display: flex;
    align-items: center;
    /* NOT a plain "center". A centred flex row that overflows its container
       spills off BOTH edges, and the left spill can never be scrolled back to,
       because scrollLeft has no negative side. Measured on a 390px phone: the
       row was 1357px wide and Undo sat at left -477 with scrollLeft already at
       0 — so the first buttons in the toolbar were permanently unreachable on
       the one device that most needs them.
       "safe center" is the same centring with the overflow case defined to fall
       back to the start edge. The plain flex-start above it is the fallback for
       an engine that does not know the keyword: left-aligned rather than
       centred, but whole. Both Blink and WebKit do know it (checked). */

    justify-content: safe center;
    gap: 3px;
    height: 47px;
    padding: 0 10px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #glyph-tools::-webkit-scrollbar { display: none; }
  .glyph-btn {
    display: inline-flex;

    justify-content: center;
    min-width: 30px; height: 30px;
    padding: 0 7px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: 600 12.5px -apple-system, system-ui, "Segoe UI", sans-serif;
    cursor: pointer;
  }
  .glyph-btn:hover { background: rgba(var(--fg-rgb), 0.1); color: var(--fg); }
  .glyph-btn svg { width: 16px; height: 16px; }
  .glyph-sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; flex: none; }

  #glyph-status {
    position: fixed;
    right: 14px; bottom: 10px;
    z-index: 20;
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    pointer-events: none;
  }

  #glyph-raw {
    display: none;
    position: fixed;
    top: var(--glyph-bar-h, 86px); left: 0; right: 0; bottom: 0;
    z-index: 15;
    width: 100%;
    box-sizing: border-box;
    border: none;
    outline: none;
    resize: none;
    padding: 22px 26px 60px;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, "Cascadia Code", Consolas,
      "DejaVu Sans Mono", monospace;
    font-size: 13px;
    line-height: 1.6;
    tab-size: 4;
  }
  body.glyph-raw #glyph-raw { display: block; }
  body.glyph-raw #content { visibility: hidden; }

  #glyph-drop {
    position: fixed; inset: 0; z-index: 40;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(var(--accent-rgb), 0.12);
    border: 3px dashed rgba(var(--accent-rgb), 0.5);
    color: var(--accent);
    font: 600 15px -apple-system, system-ui, sans-serif;
  }
  body.glyph-dropping #glyph-drop { display: flex; }

  /* ---- server mode: the phone, laid out like Apple Notes ----
     Folders and notes are pages of their own. A note opens full screen, with Back,
     Share and a menu at the top and a short bar of tools floating at the bottom.
     Everything here is scoped to body.glyph-server, so no other build sees it. */
  #glyph-nav, #glyph-dock, #glyph-library, .glyph-sheet, #glyph-more, #glyph-scrim, #glyph-ask { display: none; }
  body.glyph-server {
    --surface: rgba(var(--fg-rgb), 0.06);
    --surface-press: rgba(var(--fg-rgb), 0.12);
    --chrome-font: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  }
  body.glyph-server #glyph-bar { display: none; }
  body.glyph-server button { -webkit-tap-highlight-color: transparent; }
  body.glyph-server #glyph-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    box-sizing: border-box;
    /* One height whatever it holds: at the top folder there is no Back button,
       and a bar that shrank there moved every page under it by 8px. */
    height: calc(max(8px, var(--glyph-top)) + 52px);
    padding: max(8px, var(--glyph-top)) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left));
    background: var(--bg);
    font-family: var(--chrome-font);
    user-select: none;
    -webkit-user-select: none;
  }
  .glyph-nav-gap { flex: 1; }
  .glyph-round, .glyph-pill button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 44px; height: 44px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--surface);
    color: var(--fg);
    font: 600 17px var(--chrome-font);
    cursor: pointer;
  }
  .glyph-round svg, .glyph-pill svg { width: 22px; height: 22px; }
  .glyph-round:active, .glyph-pill button:active { background: var(--surface-press); }
  .glyph-pill { display: inline-flex; flex: none; border-radius: 22px; background: var(--surface); }
  .glyph-pill button { background: none; width: 48px; }
  .glyph-done { background: var(--accent); color: #fff; }
  .glyph-done:active { background: var(--accent); opacity: 0.85; }
  .glyph-done svg { stroke-width: 2.6; }
  body.glyph-server [hidden] { display: none !important; }

  /* The library: one folder at a time, its own scroller, so going back to it
     never moves the note's place underneath. */
  body.glyph-server.glyph-library #glyph-library {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 40;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    box-sizing: border-box;
    padding: var(--glyph-bar-h, 60px) max(16px, env(safe-area-inset-right)) 140px max(16px, env(safe-area-inset-left));
    background: var(--bg);
    color: var(--fg);
    font-family: var(--chrome-font);
  }
  body.glyph-library #content, body.glyph-library #glyph-pdf, body.glyph-library #glyph-book,
  body.glyph-library #glyph-raw { visibility: hidden; }
  .glyph-lib-inner { max-width: 720px; margin: 0 auto; }
  .glyph-lib-heading { margin: 4px 4px 2px; font-size: 34px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .glyph-lib-count { margin: 0 4px 20px; color: var(--muted); font-size: 17px; }
  .glyph-lib-when { margin: 26px 4px 8px; font-size: 20px; font-weight: 600; }
  .glyph-lib-group { overflow: hidden; border-radius: 14px; background: var(--surface); }
  .glyph-lib-group + .glyph-lib-group { margin-top: 22px; }
  .glyph-lib-row {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    box-sizing: border-box;
    width: 100%;
    min-height: 54px;
    padding: 11px 16px;
    border: 0;
    background: none;
    color: var(--fg);
    font: 17px/1.3 var(--chrome-font);
    text-align: left;
    cursor: pointer;
  }
  .glyph-lib-row:active { background: var(--surface-press); }
  .glyph-lib-row, .glyph-side-row { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  /* Swiping a row, as in Notes: left for Move and Delete, right for Pin. The row
     is opaque, in the group's own color, so the buttons only show as it slides. */
  .glyph-swipe { position: relative; overflow: hidden; }
  .glyph-swipe > .glyph-lib-row {
    touch-action: pan-y;
    background-color: var(--bg);
    background-image: linear-gradient(var(--surface), var(--surface));
  }
  .glyph-swipe > .glyph-lib-row:active {
    background-color: var(--bg);
    background-image: linear-gradient(var(--surface-press), var(--surface-press));
  }
  .glyph-swipe-animate > .glyph-lib-row { transition: transform 0.22s ease; }
  .glyph-swipe + .glyph-swipe::before {
    content: "";
    position: absolute;
    top: 0; right: 0; left: 16px;
    z-index: 1;
    border-top: 1px solid var(--border);
  }
  .glyph-swipe-folder + .glyph-swipe-folder::before { left: 56px; }
  .glyph-swipe-acts { position: absolute; top: 0; bottom: 0; display: flex; visibility: hidden; }
  .glyph-swipe-lead { left: 0; }
  .glyph-swipe-trail { right: 0; }
  .glyph-swipe-right .glyph-swipe-lead, .glyph-swipe-left .glyph-swipe-trail { visibility: visible; }
  .glyph-swipe-act {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 74px;
    padding: 0;
    border: 0;
    color: #fff;
    cursor: pointer;
  }
  .glyph-swipe-act svg { width: 24px; height: 24px; }
  .glyph-swipe-lead .glyph-swipe-act:first-child, .glyph-swipe-trail .glyph-swipe-act:last-child { flex: 1 0 74px; }
  .glyph-swipe-pin { background: #f59e0b; }
  .glyph-swipe-move { background: var(--accent); }
  .glyph-swipe-delete { background: #e5484d; }
  /* "Moved to the Trash", with Undo. */
  #glyph-undo { display: none; }
  body.glyph-server #glyph-undo.glyph-shown {
    display: flex;
    align-items: center;
    gap: 6px;
    position: fixed;
    left: 50%;
    bottom: calc(var(--dock-lift, 0px) + max(14px, env(safe-area-inset-bottom)) + 66px);
    z-index: 53;
    max-width: calc(100% - 32px);
    box-sizing: border-box;
    padding: 4px 4px 4px 18px;
    border-radius: 24px;
    transform: translateX(-50%);
    color: var(--fg);
    font: 15px var(--chrome-font);
  }
  .glyph-undo-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glyph-undo-button {
    flex: none;
    height: 38px;
    padding: 0 14px;
    border: 0;
    border-radius: 19px;
    background: none;
    color: var(--accent);
    font: 600 15px var(--chrome-font);
    cursor: pointer;
  }
  .glyph-lib-row + .glyph-lib-row::before {
    content: "";
    position: absolute;
    top: 0; right: 0; left: 16px;
    border-top: 1px solid var(--border);
  }
  .glyph-lib-folder + .glyph-lib-folder::before { left: 56px; }
  .glyph-lib-folder > svg:first-child { width: 26px; height: 26px; flex: none; color: var(--accent); }
  .glyph-lib-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glyph-lib-n { flex: none; color: var(--muted); }
  .glyph-lib-folder > svg:last-child { width: 18px; height: 18px; flex: none; margin-right: -4px; color: var(--faint); }
  .glyph-lib-note { flex-direction: column; align-items: stretch; gap: 3px; padding-top: 12px; padding-bottom: 12px; }
  .glyph-lib-title { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .glyph-lib-sub { overflow: hidden; color: var(--muted); font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
  .glyph-lib-date { margin-right: 8px; color: var(--fg); opacity: 0.6; }
  .glyph-lib-empty { margin: 30px 4px; color: var(--muted); font-size: 17px; }

  /* The bar of tools, floating at the bottom, and lifted above the keyboard. */
  body.glyph-server #glyph-dock {
    display: flex;
    align-items: center;
    gap: 10px;
    position: fixed;
    left: max(16px, env(safe-area-inset-left));
    right: max(16px, env(safe-area-inset-right));
    bottom: calc(var(--dock-lift, 0px) + max(14px, env(safe-area-inset-bottom)));
    z-index: 50;
    pointer-events: none;
    font-family: var(--chrome-font);
  }
  body.glyph-server.glyph-keyboard #glyph-dock { bottom: calc(var(--dock-lift, 0px) + 8px); }
  #glyph-dock > * { pointer-events: auto; }
  .glyph-float {
    background-color: var(--bg);
    background-image: linear-gradient(rgba(var(--fg-rgb), 0.07), rgba(var(--fg-rgb), 0.07));
    border: 1px solid var(--border);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.16);
  }
  #glyph-dock .glyph-round { width: 52px; height: 52px; }
  #glyph-dock .glyph-pill { border-radius: 26px; }
  #glyph-dock .glyph-pill button { height: 52px; width: 54px; }
  .glyph-dock-gap { flex: 1; }
  .glyph-search {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
    height: 52px;
    padding: 0 16px;
    box-sizing: border-box;
    border-radius: 26px;
    color: var(--muted);
  }
  .glyph-search svg { width: 20px; height: 20px; flex: none; }
  .glyph-search input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: none;
    background: none;
    color: var(--fg);
    font: 17px var(--chrome-font);
    -webkit-appearance: none;
  }
  .glyph-search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .glyph-aa { font: 600 19px var(--chrome-font) !important; }
  /* Which parts of the bar belong to which page. */
  body.glyph-server:not(.glyph-library) .glyph-search, body.glyph-server:not(.glyph-library) .glyph-new-voice,
  body.glyph-server.glyph-library .glyph-tools, body.glyph-server.glyph-library .glyph-dock-gap { display: none; }
  body.glyph-server.glyph-kind-file:not(.glyph-library) #glyph-dock { display: none; }
  body.glyph-server.glyph-kind-plain .glyph-aa, body.glyph-server.glyph-kind-plain .glyph-check { display: none; }
  body.glyph-server.glyph-voice-off .glyph-mic, body.glyph-server.glyph-voice-off .glyph-new-voice { display: none; }

  body.glyph-server #content { max-width: 720px; padding-bottom: max(150px, env(safe-area-inset-bottom)); }
  body.glyph-server #glyph-raw { padding-bottom: 150px; }
  body.glyph-server.glyph-pdf #glyph-pdf { padding-bottom: max(40px, env(safe-area-inset-bottom)); }

  /* Messages only: the word count a desktop shows all the time is noise here. */
  body.glyph-server #glyph-status {
    left: 50%; right: auto;
    bottom: calc(var(--dock-lift, 0px) + max(14px, env(safe-area-inset-bottom)) + 64px);
    z-index: 52;
    max-width: calc(100% - 48px);
    padding: 7px 14px;
    transform: translateX(-50%);
    color: var(--fg);
    font: 14px var(--chrome-font);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.2s;
  }
  body.glyph-server #glyph-status[data-quiet] { opacity: 0; }

  /* Sheets: Aa and the recorder rise from the bottom; the menu drops from "...". */
  body.glyph-server[data-overlay] #glyph-scrim { display: block; position: fixed; inset: 0; z-index: 55; }
  body.glyph-server[data-overlay="voice"] #glyph-scrim { background: rgba(0, 0, 0, 0.3); }
  .glyph-sheet {
    position: fixed;
    left: max(8px, env(safe-area-inset-left));
    right: max(8px, env(safe-area-inset-right));
    bottom: calc(var(--dock-lift, 0px) + max(8px, env(safe-area-inset-bottom)));
    z-index: 60;
    box-sizing: border-box;
    max-width: 560px;
    margin: 0 auto;
    padding: 14px 16px 18px;
    border-radius: 24px;
    color: var(--fg);
    font-family: var(--chrome-font);
    user-select: none;
    -webkit-user-select: none;
  }
  body.glyph-server[data-overlay="format"] #glyph-format,
  body.glyph-server[data-overlay="voice"] #glyph-voice,
  body.glyph-server[data-overlay="ask"] #glyph-ask { display: block; }
  body.glyph-server[data-overlay="ask"] #glyph-scrim { background: rgba(0, 0, 0, 0.3); }
  .glyph-sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .glyph-sheet-title { font-size: 19px; font-weight: 600; }
  .glyph-sheet-head .glyph-round { width: 38px; height: 38px; }
  .glyph-sheet-head .glyph-round svg { width: 18px; height: 18px; }
  .glyph-styles { display: flex; gap: 6px; margin-bottom: 12px; }
  .glyph-styles button {
    flex: 1 1 auto;
    min-height: 46px;
    padding: 0 10px;
    border: 0;
    border-radius: 23px;
    background: none;
    color: var(--fg);
    font-family: var(--chrome-font);
    white-space: nowrap;
    cursor: pointer;
  }
  .glyph-styles button:nth-child(1) { font-size: 23px; font-weight: 700; }
  .glyph-styles button:nth-child(2) { font-size: 18px; font-weight: 600; }
  .glyph-styles button:nth-child(3) { font-size: 17px; }
  .glyph-styles button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .glyph-format-row { display: flex; gap: 8px; margin-top: 8px; }
  .glyph-seg { display: flex; flex: 1 1 auto; overflow: hidden; border-radius: 14px; background: var(--surface); }
  .glyph-seg button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-width: 0;
    height: 46px;
    border: 0;
    background: none;
    color: var(--fg);
    cursor: pointer;
  }
  .glyph-seg button + button { border-left: 1px solid var(--border); }
  .glyph-seg button svg { width: 20px; height: 20px; }
  .glyph-seg button[aria-pressed="true"] { background: var(--surface-press); color: var(--accent); }
  .glyph-seg button:active { background: var(--surface-press); }

  body.glyph-server[data-overlay="more"] #glyph-more {
    display: block;
    position: fixed;
    top: calc(var(--glyph-bar-h, 60px) - 2px);
    right: max(14px, env(safe-area-inset-right));
    z-index: 60;
    box-sizing: border-box;
    width: min(300px, calc(100% - 28px));
    padding: 6px 0;
    border-radius: 18px;
    color: var(--fg);
    font-family: var(--chrome-font);
  }
  .glyph-menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 48px;
    padding: 0 18px;
    border: 0;
    background: none;
    color: var(--fg);
    font: 17px var(--chrome-font);
    text-align: left;
    cursor: pointer;
  }
  .glyph-menu-item:active { background: var(--surface-press); }
  .glyph-menu-item svg { width: 21px; height: 21px; flex: none; color: var(--muted); }
  .glyph-menu-row { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px 0 18px; }
  .glyph-menu-row + .glyph-menu-row, .glyph-menu-item + .glyph-menu-row { border-top: 1px solid var(--border); }
  .glyph-menu-label { flex: 1; font-size: 15px; color: var(--muted); }
  .glyph-menu-sep { height: 1px; margin: 5px 0; background: var(--border); }
  .glyph-menu-item.glyph-danger, .glyph-menu-item.glyph-danger svg { color: #e5484d; }

  /* Asking for a name, a folder, or a yes. */
  .glyph-ask-input {
    box-sizing: border-box;
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--bg);
    color: var(--fg);
    font: 17px var(--chrome-font);
    /* Safari will not type into a field whose parent forbids selection. */
    -webkit-user-select: text;
    user-select: text;
  }
  .glyph-ask-input:focus { border-color: var(--accent); }
  .glyph-ask-note { min-height: 18px; margin: 8px 2px 14px; color: var(--muted); font-size: 14px; line-height: 1.35; }
  .glyph-ask-warn { color: #e5484d; }
  .glyph-ask-text { margin: 0 2px 18px; font-size: 16px; line-height: 1.4; }
  .glyph-ask-actions { display: flex; gap: 10px; }
  .glyph-ask-button {
    flex: 1;
    height: 48px;
    border: 0;
    border-radius: 14px;
    background: var(--surface);
    color: var(--fg);
    font: 600 17px var(--chrome-font);
    cursor: pointer;
  }
  .glyph-ask-primary { background: var(--accent); color: #fff; }
  .glyph-ask-danger { background: #e5484d; color: #fff; }
  .glyph-pick { max-height: min(55vh, 440px); margin: 0 -6px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .glyph-pick-row {
    display: flex;
    align-items: center;
    gap: 10px;
    box-sizing: border-box;
    width: 100%;
    min-height: 46px;
    padding: 0 12px 0 calc(12px + var(--depth, 0) * 16px);
    border: 0;
    border-radius: 10px;
    background: none;
    color: var(--fg);
    font: 17px var(--chrome-font);
    text-align: left;
    cursor: pointer;
  }
  .glyph-pick-row svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
  .glyph-pick-row:disabled { opacity: 0.35; cursor: default; }
  .glyph-pick-row:not(:disabled):active { background: var(--surface-press); }
  .glyph-menu-row .glyph-seg { flex: 0 0 auto; }
  .glyph-menu-row .glyph-seg button { height: 38px; padding: 0 12px; font: 600 14px var(--chrome-font); }

  /* The recorder. */
  .glyph-voice-clock { margin: 6px 0 2px; font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; text-align: center; }
  .glyph-voice-note { min-height: 22px; margin: 0 0 12px; color: var(--muted); font-size: 15px; text-align: center; }
  .glyph-voice-level { display: flex; align-items: center; justify-content: center; gap: 3px; height: 44px; margin-bottom: 14px; }
  .glyph-voice-level i {
    display: block;
    width: 4px;
    height: calc(4px + var(--v, 0) * 40px);

    background: var(--accent);
    opacity: calc(0.35 + var(--v, 0));

  .glyph-voice-langs { margin-bottom: 14px; }
  .glyph-voice-langs button { font: 600 15px var(--chrome-font); }
  .glyph-voice-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .glyph-voice-actions .glyph-text-button {
    min-width: 88px;
    height: 44px;
    border: 0;
    background: none;
    color: var(--accent);
    font: 17px var(--chrome-font);
    cursor: pointer;
  }
  .glyph-voice-stop {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 66px; height: 66px;
    border: 3px solid var(--fg);
    border-radius: 50%;
    background: none;
    cursor: pointer;
  }
  .glyph-voice-stop::after { content: ""; width: 24px; height: 24px; border-radius: 5px; background: #e5484d; }
  .glyph-voice-stop:disabled { opacity: 0.35; }
  .glyph-voice-link { color: var(--accent); font-weight: 600; }

  /* ---- a wide window: three panes, as Notes on a Mac ---- */
  :root.glyph-mac-window { --glyph-top: 28px; }
  body.glyph-server.glyph-wide { --side-w: 230px; --list-w: 340px; --panes-w: 570px; padding-left: var(--panes-w); }
  body.glyph-server.glyph-wide #glyph-library {
    display: grid;
    grid-template-columns: var(--side-w) var(--list-w);
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 40;
    width: var(--panes-w);
    background: var(--bg);
    color: var(--fg);
    font-family: var(--chrome-font);
  }
  .glyph-lib-side {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  .glyph-side-list { flex: 1; min-height: 0; overflow-y: auto; padding: max(12px, calc(var(--glyph-top) + 10px)) 10px 12px; }
  .glyph-side-foot { padding: 6px 10px 10px; }
  .glyph-side-new {

function guardInput(src) {
  let fence = null;
  const lines = String(src || "").split("\n");

  // An unclosed "<!--" swallows everything after it, and the sanitizer then
  // removes the swallowed text — the same deletion the tag list above prevents,
  // which comments are not part of because they are not tags. Escape only the
  // opener that never gets closed, and only outside code.
  let open = -1, depth = 0, codeFence = null;
  for (let i = 0; i < lines.length; i++) {
    const f = /^\s{0,3}(```+|~~~+)/.exec(lines[i]);
    if (f) {
      if (codeFence && lines[i].trim().startsWith(codeFence)) codeFence = null;
      else if (!codeFence) codeFence = f[1][0].repeat(3);
      continue;
    }
    if (codeFence || /^(\s{4,}|\t)/.test(lines[i])) continue;
    let col = 0;
    for (;;) {
      const o = lines[i].indexOf("<!--", col);
      const c = lines[i].indexOf("-->", col);
      if (o >= 0 && (c < 0 || o < c)) { if (!depth++) open = i; col = o + 4; }
      else if (c >= 0) { if (depth) depth--; col = c + 3; }
      else break;
    }
  }
  if (depth > 0 && open >= 0) {
    lines[open] = lines[open].replace("<!--", "&lt;!--");
  }

  return lines.map((line) => {
    const f = /^\s{0,3}(```+|~~~+)/.exec(line);
    if (f) {
      if (fence && line.trim().startsWith(fence)) fence = null;
      else if (!fence) fence = f[1][0].repeat(3);
      return line;
    }
    if (fence) return line;
    if (/^(\s{4,}|\t)/.test(line)) return line;

    // Two trailing spaces are a hard line break. Rendered they look the same as
    // a soft newline here, but they do NOT elsewhere — in Obsidian a soft
    // newline joins the lines — so dropping them changes how the document reads
    // in the app she also uses. A word-joiner marks them for the serializer and
    // is invisible in the meantime.
    let out = line.replace(/(\S)[ \t]{2,}$/, "$1\u2060");
    out = out.replace(SWALLOWING_TAGS, (m, slash, tag) => "&lt;" + slash + tag);

    // A table row containing [[target|alias]] loses everything after that pipe,
    // because GFM reads it as a column break. Escaping it for the parser fixes
    // the row; the serializer unescapes on the way out, so the file keeps the
    // author's original syntax byte for byte.
    if (/^\s{0,3}\|/.test(out)) {
      // The table parser consumes a backslash escape when it splits cells, so
      // the author's "\\|" cannot be recovered later — both forms are marked
      // here and restored in the renderer. U+E001 was written by the author,
      // U+E000 by us.
      out = out.replace(/\[\[[^\[\]\n]*\]\]/g, (link) =>
        link.replace(/\\\|/g, "\uE001").replace(/\|/g, "\uE000"));
    }

    let stars = 0, unders = 0;
    for (let i = 0; i < out.length; i++) {
      const c = out.charCodeAt(i);
      if (c === 42) stars++;
      else if (c === 95) unders++;
    }
    if (stars > EMPHASIS_LIMIT || unders > EMPHASIS_LIMIT) {
      out = out.replace(/[*_]/g, (m) => "\\" + m);
    }
    return out;
  }).join("\n");
}

/* ---------- sanitizer ----------
   Markdown allows raw HTML and marked passes it straight through, so a document
   is untrusted input: notes arrive from model output, downloads and cloned
   repos. Without this, <img src=x onerror=...> and <svg onload=...> execute in a
   page that holds a bridge to the app and, on macOS, a file:// base URL.

   Allowlist, not blocklist: anything not named here is dropped. Our own trusted
   markup (callout icons, tag chips, the Properties panel) is added AFTER this
   runs, so it is unaffected. */

const SAFE_TAGS = new Set([
  "p", "br", "hr", "div", "span",
  "h1", "h2", "h3", "h4", "h5", "h6",
  "strong", "b", "em", "i", "u", "s", "del", "ins", "mark", "small", "sub", "sup",
  "code", "pre", "kbd", "samp", "var", "abbr", "cite", "q",
  "blockquote", "ul", "ol", "li", "dl", "dt", "dd",
  "a", "img", "input",
  "table", "thead", "tbody", "tfoot", "tr", "th", "td", "caption", "colgroup", "col",
  "details", "summary", "figure", "figcaption",
]);

// Per-element attribute allowlist. Deliberately excludes id and name (DOM
// clobbering), style (CSS injection and url() exfiltration), and every on* handler.
const SAFE_ATTRS = {
  "*": new Set(["title", "lang", "dir"]),
  a: new Set(["href"]),
  img: new Set(["src", "alt", "width", "height", "data-raw"]),
  input: new Set(["type", "checked", "disabled"]),
  td: new Set(["colspan", "rowspan", "align"]),
  th: new Set(["colspan", "rowspan", "align", "scope"]),
  col: new Set(["span"]),
  colgroup: new Set(["span"]),
  ol: new Set(["start", "reversed", "type"]),
  li: new Set(["value"]),
  details: new Set(["open"]),
  span: new Set(["data-raw"]),
  // Validated in the pre-loop step above; only "language-xxx" ever survives,
  // and the serializer reads it to emit the fence language.
  code: new Set(["class"]),
};

function safeURL(value, forImage) {
  const v = String(value || "").trim();
  // Strip control characters before looking at the scheme: "java\tscript:" and
  // "&#x6a;avascript:" are still parsed as a scheme by browsers.
  const flat = v.replace(/[\u0000-\u0020\u00a0\u2028\u2029]/g, "").toLowerCase();
  const scheme = /^([a-z][a-z0-9+.-]*):/.exec(flat);
  // No scheme at all — a relative path, an anchor, a query — is fine.
  if (!scheme) return v;
  const name = scheme[1];
  if (forImage) {
    // http/https are kept so the URL survives into the file untouched; the
    // caller then holds the image behind a click rather than fetching it.
    if (name === "http" || name === "https" || name === "file") return v;
    return /^data:image\/(png|jpe?g|gif|webp|avif|bmp|svg\+xml)[;,]/.test(flat) ? v : null;
  }
  // Allowlist, not deny-list: an unknown scheme is refused rather than passed
  // through, so tomorrow's scheme cannot become today's hole.
  if (name === "obsidian") return isObsidianOpen(v) ? v : null;
  return (name === "http" || name === "https" || name === "mailto") ? v : null;
}

// A link that opens a note in Obsidian, the way its "Copy Obsidian URL" writes
// it: obsidian://open?vault=…&file=…. Only the open action, and only its own
// parameters. The other actions write notes (new, daily, plugin handlers), and
// x-success would send the note's name and path to any address. The app checks
// the same rule again before handing one to the system (GlyphIsObsidianOpen).
function isObsidianOpen(v) {
  const m = /^obsidian:\/\/open\?([^#]*)$/i.exec(v);
  if (!m) return false;
  const allowed = ["vault", "file", "path", "panetype"];
  return m[1].split("&").every((pair) => {
    let key;
    try { key = decodeURIComponent(pair.split("=")[0]); } catch (_) { return false; }
    return allowed.includes(key.toLowerCase());
  });
}

// data-raw is emitted by the wikilink renderer and written back to the file
// verbatim by the serializer, so a document that supplies its own would choose
// what gets saved — text that reads as one thing and saves as another.
function safeDataRaw(value) {
  return /^!?\[\[[^\[\]\n]{1,300}\]\]$/.test(String(value || "")) ? value : null;
}

// `keep` names extra attributes to let through. Only the book reader passes it, for
// the two it set itself after removing any the book supplied.
function scrubNode(root, keep) {
  const drop = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach((el) => {
    const tag = el.tagName.toLowerCase();
    if (!SAFE_TAGS.has(tag)) { drop.push(el); return; }

    // Handled before the loop: the serializer and the render passes key off
    // class names, so a document could use them to choose which of the user's
    // paragraphs are deleted on save (class="props" makes serializeBlock return
    // null), turn a paragraph into a callout, or forge the remote-image notice.
    // Only the code fence language survives, because the serializer reads it.
    const cls = el.getAttribute("class");
    if (cls !== null) {
      const keep = tag === "code" && /^language-[\w+-]+$/.test(cls.trim());
      if (keep) el.setAttribute("class", cls.trim());
      else el.removeAttribute("class");
    }

    const allowed = SAFE_ATTRS[tag];
    [...el.attributes].forEach((attr) => {
      const name = attr.name.toLowerCase();
      // Every event handler, plus anything the allowlists do not name.
      const ok = (SAFE_ATTRS["*"].has(name) || (allowed && allowed.has(name)) ||
                  (keep && keep.has(name)))
        && !name.startsWith("on");
      if (!ok) { el.removeAttribute(attr.name); return; }
      if (name === "data-raw") {
        if (safeDataRaw(attr.value) === null) el.removeAttribute(attr.name);
        return;
      }
      if (name === "href" || name === "src") {
        const safe = safeURL(attr.value, tag === "img");
        if (safe === null) { el.removeAttribute(attr.name); return; }
        el.setAttribute(attr.name, safe);
        // A remote image loads the moment the note opens, which tells a server
        // you read it — the tracking-pixel trick, and these notes come from
        // elsewhere. Hold it behind one click, the way mail apps do.
        if (name === "src" && /^https?:/i.test(safe)) {
          el.removeAttribute("src");
          el.setAttribute("data-remote-src", safe);
          el.className = ((el.getAttribute("class") || "") + " remote-img").trim();
        } else if (name === "src" && window.__glyphDocDir &&
                   !/^[a-z][a-z0-9+.-]*:/i.test(safe) && !safe.startsWith("//")) {
          // The portable shell loads ONE page and switches documents inside it,
          // so a note's relative image path has nothing to resolve against: the
          // page lives in a temp folder, not next to the note. A single <base>
          // could not follow a tab switch anyway, and the CSP forbids one. So
          // the folder is resolved here, per document, and the original path is
          // kept for the serializer — writing the absolute one back would
          // rewrite the author's file with a path only this machine can follow.
          // macOS sets a real baseURL per document and never sets __glyphDocDir.
          // data-local-src is deliberately NOT in SAFE_ATTRS, so a note cannot
          // forge one and choose what gets written back in its place.
          el.setAttribute("data-local-src", safe);
          el.setAttribute("src", window.__glyphDocDir + safe);
        }
      }
    });

    if (tag === "input" && (el.getAttribute("type") || "").toLowerCase() !== "checkbox") {
      drop.push(el);
    }
  });

  // Unwrap rather than delete, so the words inside a stripped tag survive.
  drop.forEach((el) => {
    if (!el.parentNode) return;
    if (/^(script|style|iframe|object|embed|link|meta|base|template)$/i.test(el.tagName)) {
      el.remove();
      return;
    }
    while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
    el.remove();
  });
  return root;
}

// A <template> parses HTML inertly: scripts do not run and images do not load,
// so nothing fires before the scrub.
function sanitizeHTML(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  scrubNode(tpl.content);
  return tpl.innerHTML;
}
window.glyphSanitize = sanitizeHTML;

/* ---------- frontmatter ---------- */

function splitFrontmatter(src) {
  const m = /^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(src);
  if (!m) return { fm: null, body: src, prefix: "" };
  return { fm: m[1], body: src.slice(m[0].length), prefix: m[0] };
}

function fmValueHtml(val) {
  if (!val) return '<span class="fm-empty">—</span>';
  if (val.includes("\n")) {
    const lines = val.split("\n").map((s) => s.trim()).filter(Boolean);
    if (lines.length && lines.every((l) => l.startsWith("- "))) {
      return lines.map((l) => `<span class="pill">${esc(l.slice(2))}</span>`).join("");
    }
    return `<pre class="fmv">${esc(val)}</pre>`;
  }
  const list = /^\[(.*)\]$/.exec(val);
  if (list) {
    const items = list[1].split(",").map((s) => s.trim()).filter(Boolean);
    if (items.length) {
      return items.map((s) => `<span class="pill">${esc(s.replace(/^["']|["']$/g, ""))}</span>`).join("");
    }
  }
  return esc(val.replace(/^["']|["']$/g, ""));
}

function propsHtml(fm) {
  const lines = fm.split(/\r?\n/);
  const rows = [];
  let i = 0;
  while (i < lines.length) {
    const km = /^([^\s:#][^:]*):\s*(.*)$/.exec(lines[i]);
    if (!km) { i++; continue; }
    const key = km[1].trim();
    let val = km[2].trim();
    const sub = [];
    let j = i + 1;
    while (j < lines.length && /^\s+\S/.test(lines[j])) {
      sub.push(lines[j].replace(/^\s+/, ""));
      j++;
    }
    if (sub.length) {
      val = (val ? val + "\n" : "") + sub.join("\n");
      i = j;
    } else {
      i++;
    }
    rows.push([key, val]);
  }
  if (!rows.length) return "";
  const body = rows
    .map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${fmValueHtml(v)}</td></tr>`)
    .join("");
  return `<details class="props" contenteditable="false" open><summary>Properties</summary><table>${body}</table></details>`;
}
