function calloutIcon(name) {
  const body = CALLOUT_ICONS[name] || CALLOUT_ICONS.pencil;
  return '<svg class="callout-icon" contenteditable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
       + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + body + "</svg>";
}

function transformCallouts(root) {
  root.querySelectorAll("blockquote").forEach((bq) => {
    const p = bq.querySelector(":scope > p:first-child");
    if (!p) return;
    const marker = /^\[!(\w+)\]([+-])?\s?/.exec((p.textContent || "").trimStart());
    if (!marker) return;
    const rawType = marker[1];
    const meta = CALLOUT_META[rawType.toLowerCase()] || CALLOUT_META.note;
    const type = meta.c;
    const icon = calloutIcon(meta.i);

    let html = p.innerHTML.replace(/^\s*\[!\w+\]([+-])?\s*/, "");
    let titleHtml = "";
    let restHtml = "";
    const brAt = html.search(/<br\s*\/?>/i);
    if (brAt >= 0) {
      titleHtml = html.slice(0, brAt).trim();
      restHtml = html.slice(brAt).replace(/^<br\s*\/?>/i, "").trim();
    } else {
      titleHtml = html.trim();
    }
    if (!titleHtml) {
      titleHtml = rawType.charAt(0).toUpperCase() + rawType.slice(1).toLowerCase();
    }

    const fold = marker[2] || "";
    if (restHtml) { p.innerHTML = restHtml; } else { p.remove(); }
    const titleContent = icon + "<span>" + titleHtml + "</span>";

    if (fold) {
      const details = document.createElement("details");
      details.className = "callout";
      details.setAttribute("data-callout", type);
      details.setAttribute("data-raw-type", rawType);
      if (fold === "+") details.open = true;
      const summary = document.createElement("summary");
      summary.className = "callout-title";
      summary.setAttribute("contenteditable", "false");
      summary.innerHTML = titleContent;
      details.appendChild(summary);
      while (bq.firstChild) details.appendChild(bq.firstChild);
      bq.replaceWith(details);
    } else {
      bq.className = "callout";
      bq.setAttribute("data-callout", type);
      bq.setAttribute("data-raw-type", rawType);
      const title = document.createElement("div");
      title.className = "callout-title";
      title.innerHTML = titleContent;
      bq.insertBefore(title, bq.firstChild);
    }
  });
}

function tagTaskItems(root) {
  root.querySelectorAll('li > input[type="checkbox"]').forEach((cb) => {
    cb.parentElement.classList.add("task");
    cb.removeAttribute("disabled");
  });
}

function tagClass(tag) {
  let h = 0;
  for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) >>> 0;
  return "tag-c" + (h % 6);
}

function styleTags(root) {
  const re = /(^|[\s(])#([A-Za-z_][\w/-]*)/g;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || node.nodeValue.indexOf("#") < 0) return NodeFilter.FILTER_SKIP;
      const parent = node.parentElement;
      if (parent && parent.closest("code, pre, a, .wikilink, h1, h2, h3, h4, h5, h6")) {
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((node) => {
    re.lastIndex = 0;
    if (!re.test(node.nodeValue)) return;
    re.lastIndex = 0;
    const span = document.createElement("span");
    span.innerHTML = esc(node.nodeValue).replace(
      re,
      (_, pre, tag) => `${pre}<span class="tag ${tagClass(tag)}">#${tag}</span>`
    );
    node.parentNode.replaceChild(span, node);
  });
}

/* ---------- serializer: formatted DOM -> markdown ---------- */

// The backtick fence for a code span or fenced block, one longer than the
// longest backtick run in the content (CommonMark). A fixed-length fence is a
// silent corruption: a single backtick cannot wrap text that itself contains a
// backtick (`` `a`b` `` reads as code "a" then a stray backtick, not code
// "a`b"), and a three-backtick fence around a body that shows a ``` example
// closes early and splits one block into pieces on the next render.
function backtickFence(content, min) {
  const runs = content.match(/`+/g);
  const n = runs ? Math.max(...runs.map((r) => r.length)) + 1 : min;
  return "`".repeat(Math.max(min, n));
}

// An inline code span whose delimiter adapts to its content, with a space pad
// when the content starts or ends with a backtick so the delimiters stay
// distinct (the reader strips one padding space from each end).
function serializeCodeSpan(text) {
  const fence = backtickFence(text, 1);
  const pad = /^`|`$/.test(text) ||
    (/^ /.test(text) && / $/.test(text) && text.trim() !== "");
  return fence + (pad ? " " + text + " " : text) + fence;
}

// data-remote-src / data-local-src / data-alt / .remote-img are ours, added for
// display only. The file must get back exactly the image the author wrote.
function serializeImg(el) {
  if (el.dataset && el.dataset.raw) return el.dataset.raw;
  const src = el.getAttribute("data-remote-src") ||
    el.getAttribute("data-local-src") || el.getAttribute("src") || "";
  const alt = el.hasAttribute("data-alt")
    ? el.getAttribute("data-alt")
    : (el.getAttribute("alt") || "");
  return `![${alt}](${src})`;
}

// A comment is inert in both engines Glyph runs, and the owner uses them as
// provenance markers, so it is written back as a comment rather than escaped.
function serializeComment(node) {
  const data = node.nodeValue || "";
  if (/--!?>/.test(data)) return "&lt;!--" + data + "--&gt;";
  return "<!--" + data + "-->";
}

function serializeInline(node) {
  let out = "";
  node.childNodes.forEach((ch) => {
    if (ch.nodeType === Node.COMMENT_NODE) { out += serializeComment(ch); return; }
    if (ch.nodeType === Node.TEXT_NODE) {
      out += ch.nodeValue
        .replace(/\u00a0/g, " ")
        .replace(/\u200b/g, "")
        .replace(/\u2060/g, "")
        // marked escapes stray markup into text; writing it back raw would arm
        // it for the next open (and for every other renderer of this file).
        // "a < b" is untouched because only a tag-shaped bracket is escaped.
        .replace(/<(?=\/?[a-zA-Z])/g, "&lt;");
      return;
    }
    if (ch.nodeType !== Node.ELEMENT_NODE) return;
    if (ch.classList && ch.classList.contains("wikilink")) {
      out += ch.dataset.raw || `[[${ch.textContent}]]`;
      return;
    }
    switch (ch.tagName) {
      case "STRONG": case "B": {
        const inner = serializeInline(ch);
        out += inner.trim() ? `**${inner}**` : inner;
        break;
      }
      case "EM": case "I": {
        const inner = serializeInline(ch);
        out += inner.trim() ? `*${inner}*` : inner;
        break;
      }
      case "U": out += `<u>${serializeInline(ch)}</u>`; break;
      case "DEL": case "S": case "STRIKE": out += `~~${serializeInline(ch)}~~`; break;
      case "MARK": out += `==${serializeInline(ch)}==`; break;
      case "CODE": out += serializeCodeSpan(ch.textContent); break;
      case "A": {
        const href = ch.getAttribute("href") || "";
        out += `[${serializeInline(ch)}](${href})`;
        break;
      }
      case "IMG": out += serializeImg(ch); break;
      case "BR": {
        // The marker sits at the end of the text immediately before the break.
        const prev = ch.previousSibling;
        const marked = prev && prev.nodeType === Node.TEXT_NODE &&
                       /\u2060$/.test(prev.nodeValue || "");
        out += marked ? "  \n" : "\n";
        break;
      }
      case "INPUT": case "SVG": case "svg": break;
      case "SPAN": {
        // Chromium/WebView2 sometimes styles a selection with an inline-styled
        // span instead of <b>/<i>. Without this the formatting looks applied on
        // screen and is silently dropped when the file is written.
        const inner = serializeInline(ch);
        const st = ch.style || {};
        const weight = st.fontWeight || "";
        let out2 = inner;
        if (inner.trim()) {
          if (weight === "bold" || weight === "bolder" || parseInt(weight, 10) >= 600) {
            out2 = "**" + out2 + "**";
          }
          if (st.fontStyle === "italic") out2 = "*" + out2 + "*";
          if ((st.textDecorationLine || st.textDecoration || "").indexOf("line-through") >= 0) {
            out2 = "~~" + out2 + "~~";
          }
        }
        out += out2;
        break;
      }
      default: out += serializeInline(ch); break;
    }
  });
  return out;
}

function serializeList(listEl, indent, ordered) {
  const out = [];
  let n = 1;
  listEl.querySelectorAll(":scope > li").forEach((li) => {
    const clone = li.cloneNode(true);
    clone.querySelectorAll(":scope > ul, :scope > ol").forEach((s) => s.remove());
    clone.querySelectorAll('input[type="checkbox"]').forEach((s) => s.remove());
    const text = serializeInline(clone).replace(/\n+/g, " ").trim();
    const checkbox = li.querySelector(':scope > input[type="checkbox"], :scope > p > input[type="checkbox"]');
    let marker = ordered ? `${n}. ` : "- ";
    if (checkbox) marker = `- [${checkbox.checked ? "x" : " "}] `;
    out.push(indent + marker + text);
    li.querySelectorAll(":scope > ul, :scope > ol").forEach((sub) => {
      out.push(serializeList(sub, indent + "    ", sub.tagName === "OL"));
    });
    n++;
  });
  return out.join("\n");
}

function serializeTable(table) {
  const rows = [...table.querySelectorAll("tr")];
  if (!rows.length) return "";
  // Escape pipes that would break the row, but leave the ones inside a wikilink
  // alone — those are the author's syntax and re-escaping them would rewrite the
  // file on every save.
  const escapePipes = (t) => t.split(/(\[\[[^\]]*\]\])/)
    .map((part, i) => (i % 2 ? part : part.replace(/\|/g, "\\|")))
    .join("");
  const cells = (r) => [...r.children].map(
    (c) => escapePipes(serializeInline(c)).replace(/\n/g, " ").trim() || " "
  );
  const header = cells(rows[0]);
  let out = "| " + header.join(" | ") + " |\n";
  out += "|" + header.map(() => " --- ").join("|") + "|";
  for (let i = 1; i < rows.length; i++) {
    out += "\n| " + cells(rows[i]).join(" | ") + " |";
  }
  return out;
}

function serializeCallout(el) {
  const type = el.dataset.rawType || el.dataset.callout || "note";
  const isDetails = el.tagName === "DETAILS";
  const fold = isDetails ? (el.open ? "+" : "-") : "";
  const titleEl = el.querySelector(":scope > .callout-title");
  let title = "";
  if (titleEl) {
    const span = titleEl.querySelector("span");
    title = (span ? span.textContent : titleEl.textContent).replace(/\u00a0/g, " ").replace(/\u200b/g, "").trim();
  }
  const bodyParts = [];
  el.childNodes.forEach((ch) => {
    if (ch === titleEl) return;
    if (ch.nodeType === Node.COMMENT_NODE) { bodyParts.push(serializeComment(ch)); return; }
    if (ch.nodeType === Node.ELEMENT_NODE) {
      const s = serializeBlock(ch);
      if (s !== null && s !== "") bodyParts.push(s);
    } else if (ch.nodeType === Node.TEXT_NODE && ch.nodeValue.trim()) {
      bodyParts.push(ch.nodeValue.trim());
    }
  });
  const head = `[!${type}]${fold}${title ? " " + title : ""}`;
  const body = bodyParts.join("\n\n");
  const lines = [head, ...(body ? body.split("\n") : [])];
  return lines.map((l) => (l ? "> " + l : ">")).join("\n");
}

function serializeBlock(el) {
  if (el.classList && el.classList.contains("props")) return null;
  if (el.classList && el.classList.contains("callout")) return serializeCallout(el);
  switch (el.tagName) {
    case "H1": return "# " + serializeInline(el).trim();
    case "H2": return "## " + serializeInline(el).trim();
    case "H3": return "### " + serializeInline(el).trim();
    case "H4": return "#### " + serializeInline(el).trim();
    case "H5": return "##### " + serializeInline(el).trim();
    case "H6": return "###### " + serializeInline(el).trim();
    case "P": case "DIV": {
      // Editing can leave real blocks nested inside a paragraph wrapper.
      if (el.querySelector(":scope > ul, :scope > ol, :scope > table, :scope > pre, " +
                           ":scope > blockquote, :scope > h1, :scope > h2, :scope > h3, " +
                           ":scope > h4, :scope > h5, :scope > h6")) {
        const parts = [];
        el.childNodes.forEach((ch) => {
          if (ch.nodeType === Node.ELEMENT_NODE) {
            const s = serializeBlock(ch);
            if (s !== null && s !== "") parts.push(s);
          } else if (ch.nodeType === Node.TEXT_NODE && ch.nodeValue.trim()) {
            parts.push(ch.nodeValue.replace(/\u00a0/g, " ").trim());
          }
        });
        return parts.length ? parts.join("\n\n") : null;
      }
      const t = serializeInline(el).replace(/\n+$/, "");
      if (t.trim()) return t;
      // Not empty — an intentional blank answer line. Emitted as the entity so
      // it survives, and so no invisible character enters the file (rule 7).
      return (el.textContent || "").indexOf("\u00a0") >= 0 ? "&nbsp;" : null;
    }
    case "UL": return serializeList(el, "", false);
    case "OL": return serializeList(el, "", true);
    case "BLOCKQUOTE": {
      const parts = [];
      el.childNodes.forEach((ch) => {
        if (ch.nodeType === Node.COMMENT_NODE) { parts.push(serializeComment(ch)); return; }
        if (ch.nodeType === Node.ELEMENT_NODE) {
          const s = serializeBlock(ch);
          if (s !== null && s !== "") parts.push(s);
        } else if (ch.nodeType === Node.TEXT_NODE && ch.nodeValue.trim()) {
          parts.push(ch.nodeValue.trim());
        }
      });
      return parts.join("\n\n").split("\n").map((l) => (l ? "> " + l : ">")).join("\n");
    }
    case "PRE": {
      const code = el.querySelector("code");
      const langMatch = code ? /language-([\w+-]+)/.exec(code.className || "") : null;
      const lang = langMatch ? langMatch[1] : "";
      const body = (code || el).textContent.replace(/\n$/, "");
      const fence = backtickFence(body, 3);
      return fence + lang + "\n" + body + "\n" + fence;
    }
    case "TABLE": return serializeTable(el);
    case "IMG": return serializeImg(el);
    case "HR": return "---";
    default:
      return el.outerHTML;
  }
}

// `root` lets the same block loop run over a detached fragment instead of the
// live document — the copy commands hand it a clone of the user's selection.
// Nothing else passes it, so the document path is byte-for-byte unchanged.
function serializeDoc(root) {
  const md = root || document.getElementById("md");
  if (!md) return lastSerialized;
  const parts = [];
  md.childNodes.forEach((el) => {
    if (el.nodeType === Node.COMMENT_NODE) { parts.push(serializeComment(el)); return; }
    if (el.nodeType === Node.TEXT_NODE) {
      const t = el.nodeValue.trim();
      if (t) parts.push(t);
      return;
    }
    if (el.nodeType !== Node.ELEMENT_NODE) return;
    const s = serializeBlock(el);
    if (s !== null && s !== "") parts.push(s);
  });
  return parts.length ? parts.join("\n\n") + "\n" : "";
}

/* ---------- live editing session ---------- */

let curPrefix = "";
let lastSerialized = "";
let lastSource = "";
let syncTimer = null;

// Which modifier means "command" here. The shell may set __glyphPlatform before
// the page loads; otherwise sniff. On macOS this resolves to "mac" with no shell
// change at all, so the existing app is untouched.
window.__glyphPlatform = window.__glyphPlatform ||
  (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? "mac"
    : /Win/.test(navigator.userAgent) ? "win" : "linux");
const MOD = (e) => (window.__glyphPlatform === "mac" ? e.metaKey : e.ctrlKey);

// One exit point, four hosts. WKWebView (macOS) takes the object directly;
// WebView2 (Windows) only accepts strings and publishes its bridge
// asynchronously during startup — so an early edit must queue rather than vanish.
// Dropping a message here would be invisible: doSync() has already recorded the
// text as synced, so the file would silently stop receiving edits.
//
// __glyphNative is the portable shell (shell/glyph.cc), which binds one function
// through the webview library on all three platforms. It is checked BEFORE
// chrome.webview because on Windows that object belongs to the LIBRARY's own
// bind protocol: our message would be delivered to a handler that cannot read it
// and would be dropped without a word. macOS is unaffected either way — it
// registers the `glyph` handler and never reaches this far down.
const __glyphPending = [];

function __glyphBridgeReady() {
  return !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.glyph) ||
    typeof window.__glyphNative === "function" ||
    !!(window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === "function");
}

function __glyphDeliver(msg) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.glyph) {
    window.webkit.messageHandlers.glyph.postMessage(msg);
    return true;
  }
  if (typeof window.__glyphNative === "function") {
    window.__glyphNative(JSON.stringify(msg));
    return true;
  }
  if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === "function") {
    window.chrome.webview.postMessage(JSON.stringify(msg));
    return true;
  }
  return false;
}

function postToApp(msg) {
  if (__glyphDeliver(msg)) return;
  // Running as a standalone page: the chrome layer is the shell.
  if (window.__glyphLocalSink) { window.__glyphLocalSink(msg); return; }
  __glyphPending.push(msg);
  if (__glyphPending.length > 1) return;
  let tries = 0;
  const timer = setInterval(() => {
    if (__glyphBridgeReady()) {
      clearInterval(timer);
      __glyphPending.splice(0).forEach(__glyphDeliver);
    } else if (++tries > 100) {
      clearInterval(timer);
    }
  }, 50);
}

function doSync() {
  if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
  const md = serializeDoc();
  if (md !== lastSerialized) {
    lastSerialized = md;
    lastSource = curPrefix + md;
    postToApp({ type: "source", text: lastSource });
  }
  // Returned so the app can flush synchronously before saving or closing,
  // instead of posting and hoping a fixed delay was long enough. With nothing
  // edited this is the text exactly as it arrived, not its tidied form, so a
  // note that was only read is never written back.
  return lastSource;
}
window.glyphFlush = doSync;
window.glyphSerialize = serializeDoc;

function scheduleSync() {
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(doSync, 600);
}

function currentBlock() {
  const sel = getSelection();
  if (!sel.rangeCount) return null;
  let n = sel.anchorNode;
  if (!n) return null;
  if (n.nodeType === Node.TEXT_NODE) n = n.parentElement;
  const md = document.getElementById("md");
  if (!md.contains(n)) return null;
  while (n && n.parentElement !== md) n = n.parentElement;
  return n;
}

/* Markdown-as-you-type: block rules fire when the block contains only the marker. */
function tryBlockRules() {
  const sel = getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return false;

  // Inside a list item, "[ ] " / "[x] " turns the item into a checkbox.
  let selEl = sel.anchorNode;
  if (selEl && selEl.nodeType === Node.TEXT_NODE) selEl = selEl.parentElement;
  const inLi = selEl && selEl.closest ? selEl.closest("#md li") : null;
  if (inLi && !inLi.querySelector(':scope > input[type="checkbox"]')) {
    const t = (inLi.textContent || "").replace(/\u00a0/g, " ");
    const tm = /^\[( |x)?\] $/.exec(t);
    if (tm) {
      inLi.textContent = "";
      inLi.classList.add("task");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      if (tm[1] === "x") cb.checked = true;
      inLi.appendChild(cb);
      const r = document.createRange();
      r.selectNodeContents(inLi);
      r.collapse(false);
      sel.removeAllRanges();
      sel.addRange(r);
      return true;
    }
  }

  const blk = currentBlock();
  if (!blk || !(blk.tagName === "P" || blk.tagName === "DIV")) return false;
  const text = (blk.textContent || "").replace(/\u00a0/g, " ");

  const clearBlock = () => {
    const r = document.createRange();
    r.selectNodeContents(blk);
    sel.removeAllRanges();
    sel.addRange(r);
    document.execCommand("delete");
  };

  // The browser sometimes nests the freshly made list inside the old
  // paragraph; unwrap it and put the caret back in the item.
  const convertToList = (ordered) => {
    clearBlock();
    document.execCommand(ordered ? "insertOrderedList" : "insertUnorderedList");
    const sel2 = getSelection();
    let li = sel2.anchorNode;
    if (li && li.nodeType === Node.TEXT_NODE) li = li.parentElement;
    li = li && li.closest ? li.closest("li") : null;
    if (!li) return null;
    const list = li.parentElement;
    const wrap = list ? list.parentElement : null;
    if (wrap && /^(P|DIV)$/.test(wrap.tagName) && wrap.parentElement &&
        (wrap.textContent || "").trim() === (list.textContent || "").trim()) {
      wrap.replaceWith(list);
    }
    const r = document.createRange();
    r.selectNodeContents(li);
    r.collapse(false);
    sel2.removeAllRanges();
    sel2.addRange(r);
    return li;
  };

  let m;
  if ((m = /^(#{1,6}) $/.exec(text))) {
    const level = m[1].length;
    clearBlock();
    document.execCommand("formatBlock", false, "<h" + level + ">");
    return true;
  }
  if (/^[-*] \[[ x]?\] ?$/.test(text)) {
    const li = convertToList(false);
    if (li) {
      li.classList.add("task");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      li.insertBefore(cb, li.firstChild);
      const r = document.createRange();
      r.selectNodeContents(li);
      r.collapse(false);
      sel.removeAllRanges();
      sel.addRange(r);
    }
    return true;
  }
  if (/^[-*] $/.test(text)) {
    convertToList(false);
    return true;
  }
  if (/^1[.)] $/.test(text)) {
    convertToList(true);
    return true;
  }
  if (/^> $/.test(text)) {
    clearBlock();
    document.execCommand("formatBlock", false, "<blockquote>");
    return true;
  }
  return false;
}

/* Inline rules: closing **bold**, *italic*, ==mark==, ~~strike~~, `code` converts live. */
function tryInlineRules() {
  const sel = getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return false;
  const node = sel.anchorNode;
  if (!node || node.nodeType !== Node.TEXT_NODE) return false;
  const parent = node.parentElement;
  if (!parent || parent.closest("code, pre")) return false;
  const upto = node.nodeValue.slice(0, sel.anchorOffset);
  const rules = [
    { re: /\*\*([^*\n]+)\*\*$/, tag: "strong" },
    { re: /(^|[^*])\*([^*\n]+)\*$/, tag: "em", group: 2 },
    { re: /==([^=\n]+)==$/, tag: "mark" },
    { re: /~~([^~\n]+)~~$/, tag: "del" },
    { re: /`([^`\n]+)`$/, tag: "code" },
  ];
  for (const r of rules) {
    const m = r.re.exec(upto);
    if (!m) continue;
    const inner = m[r.group || 1];
    const matchLen = r.group ? m[0].length - m[1].length : m[0].length;
    const start = sel.anchorOffset - matchLen;
    const range = document.createRange();
    range.setStart(node, start);
    range.setEnd(node, sel.anchorOffset);
    const el = document.createElement(r.tag);
    el.textContent = inner;
    range.deleteContents();
    range.insertNode(el);
    const space = document.createTextNode("\u200b");
    el.parentNode.insertBefore(space, el.nextSibling);
    const after = document.createRange();
    after.setStart(space, 1);
    after.collapse(true);
    sel.removeAllRanges();
    sel.addRange(after);
    return true;
  }
  return false;
}

/* ---------- toolbar API (called from the native formatting bar) ---------- */

function wrapSelectionWith(tag) {
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const container = range.startContainer.nodeType === Node.TEXT_NODE
    ? range.startContainer.parentElement
    : range.startContainer;
  const existing = container && container.closest(tag);
  if (existing && document.getElementById("md").contains(existing)) {
    const parent = existing.parentNode;
    while (existing.firstChild) parent.insertBefore(existing.firstChild, existing);
    existing.remove();
    return;
  }
  const el = document.createElement(tag);
  try {
    range.surroundContents(el);
  } catch (e) {
    const frag = range.extractContents();
    el.appendChild(frag);
    range.insertNode(el);
  }
  sel.removeAllRanges();
  const r = document.createRange();
  r.selectNodeContents(el);
  sel.addRange(r);
}

function insertBlockAfterCurrent(node) {
  const blk = currentBlock();
  const md = document.getElementById("md");
  if (blk) blk.insertAdjacentElement("afterend", node);
  else md.appendChild(node);
  const sel = getSelection();
  const r = document.createRange();
  r.selectNodeContents(node.querySelector("p, td, span") || node);
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);
}

window.glyphToolbar = function (cmd) {
  const md = document.getElementById("md");
  md.focus();
  switch (cmd) {
    case "bold": document.execCommand("bold"); break;
    case "italic": document.execCommand("italic"); break;
    case "underline": document.execCommand("underline"); break;
    case "strike": document.execCommand("strikeThrough"); break;
    case "highlight": wrapSelectionWith("mark"); break;
    case "code": wrapSelectionWith("code"); break;
    case "h1": case "h2": case "h3": {
      const blk = currentBlock();
      const target = cmd.toUpperCase();
      document.execCommand("formatBlock", false,
        blk && blk.tagName === target ? "<p>" : "<" + cmd + ">");
      break;
    }
    case "bullets": document.execCommand("insertUnorderedList"); break;
    case "numbers": document.execCommand("insertOrderedList"); break;
    case "body": document.execCommand("formatBlock", false, "<p>"); break;
    case "quote": document.execCommand("formatBlock", false, "<blockquote>"); break;
    case "codeblock": document.execCommand("formatBlock", false, "<pre>"); break;
    case "checklist": {
      const ul = document.createElement("ul");
      const li = document.createElement("li");
      li.className = "task";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      li.appendChild(cb);
      li.appendChild(document.createTextNode(" "));
      ul.appendChild(li);
      insertBlockAfterCurrent(ul);
      break;
    }
    case "link": {
      const sel = getSelection();
      if (sel.rangeCount && !sel.isCollapsed) {
        document.execCommand("createLink", false, "url");
      } else {
        document.execCommand("insertHTML", false, '<a href="url">link text</a>');
      }
      break;
    }
    case "callout": {
      const d = document.createElement("div");
      d.className = "callout";
      d.setAttribute("data-callout", "tip");
      d.setAttribute("data-raw-type", "tip");
      d.innerHTML = '<div class="callout-title">' + calloutIcon("flame")
        + "<span>Title</span></div><p>Text</p>";
      insertBlockAfterCurrent(d);
      break;
    }
    case "table": {
      const t = document.createElement("table");
      t.innerHTML = "<thead><tr><th>Column</th><th>Column</th></tr></thead>"
        + "<tbody><tr><td>Cell</td><td>Cell</td></tr></tbody>";
      insertBlockAfterCurrent(t);
      break;
    }
    case "eraser": document.execCommand("removeFormat"); break;
    case "undo": document.execCommand("undo"); break;
    case "redo": document.execCommand("redo"); break;
  }
  scheduleSync();
};

window.glyphInsertImage = function (src) {
  const md = document.getElementById("md");
  md.focus();
  document.execCommand("insertImage", false, src);
  scheduleSync();
};

/* ---------- render ---------- */

function ensureTrailingParagraph(md) {
  const last = md.lastElementChild;
  if (!last || /^(TABLE|PRE|UL|OL|BLOCKQUOTE|DETAILS|HR)$/.test(last.tagName) ||
      (last.classList && last.classList.contains("callout"))) {
    const p = document.createElement("p");
    p.innerHTML = "<br>";
    md.appendChild(p);
  }
}

function attachEditing(md) {
  md.contentEditable = "true";
  md.spellcheck = false;
  document.execCommand("defaultParagraphSeparator", false, "p");

  // Chromium sometimes emits <span style="font-weight:700"> where WebKit emits
  // <b>. Asking for tags rather than inline CSS keeps the serializer's job simple.
  try { document.execCommand("styleWithCSS", false, false); } catch (e) {}

  md.addEventListener("input", (e) => {
    // Never rewrite the DOM mid-composition: with a CJK or accent IME the typing
    // rules would inject nodes into a live composition and corrupt it.
    if (e && e.isComposing) { scheduleSync(); return; }
    // Deferred so the browser's own editing operation finishes first;
    // running conversions re-entrantly makes them half-apply.
    setTimeout(() => { tryBlockRules() || tryInlineRules(); }, 0);
    scheduleSync();
  });

  md.addEventListener("keydown", (e) => {
    if (MOD(e) && (e.key === "s" || e.key === "e")) { doSync(); return; }
    if (e.key === "Enter" && !e.shiftKey) {
      const blk = currentBlock();
      if (blk && /^H[1-6]$/.test(blk.tagName)) {
        e.preventDefault();
        const p = document.createElement("p");
        p.innerHTML = "<br>";
        blk.insertAdjacentElement("afterend", p);
        const sel = getSelection();
        const r = document.createRange();
        r.setStart(p, 0);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
        scheduleSync();
      }
    }
  });

  // Paste as plain text; pasted markdown becomes formatted after a quick re-render.
  md.addEventListener("paste", (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    if (!text) return;
    document.execCommand("insertText", false, text);
    if (/[#*`>\[\]|=~-]/.test(text) && text.includes("\n")) {
      setTimeout(() => {
        doSync();
        window.renderMarkdown(curPrefix + lastSerialized);
      }, 120);
    }
  });

  md.addEventListener("change", (e) => {
    if (e.target && e.target.matches && e.target.matches('input[type="checkbox"]')) {
      scheduleSync();
    }
  });

  md.addEventListener("toggle", () => scheduleSync(), true);

  md.addEventListener("click", (e) => {
    const a = e.target.closest ? e.target.closest("a") : null;
    if (a && MOD(e)) {
      e.preventDefault();
      postToApp({ type: "openURL", url: a.href });
    }
  });

  const modName = window.__glyphPlatform === "mac" ? "⌘" : "Ctrl";
  md.querySelectorAll("a").forEach((a) => { a.title = modName + "-click to open"; });

  // A wikilink names a note. The app resolves the name — the page never sends a
  // path and never builds an href, so a document cannot point this anywhere.
  md.querySelectorAll("span.wikilink").forEach((el) => {
    const raw = el.getAttribute("data-raw") || "";
    const target = raw.replace(/^!?\[\[/, "").replace(/\]\]$/, "");
    el.title = modName + "-click to open this note";
    el.addEventListener("click", (e) => {
      if (!MOD(e)) return;          // plain click still places the cursor
      e.preventDefault();
      e.stopPropagation();
      postToApp({ type: "openWikilink", target: target });
    });
  });

  // Click a held-back remote image to fetch it.
  md.querySelectorAll("img.remote-img").forEach((img) => {
    let host = "";
    try { host = new URL(img.dataset.remoteSrc).host; } catch (e) {}
    // Keep the author's alt text: the placeholder label is only for display, and
    // overwriting alt would write our label into the user's file on the next save.
    if (!img.hasAttribute("data-alt")) img.setAttribute("data-alt", img.getAttribute("alt") || "");
    img.setAttribute("alt", "Remote image" + (host ? " from " + host : "") + " — click to load");
    img.title = "This image lives on " + (host || "another server") +
      ". Loading it tells that server you opened this note.";
    img.addEventListener("click", () => {
      img.setAttribute("alt", img.getAttribute("data-alt") || "");
      img.src = img.dataset.remoteSrc;
      img.classList.remove("remote-img");
    }, { once: true });
  });
}

// Past this size, both marked and the sanitizer run long enough on the main
// thread to freeze the window (a 3.3MB note never finished). The macOS app
// guards this natively and opens such files raw; the portable shell has no
// native editor, so the chrome layer installs __glyphRawFallback and the render
// bails to the raw textarea instead of parsing. macOS never sets that hook (and
// never sends a document this large here), so it is unaffected.
const GLYPH_RENDER_LIMIT = 300000;

window.renderMarkdown = function (src) {
  if (typeof window.__glyphRawFallback === "function" &&
      src && src.length > GLYPH_RENDER_LIMIT) {
    window.__glyphRawFallback(src);
    return;
  }
  const y = window.scrollY;
  const { fm, body, prefix } = splitFrontmatter(src || "");
  curPrefix = prefix;
  lastSerialized = body.length && !body.endsWith("\n") ? body + "\n" : body;
  let html = "";
  if (fm && fm.trim()) html += propsHtml(fm);
  let mdHtml = "";
  try {
    // Sanitize before anything reaches the document. Our own trusted markup —
    // callout icons, tag chips, the Properties panel — is added afterwards.
    mdHtml = sanitizeHTML(marked.parse(guardInput(body)));
  } catch (e) {
    mdHtml = `<pre>${esc(body)}</pre>`;
  }
  html += `<article id="md">${mdHtml}</article>`;
  const content = document.getElementById("content");
  content.innerHTML = html;
  const md = document.getElementById("md");
  // Restore the class the sanitizer stripped, only where our own renderer put a
  // validated data-raw. A document cannot reach this: its data-raw was dropped.
  md.querySelectorAll("span[data-raw]").forEach((el) => el.classList.add("wikilink"));
  transformCallouts(md);
  tagTaskItems(md);
  styleTags(md);
  ensureTrailingParagraph(md);
  attachEditing(md);
  // attachEditing re-enables editing unconditionally, so a document already
  // judged unsafe to write back must be re-protected here — otherwise toggling
  // to the raw view and back silently removed both the lock and the warning.
  if (window.__glyphProtected) {
    window.glyphSetProtected(true, window.__glyphProtectedDetail);
  }
  // The baseline for "was this edited?" is this render's own serialization. It
  // cannot be the file's text: the serializer tidies what it reads (a * bullet
  // comes back as -), so that comparison called every untidy note edited.
  lastSerialized = serializeDoc();
  lastSource = src || "";
  window.scrollTo(0, y);
};

// The whole markdown of the open document, frontmatter included.
// Called by the app when a document does not survive a render/serialize cycle
// intact. The formatted view is where the serializer writes, so switching it off
// is what protects the file; the raw view (Cmd-E) writes the text literally and
// stays available.
window.__glyphProtected = false;
window.__glyphProtectedDetail = "";

window.glyphSetProtected = function (on, detail) {
  window.__glyphProtected = !!on;
  window.__glyphProtectedDetail = detail || "";
  const md = document.getElementById("md");
  const content = document.getElementById("content");
  if (!md || !content) return;
  const existing = document.getElementById("glyph-protected");
  if (existing) existing.remove();
  md.contentEditable = on ? "false" : "true";
  if (!on) return;
  const note = document.createElement("div");
  note.id = "glyph-protected";
  note.setAttribute("contenteditable", "false");
  note.innerHTML = "<b>Read-only — protecting this file.</b> Glyph cannot rewrite "
    + "this document exactly as it was written"
    + (detail ? " (" + detail + ")" : "")
    + ", so editing here is switched off rather than risk changing it. "
    + "Press \u2318E for the raw markdown, which edits and saves the text exactly.";
  content.insertBefore(note, content.firstChild);
};

window.glyphGetText = function () {
  return curPrefix + serializeDoc();
};

/* ---------- select all, and copy as markdown ----------
   Both live here rather than in the chrome layer because macOS needs them too,
   and because the page is the only place that can do either correctly.

   Select All had to move in here: WebKit's own selectAll: selects NOTHING while
   the page's activeElement is BODY, which is exactly the state the Mac app is
   left in — -applyMode makes the web view first responder, and that does not
   focus anything inside the page. Measured in a real WKWebView on sample.md:
   0 characters selected with BODY focused, 1327 with the article focused. So
   the menu item looked broken and was. Focusing the article and setting the
   Range here is deterministic, and it is also the only path the phone and the
   Windows/Linux shell have, since neither has a native Edit menu.

   Copy has to produce MARKDOWN. The rendered text is what the system clipboard
   would take, and it arrives with every heading, list marker and emphasis
   flattened away — useless for pasting a draft anywhere else. */

const COPY_BLOCK_TAGS = /^(H[1-6]|P|DIV|UL|OL|BLOCKQUOTE|PRE|TABLE|HR)$/;

// The in-page raw view, but only while it is the one on screen. macOS has no
// such element — its raw view is a native NSTextView — so this is null there
// and every path below falls through to the formatted view, which is correct.
function visibleRawArea() {
  const t = document.getElementById("glyph-raw");
  return t && document.body.classList.contains("glyph-raw") ? t : null;
}

window.glyphSelectAll = function () {
  const raw = visibleRawArea();
  if (raw) { raw.focus(); raw.select(); return raw.value.length; }
  const md = document.getElementById("md");
  if (!md) return 0;
  // preventScroll: selecting must not also jump the reader to the top.
  md.focus({ preventScroll: true });
  const r = document.createRange();
  r.selectNodeContents(md);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
  return sel.toString().length;
};

// A selection that starts mid-paragraph clones bare text and inline elements.
// serializeBlock has no case for those and falls through to `outerHTML`, which
// would put raw <strong> markup on the clipboard (rule 14) — so a run of inline
// nodes is wrapped in a paragraph before the block loop ever sees it.
function groupInlineRuns(host) {
  let run = null;
  Array.prototype.slice.call(host.childNodes).forEach((n) => {
    const isBlock = n.nodeType === Node.ELEMENT_NODE &&
      (COPY_BLOCK_TAGS.test(n.tagName) ||
       (n.classList && (n.classList.contains("callout") || n.classList.contains("props"))));
    if (isBlock) { run = null; return; }
    // Whitespace between two blocks is layout, not content.
    if (n.nodeType === Node.TEXT_NODE && !n.nodeValue.trim() && !run) {
      host.removeChild(n);
      return;
    }
    if (!run) {
      run = document.createElement("p");
      host.insertBefore(run, n);
    }
    run.appendChild(n);
  });
}

function selectionMarkdown() {
  const sel = getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const md = document.getElementById("md");
  if (!md) return null;
  const range = sel.getRangeAt(0);
  // Only what is inside the note counts — a stray selection in the toolbar or
  // the file drawer is not something anyone meant to copy.
  const anchor = range.commonAncestorContainer;
  if (anchor !== md && !md.contains(anchor)) return null;
  const host = document.createElement("div");
  host.appendChild(range.cloneContents());
  rewrapToDocumentShape(host, range, md);
  groupInlineRuns(host);
  const out = serializeDoc(host).replace(/\n+$/, "");
  return out.trim() ? out : null;
}

// cloneContents() returns the CONTENTS of a range, never the element they sat
// in — so a selection made inside a list arrives as bare <li> nodes and one
// inside a table as bare <tr>. serializeBlock has a case for neither, and the
// markers, the checkboxes and the whole table shape are silently lost.
// Measured before this: two bullets came back as "alpha\nbeta", two checklist
// items as " one\n two", and two table rows as "\n1\n2\n\n\n3\n4".
//
// Re-wrapping in a SHALLOW clone of each ancestor up to the article puts the
// fragment into the same shape the serializer sees in a whole document, so a
// list serializes as a list and a quote keeps its "> ". The clone is shallow
// and keeps attributes, which is what carries an <ol start> or a callout's
// data-raw-type. When the selection already spans whole blocks the common
// ancestor IS the article and nothing is wrapped.
function rewrapToDocumentShape(host, range, md) {
  let node = range.commonAncestorContainer;
  if (node.nodeType !== Node.ELEMENT_NODE) node = node.parentElement;
  const chain = [];
  while (node && node !== md && md.contains(node)) {
    chain.push(node);
    node = node.parentElement;
  }
  // Innermost first, so each wrap lands inside the next one out.
  chain.forEach((ancestor) => {
    const shell = ancestor.cloneNode(false);
    while (host.firstChild) shell.appendChild(host.firstChild);
    host.appendChild(shell);
  });
}

// "all" is the whole note, frontmatter included. "selection" falls back to the
// whole note when nothing is selected, so one shortcut covers both of the
// things a reader actually wants.
window.glyphCopyText = function (scope) {
  const raw = visibleRawArea();
  if (raw) {
    if (scope === "selection" && raw.selectionEnd > raw.selectionStart) {
      return raw.value.slice(raw.selectionStart, raw.selectionEnd);
    }
    return raw.value;
  }
  if (scope === "selection") {
    const s = selectionMarkdown();
    if (s) return s;
  }
  return window.glyphGetText();
};

// macOS writes the pasteboard natively; every other surface has to do it here.
// navigator.clipboard is gated on a SECURE CONTEXT and the phone server is plain
// http on a LAN address, so it simply does not exist there — measured against a
// running server on a 192.168.x.x address: isSecureContext false,
// navigator.clipboard undefined, document.execCommand("copy") supported (and the
// same holds for a Tailscale http:// address). The fallback therefore is
// not a nicety, it is the only path the phone has, and it must run inside the
// click that asked for it, so nothing is awaited before reaching it.
window.glyphCopyToClipboard = function (text) {
  const legacy = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    // Off-screen, but not display:none and not zero-opacity-only — iOS refuses
    // to copy from a node it considers invisible, and refuses to focus one
    // outside the viewport.
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;" +
                       "padding:0;border:0;outline:0;opacity:0;font-size:16px";
    ta.setAttribute("readonly", "");
    document.body.appendChild(ta);
    const prev = getSelection().rangeCount ? getSelection().getRangeAt(0) : null;
    ta.focus();
    ta.setSelectionRange(0, ta.value.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    // Put the reader's own selection back — copying should not lose it.
    if (prev) {
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(prev);
    }
    return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true, () => legacy());
  }
  return Promise.resolve(legacy());
};

/* ================= optional chrome =================
   Tabs, toolbar, open/save, word count, theme and a raw view — everything the
   macOS app gets from AppKit. Runs ONLY when window.__glyphChrome is set, so on
   macOS not one element is created and not one listener is bound. */
/* ---------- books ----------
   An EPUB is a zip of web pages, so a browser engine can read one with nothing
   added: the zip is walked here and inflated by the engine's DecompressionStream.
   This sits outside the chrome layer because the Mac app has no chrome and reads
   books through this same code. Nothing here runs until a book is opened.

   A book is untrusted input like a note. Its pages are parsed in documents that
   have no scripting, moved into an inert template, and go through the same scrub
   as a note before they reach the page. Its stylesheets are never applied: they
   are only read for the few things that carry meaning (see bookStyles). */

class BookError extends Error {}
const BOOK_MAX_ENTRY = 64 * 1024 * 1024;
const BOOK_ATTRS = new Set(["data-book-id", "data-book-style"]);
const XHTML_NS = "http://www.w3.org/1999/xhtml";
const BOOK_VOID = /^(area|base|br|col|embed|hr|img|input|link|meta|source|track|wbr)$/i;

function zipReader(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const notABook = () => new BookError("This file isn't a readable book");
  let end = -1;
  for (let i = bytes.length - 22, stop = Math.max(0, bytes.length - 65557); i >= stop; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { end = i; break; }
  }
  if (end < 0) throw notABook();
  const entries = new Map();
  const names = new TextDecoder();
  let at = view.getUint32(end + 16, true);
  for (let i = view.getUint16(end + 10, true); i > 0; i--) {
    if (at + 46 > bytes.length || view.getUint32(at, true) !== 0x02014b50) throw notABook();
    const nameLength = view.getUint16(at + 28, true);
    // Lower-cased because books regularly get the case of their own links wrong.
    entries.set(names.decode(bytes.subarray(at + 46, at + 46 + nameLength)).toLowerCase(), {
      method: view.getUint16(at + 10, true),
      packed: view.getUint32(at + 20, true),
      local: view.getUint32(at + 42, true),
    });
    at += 46 + nameLength + view.getUint16(at + 30, true) + view.getUint16(at + 32, true);
  }
  const has = (name) => entries.has(name.toLowerCase());
  async function read(name) {
    const entry = entries.get(name.toLowerCase());
    if (!entry || entry.local + 30 > bytes.length) throw notABook();
    const start = entry.local + 30 + view.getUint16(entry.local + 26, true) +
                  view.getUint16(entry.local + 28, true);
    const packed = bytes.subarray(start, start + entry.packed);
    if (entry.method === 0) return packed;
    if (entry.method !== 8) throw notABook();
    if (typeof DecompressionStream !== "function") {
      throw new BookError("This device is too old to open books");
    }
    // Counted as it arrives: what a zip says about its own size can't be trusted,
    // and a few kilobytes can inflate to more than a phone has.
    const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const reader = stream.getReader();
    const parts = [];
    let total = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      total += value.length;
      if (total > BOOK_MAX_ENTRY) { reader.cancel(); throw new BookError("Part of this book is too large to open"); }
      parts.push(value);
    }
    const out = new Uint8Array(total);
    let offset = 0;
    parts.forEach((p) => { out.set(p, offset); offset += p.length; });
    return out;
  }
  return { has, read };
}

function bookDecode(bytes) {
  if (bytes[0] === 0xff && bytes[1] === 0xfe) return new TextDecoder("utf-16le").decode(bytes);
  if (bytes[0] === 0xfe && bytes[1] === 0xff) return new TextDecoder("utf-16be").decode(bytes);
  const head = new TextDecoder("latin1").decode(bytes.subarray(0, 200));
  const declared = /encoding=["']([\w-]+)["']/.exec(head);
  try { return new TextDecoder(declared ? declared[1] : "utf-8").decode(bytes); }
  catch (e) { return new TextDecoder("utf-8").decode(bytes); }
}

// Once the text is decoded the XML declaration has done its job, and it can do harm:
// Chrome's page process dies on one saying standalone="yes" ahead of a DOCTYPE, with
// no error to catch, and a whole publisher's catalog is written that way.
function bookClean(text) {
  return text.replace(/^\ufeff/, "").replace(/^\s*<\?xml[^>]*\?>/, "");
}

function bookResolve(fromFile, href) {
  const hash = href.indexOf("#");
  let path = hash < 0 ? href : href.slice(0, hash);
  try { path = decodeURIComponent(path); } catch (e) { /* a literal % in a name */ }
  const parts = path.startsWith("/") ? [] : fromFile.split("/").slice(0, -1);
  path.split("/").forEach((s) => {
    if (s === "..") parts.pop();
    else if (s && s !== ".") parts.push(s);
  });
  return { path: parts.join("/"), fragment: hash < 0 ? "" : href.slice(hash + 1) };
}

// What a declaration block says that a reader would miss if it were lost.
function bookFlags(declarations) {
  const flags = [];
  if (/font-style\s*:\s*(italic|oblique)/i.test(declarations)) flags.push("i");
  if (/font-weight\s*:\s*(bold|[6-9]00)/i.test(declarations)) flags.push("b");
  if (/text-align\s*:\s*center/i.test(declarations)) flags.push("c");
  if (/text-align\s*:\s*right/i.test(declarations)) flags.push("r");
  if (/font-variant(-caps)?\s*:\s*small-caps/i.test(declarations)) flags.push("s");
  const size = /font-size\s*:\s*([\d.]+)(em|rem|%)/i.exec(declarations);
  if (/font-size\s*:\s*(x{1,2}-)?large/i.test(declarations) ||
      (size && parseFloat(size[1]) / (size[2] === "%" ? 100 : 1) >= 1.25)) flags.push("l");
  return flags;
}

// A publisher's stylesheet is not applied: the reader's own settings have to win,
// and a book must not be able to style the page. But in 213 of 924 real books most
// of the emphasis exists only there (<span class="calibre7">, with the italic in
// the CSS), so dropping it outright would lose it. So it is read, once, for class
// names and those few properties, and they come back as flags the page's own rules
// draw. split rather than regular expressions: a stylesheet is untrusted and a
// pattern across the whole text can be made to run for minutes (rule 16).
function bookStyles(css) {
  const styles = new Map();
  const text = css.split("/*").map((part, i) => {
    if (!i) return part;
    const close = part.indexOf("*/");
    return close < 0 ? "" : part.slice(close + 2);
  }).join(" ");
  text.split("}").forEach((rule) => {
    const open = rule.lastIndexOf("{");
    if (open < 0) return;
    const flags = bookFlags(rule.slice(open + 1));
    if (!flags.length) return;
    rule.slice(0, open).split(",").forEach((selector) => {
      const last = selector.trim().split(/[\s>+~]+/).pop();
      const classes = last.match(/\.[\w-]+/g);
      if (!classes || classes.length !== 1) return;
      const name = classes[0].slice(1);
      styles.set(name, [...new Set([...(styles.get(name) || []), ...flags])]);
    });
  });
  return styles;
}

async function bookParse(bytes) {
  const zip = zipReader(bytes);
  const all = (root, tag) => [...root.getElementsByTagNameNS("*", tag)];
  const xml = (text) => new DOMParser().parseFromString(bookClean(text), "application/xml");
  const text = async (path) => bookDecode(await zip.read(path));
  const notABook = () => new BookError("This file isn't a readable book");
  if (!zip.has("META-INF/container.xml")) throw notABook();
  const rootfile = all(xml(await text("META-INF/container.xml")), "rootfile")[0];
  const opfPath = rootfile && rootfile.getAttribute("full-path");
  if (!opfPath || !zip.has(opfPath)) throw notABook();

  // Fonts are often scrambled by a method every reader knows, and that is listed
  // here too. Only a chapter being listed means the book is really locked.
  if (zip.has("META-INF/encryption.xml")) {
    const locked = all(xml(await text("META-INF/encryption.xml")), "CipherReference")
      .some((r) => /\.x?html?$/i.test(r.getAttribute("URI") || ""));
    if (locked) throw new BookError("This book is copy-protected, so it can't be opened here");
  }

  const opf = xml(await text(opfPath));
  const items = new Map();
  all(opf, "item").forEach((item) => {
    items.set(item.getAttribute("id"), {
      path: bookResolve(opfPath, item.getAttribute("href") || "").path,
      type: item.getAttribute("media-type") || "",
      properties: item.getAttribute("properties") || "",
    });
  });
  const spine = all(opf, "itemref").map((ref) => items.get(ref.getAttribute("idref")))
    .filter((item) => item && /html/i.test(item.type) && zip.has(item.path));
  if (!spine.length) throw notABook();

  const firstText = (tag) => ((all(opf, tag)[0] || {}).textContent || "").trim();
  const styles = new Map();
  for (const item of items.values()) {
    if (item.type !== "text/css" || !zip.has(item.path)) continue;
    (bookStyles(await text(item.path))).forEach((flags, name) => {
      styles.set(name, [...new Set([...(styles.get(name) || []), ...flags])]);
    });
  }

  const label = (node) => (node ? node.textContent : "").replace(/\s+/g, " ").trim();
  const contents = [];
  async function readNav(item) {
    const doc = xml(await text(item.path));
    const navs = all(doc, "nav");
    const nav = navs.find((n) => /toc/.test(n.getAttribute("epub:type") || "")) || navs[0];
    const walk = (list, depth) => {
      [...list.children].filter((li) => li.localName === "li").forEach((li) => {
        const a = [...li.children].find((c) => c.localName === "a");
        const nested = [...li.children].find((c) => c.localName === "ol");
        const heading = [...li.children].find((c) => c.localName === "span");
        if (a && a.getAttribute("href")) {
          contents.push({ label: label(a), depth, ...bookResolve(item.path, a.getAttribute("href")) });
        } else if (heading && nested) {
          contents.push({ label: label(heading), depth, path: "", fragment: "" });   // "Part One"
        }
        if (nested) walk(nested, depth + 1);
      });
    };
    const top = nav && [...nav.children].find((c) => c.localName === "ol");
    if (top) walk(top, 0);
  }
  async function readNcx(item) {
    const doc = xml(await text(item.path));
    const walk = (parent, depth) => {
      [...parent.children].filter((n) => n.localName === "navPoint").forEach((point) => {
        const name = all(point, "text")[0];
        const content = [...point.children].find((c) => c.localName === "content");
        if (content && content.getAttribute("src")) {
          contents.push({ label: label(name), depth, ...bookResolve(item.path, content.getAttribute("src")) });
        }
        walk(point, depth + 1);
      });
    };
    const map = all(doc, "navMap")[0];
    if (map) walk(map, 0);
  }
  const navItem = [...items.values()].find((i) => /(^|\s)nav(\s|$)/.test(i.properties));
  const ncxItem = [...items.values()].find((i) => /dtbncx/.test(i.type));
  try { if (navItem && zip.has(navItem.path)) await readNav(navItem); } catch (e) { contents.length = 0; }
  try { if (!contents.length && ncxItem && zip.has(ncxItem.path)) await readNcx(ncxItem); } catch (e) { contents.length = 0; }
  if (!contents.length) {
    spine.forEach((item, i) => contents.push({ label: "Part " + (i + 1), depth: 0, path: item.path, fragment: "" }));
  }

  return { zip, spine, contents, styles, title: firstText("title"), author: firstText("creator"),
           language: firstText("language") };
}

function bookImageType(bytes) {
  if (bytes[0] === 0x89 && bytes[1] === 0x50) return "image/png";
  if (bytes[0] === 0xff && bytes[1] === 0xd8) return "image/jpeg";
  if (bytes[0] === 0x47 && bytes[1] === 0x49) return "image/gif";
  if (bytes[0] === 0x52 && bytes[8] === 0x57) return "image/webp";
  return /<svg[\s>]/i.test(new TextDecoder().decode(bytes.subarray(0, 2048))) ? "image/svg+xml" : null;
}

function bookDataURL(bytes, type) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(new Blob([bytes], { type }));
  });
}

// Which file in the zip each picture is, until the reader asks for it.
const bookImages = new WeakMap();

async function bookChapter(book, index) {
  const path = book.spine[index].path;
  const source = bookClean(bookDecode(await book.zip.read(path)));
  const parser = new DOMParser();
  // XML first, because <a id="x"/> read as HTML would swallow the rest of the
  // page. But one undeclared &nbsp; is a fatal error to an XML parser.
  let doc = parser.parseFromString(source, "application/xhtml+xml");
  if (doc.getElementsByTagName("parsererror").length ||
      (doc.documentElement && doc.documentElement.namespaceURI !== XHTML_NS)) {
    // HTML reads <a id="x"/> as an anchor that never closes, so spell those out.
    const opened = source.replace(/<([a-z][a-z0-9]*)(\s[^<>]*?)?\/>/gi, (tag, name, attrs) =>
      (BOOK_VOID.test(name) ? tag : "<" + name + (attrs || "") + "></" + name + ">"));
    doc = parser.parseFromString(opened, "text/html");
  }
  const body = doc.getElementsByTagNameNS("*", "body")[0];
  const tpl = document.createElement("template");
  const inert = tpl.content.ownerDocument;
  const root = tpl.content;

  // All of this happens in the parser's document, which nothing is watching.
  // Importing a style attribute into this page counts as using it, and the page's
  // policy refuses it, once for every element, so it has to be gone by then.
  if (body) {
    // A cover is usually an <svg> holding one <image>, and the scrub drops both.
    body.querySelectorAll("svg").forEach((svg) => {
      const image = svg.querySelector("image");
      const href = image && (image.getAttribute("xlink:href") || image.getAttribute("href"));
      if (!href) return;
      const img = doc.createElementNS(XHTML_NS, "img");
      img.setAttribute("src", href);
      svg.replaceWith(img);
    });
    body.querySelectorAll("*").forEach((el) => {
      // Removed first, so a book cannot supply these itself.
      el.removeAttribute("data-book-id");
      el.removeAttribute("data-book-style");
      const flags = new Set(bookFlags(el.getAttribute("style") || ""));
      el.removeAttribute("style");
      (el.getAttribute("class") || "").split(/\s+/).forEach((name) => {
        (book.styles.get(name) || []).forEach((flag) => flags.add(flag));
      });
      if (flags.size) el.setAttribute("data-book-style", [...flags].join(" "));
      const id = el.getAttribute("id") || (el.localName === "a" && el.getAttribute("name"));
      if (!id) return;
      if (SAFE_TAGS.has(el.localName.toLowerCase())) {
        el.setAttribute("data-book-id", id);
      } else {
        // The scrub unwraps this element (<aside> holding a footnote, <section>
        // holding a chapter), and a link to it still has to land somewhere.
        const mark = doc.createElementNS(XHTML_NS, "span");
        mark.setAttribute("data-book-id", id);
        el.before(mark);
      }
    });
    [...body.childNodes].forEach((n) => root.appendChild(inert.importNode(n, true)));
  }
  scrubNode(root, BOOK_ATTRS);

  root.querySelectorAll("img").forEach((img) => {
    const src = img.getAttribute("src");
    const target = src && !/^[a-z][a-z0-9+.-]*:/i.test(src) && bookResolve(path, src).path;
    if (target && book.zip.has(target)) {
      bookImages.set(img, target);
      img.removeAttribute("src");
    } else {
      img.replaceWith(inert.createTextNode(img.getAttribute("alt") || ""));
    }
  });
  return root;
}

const BOOK_FONTS = [
  ["iowan", "Iowan", '"Iowan Old Style", Palatino, Georgia, serif'],
  ["charter", "Charter", 'Charter, "Bitstream Charter", Georgia, serif'],
  ["newyork", "New York", 'ui-serif, "New York", Georgia, serif'],
  ["system", "System", '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'],
];
const BOOK_SPACING = { compact: 1.4, normal: 1.6, open: 1.85 };
const BOOK_MARGINS = { small: ["12px", "44em"], normal: ["22px", "34em"], large: ["36px", "28em"] };
// A scanned book is one chapter of hundreds of full-page pictures (378 in one of
// her books, 167MB), and holding them all would run a phone out of memory. So past
// this many, a chapter works like a PDF: only the pictures near the screen exist.
const BOOK_EAGER_IMAGES = 24;
const BOOK_SIZE_MIN = 13;
const BOOK_SIZE_MAX = 32;

function bookStored(name, fallback) {
  try { return JSON.parse(localStorage.getItem(name)) || fallback; } catch (e) { return fallback; }
}
function bookStore(name, value) {
  try { localStorage.setItem(name, JSON.stringify(value)); } catch (e) { /* private mode */ }
}

// One book on screen. Everything it needs comes through opts, so the phone's tabs
// and the Mac's window each host it their own way. It starts detached: start()
// runs once it is in the document, because a saved place needs real layout.
window.glyphOpenBook = async function (bytes, key, opts) {
  const book = await bookParse(bytes);
  const count = book.spine.length;
  const placeKey = "glyphBookAt:" + key;
  const defaults = { size: 18, font: "iowan", spacing: "normal", margins: "normal", align: "left", page: "auto",
                     reading: "scroll", spread: "auto" };
  const prefs = Object.assign(defaults, bookStored("glyphBookPrefs", {}));
  let current = 0;
  let showing = 0;
  let trail = null;

  const make = (tag, className, label) => {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (label) el.textContent = label;
    return el;
  };
  const el = make("div", "glyph-book");
  const bar = make("div", "glyph-book-bar");
  const contentsButton = make("button", "glyph-book-button", "Contents");
  const backButton = make("button", "glyph-book-button", "Back");
  backButton.hidden = true;
  const chapterName = make("div", "glyph-book-where");
  const formatButton = make("button", "glyph-book-button glyph-book-aa", "Aa");
  formatButton.setAttribute("aria-label", "Text and page settings");
  bar.append(contentsButton, backButton, chapterName, formatButton);

  const text = make("article", "glyph-book-text");
  if (book.language) text.lang = book.language;
  const foot = make("nav", "glyph-book-foot");
  const previousButton = make("button", "glyph-book-button", "Previous");
  const place = make("span", "glyph-book-place");
  const nextButton = make("button", "glyph-book-button", "Next");
  foot.append(previousButton, place, nextButton);

  const scrim = make("div", "glyph-book-scrim");
  const sheet = make("div", "glyph-book-sheet");
  const sheetHead = make("div", "glyph-book-sheet-head");
  sheetHead.append(make("div", "glyph-book-title", book.title || "Untitled"));
  if (book.author) sheetHead.append(make("div", "glyph-book-author", book.author));
  const sheetList = make("div", "glyph-book-sheet-list");
  sheet.append(sheetHead, sheetList);
  const panel = make("div", "glyph-book-panel");
  el.append(bar, text, foot, scrim, sheet, panel);

  const overlay = (which) => {
    if (which) el.dataset.open = which;
    else delete el.dataset.open;
  };
  const spineIndex = (path) => book.spine.findIndex((i) => i.path.toLowerCase() === path.toLowerCase());
  const chapterAt = (index) => {
    let best = null;
    book.contents.forEach((entry) => {
      const at = spineIndex(entry.path);
      if (at >= 0 && at <= index) best = entry;
    });
    return best;
  };
  const scrollRange = () => Math.max(1, document.documentElement.scrollHeight - window.innerHeight);

  // Pages: the chapter is laid out in columns exactly one screen tall, and a page
  // turn moves sideways by exactly one screen. Two pages side by side is the same
  // thing with two columns, and Auto uses it when a wide screen is held sideways.
  let page = 0;
  const paged = () => prefs.reading === "pages";
  const twoUp = () => prefs.spread === "two" ||
    (prefs.spread === "auto" && window.innerWidth > window.innerHeight && (el.clientWidth || window.innerWidth) >= 700);
  const pageStride = () => {
    const style = getComputedStyle(text);
    const inner = text.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    return inner + (parseFloat(style.columnGap) || 0);
  };
  const pageCount = () => Math.max(1,
    Math.ceil((text.scrollWidth - parseFloat(getComputedStyle(text).paddingLeft) - 1) / pageStride()));
  const fraction = () => paged()
    ? (pageCount() > 1 ? page / (pageCount() - 1) : 0)
    : Math.min(1, window.scrollY / scrollRange());
  const remember = () => bookStore(placeKey, { chapter: current, fraction: fraction() });
  function layoutPages() {
    el.classList.toggle("glyph-book-paged", paged());
    el.classList.toggle("glyph-book-two", paged() && twoUp());
    if (!paged()) {
      text.style.removeProperty("height");
      return;
    }
    window.scrollTo(0, 0);
    const room = window.innerHeight - text.getBoundingClientRect().top - foot.getBoundingClientRect().height;
    const height = Math.max(240, Math.floor(room));
    text.style.setProperty("height", height + "px");
    text.style.setProperty("--book-page-h", height + "px");
  }
  function paintPlace() {
    place.textContent = paged()
      ? "Page " + (page + 1) + " of " + pageCount()
      : (current + 1) + " of " + count;
  }
  function showPage(n, smooth) {
    page = Math.max(0, Math.min(pageCount() - 1, n));
    text.scrollTo({ left: page * pageStride(), behavior: smooth ? "smooth" : "auto" });
    paintPlace();
    remember();
  }
  // Past the last page is the next chapter, and before the first, the last page
  // of the one before.
  function turn(step) {
    if (!paged()) { go(current + step); return; }
    const next = page + step;
    if (next < 0) { if (current > 0) go(current - 1, { fraction: 1 }); return; }
    if (next >= pageCount()) { if (current < count - 1) go(current + 1); return; }
    showPage(next, true);
  }

  async function showPicture(img, always) {
    const path = bookImages.get(img);
    if (!path || img.getAttribute("src")) return;
    let url = null;
    try {
      const bytes = await book.zip.read(path);
      const type = bookImageType(bytes);
      if (type) url = await bookDataURL(bytes, type);
    } catch (e) { /* a picture missing is not a chapter missing */ }
    if (!url) {
      img.replaceWith(document.createTextNode(img.getAttribute("alt") || ""));
      return;
    }
    if (!always && !nearby.has(img)) return;   // scrolled past while it loaded
    img.src = url;
    await img.decode().catch(() => {});
    if (always || !img.naturalWidth) return;
    // Keeps its place once its picture is let go, and the pages not yet seen take
    // the same shape, because a scanned book's pages are all alike.
    const shape = img.naturalWidth + " / " + img.naturalHeight;
    img.style.setProperty("aspect-ratio", shape);
    text.style.setProperty("--book-page", shape);
  }
  const nearby = new Set();
  // Scrolling, "near" is above and below the screen; in pages it is the pages
  // either side, which only the text itself can see past its own clipping.
  const watchPictures = () => new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        nearby.add(entry.target);
        showPicture(entry.target, false);
      } else {
        nearby.delete(entry.target);
        entry.target.removeAttribute("src");
      }
    });
  }, paged() ? { root: text, rootMargin: "0px 150%" } : { rootMargin: "150% 0px" });
  let picturesSeen = watchPictures();

  async function go(index, where) {
    if (index < 0 || index >= count) return;
    const ticket = ++showing;
    let root;
    try {
      root = await bookChapter(book, index);
    } catch (e) {
      // One bad chapter is not the whole book, so the way past it stays open.
      if (!(e instanceof BookError) && opts.onProblem) opts.onProblem(e);
      root = make("p", "glyph-book-failed",
                  e instanceof BookError ? e.message : "This part of the book could not be read");
    }
    if (ticket !== showing) return;        // a later tap got there first
    current = index;
    picturesSeen.disconnect();
    picturesSeen = watchPictures();
    nearby.clear();
    text.replaceChildren(root);
    layoutPages();
    const pictures = [...text.querySelectorAll("img")];
    if (pictures.length <= BOOK_EAGER_IMAGES) {
      await Promise.all(pictures.map((img) => showPicture(img, true)));
    } else {
      pictures.forEach((img) => {
        img.classList.add("glyph-book-pending");
        picturesSeen.observe(img);
      });
    }
    if (ticket !== showing) return;
    const entry = chapterAt(index);
    chapterName.textContent = entry ? entry.label : (book.title || "");
    previousButton.disabled = index === 0;
    nextButton.disabled = index === count - 1;
    paintContents();
    const anchor = where && where.fragment &&
      [...text.querySelectorAll("[data-book-id]")].find((n) => n.dataset.bookId === where.fragment);
    if (paged()) {
      if (anchor) {
        const left = anchor.getBoundingClientRect().left - text.getBoundingClientRect().left + text.scrollLeft;
        page = Math.floor(left / pageStride());
      } else {
        page = Math.round((where && where.fraction ? where.fraction : 0) * (pageCount() - 1));
      }
      showPage(page, false);
    } else if (anchor) {
      const top = anchor.getBoundingClientRect().top + window.scrollY - bar.getBoundingClientRect().height * 2;
      window.scrollTo(0, Math.max(0, top));
    } else {
      window.scrollTo(0, where && where.fraction ? where.fraction * scrollRange() : 0);
    }
    paintPlace();
    remember();
    if (opts.onMove) opts.onMove();
  }

  function paintContents() {
    sheetList.replaceChildren();
    book.contents.forEach((entry) => {
      const row = make("button", "glyph-book-entry", entry.label || "Untitled");
      row.style.setProperty("--depth", String(Math.min(entry.depth, 4)));
      const at = spineIndex(entry.path);
      if (at === current) row.setAttribute("aria-current", "true");
      row.addEventListener("click", () => {
        overlay(null);
        trail = null;
        backButton.hidden = true;
        go(at, { fragment: entry.fragment });
      });
      row.disabled = at < 0;
      sheetList.appendChild(row);
    });
  }

  function applyPrefs() {
    const font = BOOK_FONTS.find((f) => f[0] === prefs.font) || BOOK_FONTS[0];
    const margins = BOOK_MARGINS[prefs.margins] || BOOK_MARGINS.normal;
    el.dataset.page = prefs.page;
    el.dataset.align = prefs.align;
    el.style.setProperty("--book-size", prefs.size + "px");
    sizeShown.textContent = prefs.size;
    el.style.setProperty("--book-font", font[2]);
    el.style.setProperty("--book-spacing", String(BOOK_SPACING[prefs.spacing] || BOOK_SPACING.normal));
    el.style.setProperty("--book-margin", margins[0]);
    el.style.setProperty("--book-measure", margins[1]);
    panel.querySelectorAll("[data-pref]").forEach((b) => {
      b.setAttribute("aria-pressed", String(String(prefs[b.dataset.pref]) === b.dataset.value));
    });
  }
  // Changing the text changes how long the chapter is, so the place is kept as a
  // share of the chapter rather than a distance from the top.
  function changePref(name, value) {
    const was = fraction();
    prefs[name] = value;
    bookStore("glyphBookPrefs", prefs);
    applyPrefs();
    if (name === "reading" || name === "spread") { go(current, { fraction: was }); return; }
    if (paged()) { layoutPages(); showPage(Math.round(was * (pageCount() - 1)), false); return; }
    window.scrollTo(0, was * scrollRange());
  }

  const row = (name, ...controls) => {
    const line = make("div", "glyph-book-row");
    line.append(make("span", "glyph-book-row-name", name), ...controls);
    panel.appendChild(line);
  };
  const choice = (pref, options) => {
    const group = make("div", "glyph-book-choice");
    options.forEach(([value, label, font]) => {
      const b = make("button", "", label);
      b.dataset.pref = pref;
      b.dataset.value = value;
      if (font) b.style.setProperty("font-family", font);
      b.addEventListener("click", () => changePref(pref, value));
      group.appendChild(b);
    });
    return group;
  };
  const sizeControl = make("div", "glyph-book-choice");
  const sizeStep = (label, step, name) => {
    const b = make("button", "", label);
    b.setAttribute("aria-label", name);
    b.addEventListener("click", () => {
      changePref("size", Math.min(BOOK_SIZE_MAX, Math.max(BOOK_SIZE_MIN, prefs.size + step)));
    });
    sizeControl.appendChild(b);
  };
  sizeStep("A−", -1, "Smaller text");
  const sizeShown = make("span", "glyph-book-size");
  sizeControl.appendChild(sizeShown);
  sizeStep("A+", 1, "Larger text");
  row("Size", sizeControl);
  row("Font", choice("font", BOOK_FONTS));
  row("Spacing", choice("spacing", [["compact", "Tight"], ["normal", "Normal"], ["open", "Open"]]));
  row("Margins", choice("margins", [["small", "Small"], ["normal", "Normal"], ["large", "Large"]]));
  row("Align", choice("align", [["left", "Left"], ["justify", "Justified"]]));
  row("Page", choice("page", [["auto", "Auto"], ["paper", "Paper"], ["sepia", "Sepia"], ["night", "Night"]]));
  row("Reading", choice("reading", [["scroll", "Scroll"], ["pages", "Pages"]]));
  row("Pages", choice("spread", [["auto", "Auto"], ["one", "One"], ["two", "Two"]]));

  contentsButton.addEventListener("click", () => {
    overlay(el.dataset.open === "contents" ? null : "contents");
    const here = sheetList.querySelector('[aria-current="true"]');
    if (here) here.scrollIntoView({ block: "center" });
  });
  formatButton.addEventListener("click", () => overlay(el.dataset.open === "format" ? null : "format"));
  scrim.addEventListener("click", () => overlay(null));
  previousButton.addEventListener("click", () => go(current - 1));
  nextButton.addEventListener("click", () => go(current + 1));
  // One step back is all a footnote needs.
  backButton.addEventListener("click", () => {
    const to = trail;
    trail = null;
    backButton.hidden = true;
    if (to) go(to.chapter, { fraction: to.fraction });
  });
  text.addEventListener("click", (e) => {
    const link = e.target.closest && e.target.closest("a[href]");
    if (!link) {
      // In pages, a tap near either edge turns the page, as in a book app.
      const sel = window.getSelection();
      if (!paged() || (sel && !sel.isCollapsed)) return;
      const box = text.getBoundingClientRect();
      const at = (e.clientX - box.left) / box.width;
      if (at < 0.22) turn(-1);
      else if (at > 0.78) turn(1);
      return;
    }
    e.preventDefault();
    const href = link.getAttribute("href");
    if (/^[a-z][a-z0-9+.-]*:/i.test(href)) { if (opts.openLink) opts.openLink(href); return; }
    const to = bookResolve(book.spine[current].path, href);
    const index = href.startsWith("#") ? current : spineIndex(to.path);
    if (index < 0) return;
    trail = { chapter: current, fraction: fraction() };
    backButton.hidden = false;
    go(index, { fragment: to.fragment });
  });

  // A swipe turns the page; a mostly vertical drag is left alone.
  let touchAt = null;
  text.addEventListener("touchstart", (e) => {
    touchAt = paged() && e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
  }, { passive: true });
  text.addEventListener("touchend", (e) => {
    if (!touchAt) return;
    const dx = e.changedTouches[0].clientX - touchAt.x;
    const dy = e.changedTouches[0].clientY - touchAt.y;
    touchAt = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) turn(dx < 0 ? 1 : -1);
  }, { passive: true });
  // A trackpad or a mouse wheel turns one page per gesture.
  let wheelQuiet = 0;
  text.addEventListener("wheel", (e) => {
    if (!paged()) return;
    e.preventDefault();
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(delta) < 8 || Date.now() < wheelQuiet) return;
    wheelQuiet = Date.now() + 450;
    turn(delta > 0 ? 1 : -1);
  }, { passive: false });
  const onResize = () => {
    if (!el.isConnected || !paged()) return;
    const was = fraction();
    layoutPages();
    showPage(Math.round(was * (pageCount() - 1)), false);
  };

  let saveTimer = null;
  const onScroll = () => {
    if (!el.isConnected || saveTimer) return;
    saveTimer = setTimeout(() => { saveTimer = null; if (el.isConnected) remember(); }, 500);
  };
  const onKey = (e) => {
    if (!el.isConnected || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight") turn(1);
    else if (e.key === "ArrowLeft") turn(-1);
    else if (e.key === "Escape") overlay(null);
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onResize);
  document.addEventListener("keydown", onKey);
  applyPrefs();

  return {
    el, title: book.title, author: book.author,
    progress: () => (current + 1) + " of " + count,
    relayout: onResize,
    start: () => {
      const at = bookStored(placeKey, {});
      return go(at.chapter >= 0 && at.chapter < count ? at.chapter : 0, { fraction: at.fraction });
    },
    close: () => {
      picturesSeen.disconnect();
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onResize);
      document.removeEventListener("keydown", onKey);
    },
  };
};

// The Mac app hands a book over in pieces: one evaluateJavaScript call carrying a
// whole 100MB book as a string is not something to depend on.
let bookPieces = [];
window.glyphBookPiece = function (base64) { bookPieces.push(atob(base64)); };
window.glyphBookShow = async function (key) {
  const pieces = bookPieces;
  bookPieces = [];
  const bytes = new Uint8Array(pieces.reduce((sum, p) => sum + p.length, 0));
  let offset = 0;
  pieces.forEach((p) => {
    for (let i = 0; i < p.length; i++) bytes[offset + i] = p.charCodeAt(i);
    offset += p.length;
  });
  document.body.classList.add("glyph-book-only");
  document.querySelectorAll(".glyph-book, .glyph-book-error").forEach((n) => n.remove());
  try {
    const reader = await window.glyphOpenBook(bytes, key, {
      openLink: (url) => postToApp({ type: "openURL", url }),
    });
    document.body.appendChild(reader.el);
    await reader.start();
    return JSON.stringify({ title: reader.title, author: reader.author });
  } catch (e) {
    const note = document.createElement("p");
    note.className = "glyph-book-error";
    note.textContent = e instanceof BookError ? e.message : "This book could not be read";
    document.body.appendChild(note);
    return JSON.stringify({ error: note.textContent });
  }
};

window.__glyphInstallChrome = function () {
  const MODNAME = window.__glyphPlatform === "mac" ? "⌘" : "Ctrl";
  const svg = (d) =>
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round">' + d + "</svg>";

  const ICON = {
    undo: svg('<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>'),

    bold: svg('<path d="M6 4h8a4 4 0 0 1 0 8H6z"/><path d="M6 12h9a4 4 0 0 1 0 8H6z"/>'),

    link: svg('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'),
