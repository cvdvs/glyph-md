  async function settle(list, path, isDir) {
    if (list.includes(active())) captureActive();
    for (const d of docs) if (d.committing && isDir && inside(d.freshFolder || "", path)) await d.committing;
    for (const d of list) {
      for (let i = 0; d.saving && i < 300; i++) await pause(50);
      if (d.saveTimer) { clearTimeout(d.saveTimer); d.saveTimer = null; }
      if (d.retryTimer) { clearTimeout(d.retryTimer); d.retryTimer = null; }
      if (d.pendingSave && !d.conflict) await flushServerSave(d);
      if (d.pendingSave || d.saving) {
        flash("An edit hasn’t reached the Mac yet. Try again once it has");
        if (d.pendingSave && !d.conflict) scheduleServerRetry(d);
        return false;
      }
    }
    return true;
  }
  // What was open, kept as a draft, or remembered as a book's place follows the
  // file to its new name.
  function repath(from, to, isDir) {
    const swap = (p) => (p === from ? to : isDir && inside(p, from) ? to + p.slice(from.length) : null);
    docs.forEach((d) => {
      const n = d.serverPath && swap(d.serverPath);
      if (n) { d.serverPath = n; d.name = baseName(n); }
      if (isDir && d.isFresh && d.freshFolder) d.freshFolder = swap(d.freshFolder) || d.freshFolder;
    });
    const drafts = readDrafts();
    let moved = false;
    Object.keys(drafts).forEach((k) => {
      const n = swap(k);
      if (n) { drafts[n] = drafts[k]; delete drafts[k]; moved = true; }
    });
    if (moved) writeDrafts(drafts);
    try {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
      keys.filter((k) => k && k.startsWith("glyphBookAt:")).forEach((k) => {
        const n = swap(k.slice(12));
        if (n) { localStorage.setItem("glyphBookAt:" + n, localStorage.getItem(k)); localStorage.removeItem(k); }
      });
    } catch (e) { /* private mode */ }
    if (isDir && inside(libraryPath, from)) libraryPath = to + libraryPath.slice(from.length);
  }

  async function relocate(path, isDir, to) {
    if (to === path) return false;
    const list = openUnder(path, isDir);
    if (!(await settle(list, path, isDir))) return false;
    const out = await folderApi("move", { from: path, to }, baseName(to));
    if (!out) return false;
    repath(path, out.path || to, isDir);
    if (!isDir && typeof out.mtime === "number") list.forEach((d) => { d.mtime = out.mtime; });
    await loadServerList();
    paintChrome();
    return true;
  }
  async function moveItem(path, isDir, folder) {
    if (folder === folderOf(path) || (isDir && inside(folder, path))) return;
    if (await relocate(path, isDir, (folder ? folder + "/" : "") + baseName(path))) {
      flash("Moved to " + folderLabel(folder));
    }
  }
  async function chooseFolderFor(path, isDir) {
    const folder = await pickFolder(path, isDir);
    if (folder != null) moveItem(path, isDir, folder);
  }
  async function renameItem(path, isDir) {
    const name = baseName(path);
    const ext = isDir ? "" : (/\.[^./]+$/.exec(name) || [""])[0];
    const now = ext ? name.slice(0, -ext.length) : name;
    const note = isDir || isPdfName(name) || isBookName(name) ? "" :
      "The note’s file name on your Mac. The list shows its first line.";
    let typed = await askName(isDir ? "Rename Folder" : "Rename File", now, "Rename", note);
    if (typed == null) return;
    if (ext && typed.toLowerCase().endsWith(ext.toLowerCase())) typed = typed.slice(0, -ext.length).trim();
    if (!typed || typed === now) return;
    if (await relocate(path, isDir, (folderOf(path) ? folderOf(path) + "/" : "") + typed + ext)) flash("Renamed");
  }
  async function trashItem(path, isDir) {
    const label = itemLabel(path, isDir);
    // A note, or an empty folder, goes at once and can be undone; a folder with
    // files in it asks first, since that is a lot to lose by a slip.
    const n = isDir ? serverFiles.filter((f) => inside(f.path, path)).length : 0;
    if (n) {
      const yes = await askConfirm("Move “" + label + "” to the Trash?",
        (n === 1 ? "This folder and the file in it go" : "This folder and the " + n + " files in it go") +
        " to the Trash on your Mac, where you can take them back out.", "Move to Trash");
      if (!yes) return;
    }
    const list = openUnder(path, isDir);
    if (!(await settle(list, path, isDir))) return;
    const out = await folderApi("trash", { path }, label);
    if (!out) return;
    const wasShowing = list.includes(active());
    list.forEach((d) => { clearDraft(d); dropDoc(d); });
    const drafts = readDrafts();
    Object.keys(drafts).forEach((k) => { if (isDir ? inside(k, path) : k === path) delete drafts[k]; });
    writeDrafts(drafts);
    if (isDir) docs.forEach((d) => { if (d.isFresh && inside(d.freshFolder || "", path)) d.freshFolder = folderOf(path); });
    if (isDir && inside(libraryPath, path)) libraryPath = folderOf(path);
    if (wasShowing) document.body.classList.remove("glyph-raw");
    if (wasShowing && !wide()) openLibrary(folderOf(path));
    else await loadServerList();
    paintChrome();
    if (out.undo) showUndo("“" + label + "” moved to the Trash", () => untrash(out.undo, label));
    else flash("Moved to the Trash");
  }
  async function untrash(id, label) {
    const out = await folderApi("untrash", { undo: id }, label);
    if (!out) return;
    await loadServerList();
    flash("Put back in " + folderLabel(folderOf(out.path)));
  }
  function showUndo(text, fn) {
    undoText.textContent = text;
    undoAction = fn;
    undoBar.classList.add("glyph-shown");
    clearTimeout(undoTimer);
    undoTimer = setTimeout(hideUndo, 7000);
  }
  function hideUndo() {
    clearTimeout(undoTimer);
    undoBar.classList.remove("glyph-shown");
    undoAction = null;
  }
  undoButton.addEventListener("click", () => {
    const fn = undoAction;
    hideUndo();
    if (fn) fn();
  });

  // Pins are kept on the Mac, so the phone and the Mac window show the same.
  async function togglePin(path) {
    const f = serverFiles.find((x) => x.path === path);
    const want = !(f && f.pinned);
    if (f) { f.pinned = want; renderLibrary(); }
    const out = await folderApi("pin", { path, pinned: want }, baseName(path));
    if (!out) { if (f) { f.pinned = !want; renderLibrary(); } return; }
    if (f && f.pinned !== out.pinned) { f.pinned = out.pinned; renderLibrary(); }
    flash(out.pinned ? "Pinned" : "Unpinned");
  }
  async function newFolder(parent) {
    const name = await askName("New Folder", "", "Create", "In " + folderLabel(parent));
    if (!name) return;
    const out = await folderApi("folder", { path: (parent ? parent + "/" : "") + name }, name);
    if (!out) return;
    if (wide()) { libraryPath = out.path; searchInput.value = ""; }
    await loadServerList();
    paintChrome();
  }

  function fileItems(path) {
    const f = serverFiles.find((x) => x.path === path);
    return [
      menuItem(f && f.pinned ? "Unpin" : "Pin", UI.pin, () => togglePin(path)),
      menuItem("Move to…", UI.move, () => chooseFolderFor(path, false)),
      menuItem("Rename File…", UI.rename, () => renameItem(path, false)),
      menuItem("Move to Trash", UI.trash, () => trashItem(path, false), "glyph-danger"),
    ];
  }
  function folderItems(path) {
    const items = [menuItem("New Folder…", UI.newFolder, () => newFolder(path))];
    if (path) {
      items.push(menuItem("Rename Folder…", UI.rename, () => renameItem(path, true)),
                 menuItem("Move to…", UI.move, () => chooseFolderFor(path, true)),
                 menuItem("Move to Trash", UI.trash, () => trashItem(path, true), "glyph-danger"));
    }
    return items;
  }
  // The same menu as a right-click (Mac) or a long press (phone) on a row,
  // placed where it was asked for.
  function showItemMenu(path, isDir, x, y) {
    closeOverlay();
    moreMenu.replaceChildren(...(isDir ? folderItems(path) : fileItems(path)));
    moreMenu.classList.add("glyph-context");
    overlay("more");
    const w = moreMenu.offsetWidth, h = moreMenu.offsetHeight;
    moreMenu.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + "px";
    moreMenu.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + "px";
    moreMenu.style.right = "auto";
  }
  function itemControls(el, path, isDir) {
    let timer = null, x0 = 0, y0 = 0, held = false;
    const cancel = () => { clearTimeout(timer); timer = null; };
    el.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) return;
      held = false;
      x0 = e.touches[0].clientX;
      y0 = e.touches[0].clientY;
      cancel();
      timer = setTimeout(() => { timer = null; held = true; showItemMenu(path, isDir, x0, y0 + 12); }, 480);
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      if (t && Math.hypot(t.clientX - x0, t.clientY - y0) > 10) cancel();
    }, { passive: true });
    // A long press is not also a tap.
    el.addEventListener("touchend", (e) => { cancel(); if (held) { e.preventDefault(); held = false; } });
    el.addEventListener("touchcancel", cancel);
    el.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      if (!held) showItemMenu(path, isDir, e.clientX, e.clientY);
    });
    if (!wide() || (isDir && !path)) return;
    el.draggable = true;
    el.addEventListener("dragstart", (e) => {
      dragging = { path, isDir };
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("application/x-glyph-item", path); } catch (err) { /* only a marker */ }
      }
      el.classList.add("glyph-dragging");
    });
    el.addEventListener("dragend", () => { dragging = null; el.classList.remove("glyph-dragging"); });
  }
  // A folder in the sidebar takes a note or a folder dropped on it.
  function dropTarget(el, folder) {
    const can = () => !!dragging && folder !== folderOf(dragging.path) && !(dragging.isDir && inside(folder, dragging.path));
    el.addEventListener("dragover", (e) => {
      if (!can()) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
      el.classList.add("glyph-drop");
    });
    el.addEventListener("dragleave", () => el.classList.remove("glyph-drop"));
    el.addEventListener("drop", (e) => {
      el.classList.remove("glyph-drop");
      if (!can()) return;
      e.preventDefault();
      e.stopPropagation();
      const item = dragging;
      dragging = null;
      moveItem(item.path, item.isDir, folder);
    });
  }
  scrim.addEventListener("contextmenu", (e) => { e.preventDefault(); closeOverlay(); });

  /* A row on the phone swipes like a row in Notes: to the left for Move and
     Delete, to the right for Pin, and all the way across to do the first of them
     at once. Pointer events, so the browser keeps the vertical scroll (touch-action:
     pan-y) and hands over only the sideways movement. */
  function closeSwipe() {
    if (openSwipe) openSwipe.swipeTo(0, true);
    openSwipe = null;
  }
  function swipeRow(row, path, isDir) {
    if (wide()) return row;
    const wrap = elem("div", "glyph-swipe" + (isDir ? " glyph-swipe-folder" : ""));
    const lead = elem("div", "glyph-swipe-acts glyph-swipe-lead");
    const trail = elem("div", "glyph-swipe-acts glyph-swipe-trail");
    const act = (cls, icon, label, fn) => {
      const b = elem("button", "glyph-swipe-act " + cls);
      b.innerHTML = icon;
      b.setAttribute("aria-label", label);
      b.title = label;
      b.addEventListener("click", (e) => { e.stopPropagation(); closeSwipe(); fn(); });
      return b;
    };
    const f = isDir ? null : serverFiles.find((x) => x.path === path);
    if (!isDir) lead.appendChild(act("glyph-swipe-pin", UI.pin, f && f.pinned ? "Unpin" : "Pin", () => togglePin(path)));
    trail.append(act("glyph-swipe-move", UI.move, "Move to…", () => chooseFolderFor(path, isDir)),
                 act("glyph-swipe-delete", UI.trash, "Move to Trash", () => trashItem(path, isDir)));
    wrap.append(lead, trail, row);

    const ACT_W = 74;
    const leadW = lead.childElementCount * ACT_W;
    const trailW = trail.childElementCount * ACT_W;
    let offset = 0;
    let settleTimer = null;
    const place = (x, animate) => {
      offset = x;
      clearTimeout(settleTimer);
      wrap.classList.toggle("glyph-swipe-animate", !!animate);
      row.style.transform = x ? "translateX(" + x + "px)" : "";
      // Past the buttons, the first one stretches to fill the gap.
      trail.style.width = x < -trailW ? -x + "px" : "";
      lead.style.width = x > leadW ? x + "px" : "";
      if (x) {
        wrap.classList.toggle("glyph-swipe-left", x < 0);
        wrap.classList.toggle("glyph-swipe-right", x > 0);
      } else {
        // The buttons stay until the row has slid back over them.
        settleTimer = setTimeout(() => wrap.classList.remove("glyph-swipe-left", "glyph-swipe-right"), animate ? 240 : 0);
      }
    };
    wrap.swipeTo = place;
    let start = null;
    row.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" || !e.isPrimary) return;
      if (openSwipe && openSwipe !== wrap) closeSwipe();
      start = { x: e.clientX, y: e.clientY, id: e.pointerId, from: offset, sideways: false };
    });
    row.addEventListener("pointermove", (e) => {
      if (!start || e.pointerId !== start.id) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!start.sideways) {
        if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)) { start = null; return; }
        if (Math.abs(dx) < 10) return;
        start.sideways = true;
        try { row.setPointerCapture(e.pointerId); } catch (err) { /* only a convenience */ }
      }
      let x = start.from + dx;
      if (!leadW && x > 0) x = 0;
      place(Math.max(-wrap.offsetWidth, Math.min(wrap.offsetWidth, x)), false);
    });
    // Older iOS honors touch-action loosely, so a sideways swipe also stops the scroll.
    row.addEventListener("touchmove", (e) => { if (start && start.sideways) e.preventDefault(); }, { passive: false });
    const end = (e) => {
      if (!start || e.pointerId !== start.id) return;
      const was = start;
      start = null;
      if (!was.sideways) return;
      wrap.swipedAt = Date.now();
      const w = wrap.offsetWidth;
      if (offset < -w * 0.6) { place(0, true); openSwipe = null; trashItem(path, isDir); return; }
      if (leadW && offset > w * 0.45) { place(0, true); openSwipe = null; togglePin(path); return; }
      if (offset < -trailW / 2) { place(-trailW, true); openSwipe = wrap; return; }
      if (leadW && offset > leadW / 2) { place(leadW, true); openSwipe = wrap; return; }
      place(0, true);
      if (openSwipe === wrap) openSwipe = null;
    };
    row.addEventListener("pointerup", end);
    row.addEventListener("pointercancel", (e) => { if (start && start.sideways) end(e); else start = null; });
    // A swipe is not a tap, and a tap on a row that is open only closes it.
    wrap.addEventListener("click", (e) => {
      if (!row.contains(e.target)) return;
      // The click a browser may send straight after the finger lifts.
      const justSwiped = Date.now() - (wrap.swipedAt || 0) < 250;
      if (justSwiped || openSwipe === wrap) {
        e.stopPropagation();
        e.preventDefault();
        if (!justSwiped) closeSwipe();
      }
    }, true);
    return wrap;
  }
  // A tap anywhere else closes an open row, and does nothing more.
  document.addEventListener("pointerdown", (e) => {
    if (openSwipe && !openSwipe.contains(e.target)) {
      closeSwipe();
      swallowTapUntil = Date.now() + 600;
    }
  }, true);
  library.addEventListener("click", (e) => {
    if (Date.now() < swallowTapUntil) {
      swallowTapUntil = 0;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  /* ---------- Aa ---------- */
  const styleButtons = [];
  const formatButtons = [];
  function formatAction(cmd) {
    return () => {
      caretInNote();
      window.glyphToolbar(cmd);
      paintFormat();
    };
  }
  function buildFormatSheet() {
    const head = elem("div", "glyph-sheet-head");
    const close = roundButton(UI.close, "Close");
    close.addEventListener("click", closeOverlay);
    head.append(elem("span", "glyph-sheet-title", "Format"), close);
    const styles = elem("div", "glyph-styles");
    [["Heading", "h1"], ["Subheading", "h2"], ["Body", "body"]].forEach(([label, cmd]) => {
      const b = elem("button", "", label);
      b.dataset.block = cmd;
      b.addEventListener("mousedown", (e) => e.preventDefault());
      b.addEventListener("click", formatAction(cmd));
      styles.appendChild(b);
      styleButtons.push(b);
    });
    const row = (...groups) => {
      const r = elem("div", "glyph-format-row");
      groups.forEach((g) => r.appendChild(g));
      return r;
    };
    const group = (items) => {
      const seg = elem("div", "glyph-seg");
      items.forEach(([icon, label, cmd, state]) => {
        const b = elem("button");
        b.innerHTML = icon;
        b.title = label;
        b.setAttribute("aria-label", label);
        if (state) b.dataset.state = state;
        b.addEventListener("mousedown", (e) => e.preventDefault());
        b.addEventListener("click", formatAction(cmd));
        seg.appendChild(b);
        formatButtons.push(b);
      });
      return seg;
    };
    formatSheet.append(head, styles,
      row(group([[ICON.bold, "Bold", "bold", "bold"], [ICON.italic, "Italic", "italic", "italic"],
                 [ICON.underline, "Underline", "underline", "underline"], [ICON.strike, "Strikethrough", "strike", "strikeThrough"]]),
          group([[ICON.highlight, "Highlight", "highlight"], [ICON.code, "Code", "code"]])),
      row(group([[ICON.bullets, "Bulleted list", "bullets"], [UI.numbers, "Numbered list", "numbers"],
                 [ICON.checklist, "Checklist", "checklist"]]),
          group([[ICON.quote, "Quote", "quote"]])),
      row(group([[ICON.link, "Link", "link"], [ICON.table, "Table", "table"]]),
          group([[ICON.undo, "Undo", "undo"], [ICON.redo, "Redo", "redo"]])));
  }
  if (serverHost()) buildFormatSheet();
  function paintFormat() {
    if (document.body.dataset.overlay !== "format") return;
    const blk = currentBlock();
    const tag = blk ? blk.tagName : "P";
    styleButtons.forEach((b) => {
      const on = b.dataset.block === "h1" ? tag === "H1" : b.dataset.block === "h2" ? tag === "H2" : !/^H[1-6]$/.test(tag);
      b.setAttribute("aria-pressed", String(on));
    });
    formatButtons.forEach((b) => {
      if (!b.dataset.state) return;
      let on = false;
      try { on = document.queryCommandState(b.dataset.state); } catch (e) { /* not supported */ }
      b.setAttribute("aria-pressed", String(on));
    });
  }
  aaButton.addEventListener("click", () => {
    if (document.body.dataset.overlay === "format") { closeOverlay(); return; }
    caretInNote();
    overlay("format");
    paintFormat();
  });
  document.addEventListener("selectionchange", () => {
    if (document.body.dataset.overlay === "format") paintFormat();
  });

  /* ---------- voice ----------
     Recorded here, written down on the Mac by Whisper, and put where the caret
     was. The phone only allows a microphone on a secure page, so on the plain
     http address the sheet says so and offers the secure one instead. */
  let voiceReady = null;
  let secureOrigin = null;
  const voice = { recorder: null, stream: null, chunks: [], started: 0, timer: null,
                  audio: null, frame: 0, blob: null, target: "note", range: null, rawAt: null };
  async function checkVoice() {
    try {
      const res = await glyphApi("/api/voice");
      voiceReady = res.ok && (await res.json()).available === true;
    } catch (e) { voiceReady = false; }
    try {
      const res = await glyphApi("/api/info");
      if (res.ok) secureOrigin = (await res.json()).secureOrigin || null;
    } catch (e) { /* older server */ }
    document.body.classList.toggle("glyph-voice-off", voiceReady === false);
  }
  const voiceLang = () => {
    try { return localStorage.getItem("glyphVoiceLang") || "auto"; } catch (e) { return "auto"; }
  };
  const clock = (ms) => {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };

  function paintVoice(state, detail) {
    voiceSheet.replaceChildren();
    voiceSheet.dataset.state = state;
    const clockEl = elem("div", "glyph-voice-clock", state === "recording" ? clock(Date.now() - voice.started) : "");
    const note = elem("p", "glyph-voice-note", detail || "");
    const level = elem("div", "glyph-voice-level");
    for (let i = 0; i < 28; i++) level.appendChild(elem("i"));
    const lang = voiceLang();
    const langs = segmented([["Auto", "Detect the language", () => setLang("auto"), lang === "auto"],
                             ["English", "English", () => setLang("en"), lang === "en"],
                             ["Română", "Romanian", () => setLang("ro"), lang === "ro"]]);
    langs.classList.add("glyph-voice-langs");
    const actions = elem("div", "glyph-voice-actions");
    const cancel = elem("button", "glyph-text-button", "Cancel");
    cancel.addEventListener("click", closeOverlay);
    if (state === "recording") {
      const stop = elem("button", "glyph-voice-stop");
      stop.setAttribute("aria-label", "Stop and write it down");
      stop.addEventListener("click", finishVoice);
      actions.append(cancel, stop, elem("span", "glyph-text-button"));
      voiceSheet.append(clockEl, note, level, langs, actions);
    } else if (state === "working") {
      const stop = elem("button", "glyph-voice-stop");
      stop.disabled = true;
      actions.append(cancel, stop, elem("span", "glyph-text-button"));
      voiceSheet.append(clockEl, note, langs, actions);
    } else {
      const again = elem("button", "glyph-text-button", voice.blob ? "Try again" : "");
      if (voice.blob) again.addEventListener("click", sendVoice);
      if (state === "insecure" && secureOrigin) {
        const go = elem("button", "glyph-text-button glyph-voice-link", "Open secure Glyph");
        go.dataset.to = secureLink();
        go.addEventListener("click", async () => {
          go.disabled = true;
          // The secure address keeps its own drafts, apart from this one's, so a
          // new note gets its file and every edit reaches the Mac before leaving.
          const d = active();
          if (d) {
            captureActive();
            if (d.isFresh) await commitFresh(d);
            if (d.serverPath && !(await settle([d], d.serverPath, false))) { go.disabled = false; return; }
          }
          location.href = secureLink();
        });
        actions.append(cancel, go);
      } else {
        actions.append(cancel, again);
      }
      voiceSheet.append(note, actions);
    }
    voice.levelEl = level;
  }
  // Where "Open secure Glyph" goes: the same note, or the same folder, at the
  // secure address. The token rides in the fragment, which never leaves the phone.
  function secureLink() {
    const d = active();
    const folder = d ? (d.isFresh ? d.freshFolder || "" : "") : libraryPath;
    const where = d && d.serverPath ? "&open=" + encodeURIComponent(d.serverPath)
      : folder ? "&folder=" + encodeURIComponent(folder) : "";
    return secureOrigin + "/#token=" + encodeURIComponent(glyphToken()) + where;
  }
  function setLang(code) {
    try { localStorage.setItem("glyphVoiceLang", code); } catch (e) { /* private mode */ }
    voiceSheet.querySelectorAll(".glyph-voice-langs button").forEach((b, i) => {
      b.setAttribute("aria-pressed", String(["auto", "en", "ro"][i] === code));
    });
  }

  async function startVoice(target) {
    voice.target = target;
    voice.blob = null;
    voice.range = null;
    voice.rawAt = null;
    const md = document.getElementById("md");
    const sel = window.getSelection();
    if (document.body.classList.contains("glyph-raw")) voice.rawAt = rawArea.selectionStart;
    else if (sel.rangeCount && md.contains(sel.getRangeAt(0).startContainer)) voice.range = sel.getRangeAt(0).cloneRange();
    overlay("voice");
    if (!window.isSecureContext || !navigator.mediaDevices || !window.MediaRecorder) {
      paintVoice("insecure", secureOrigin
        ? "Your iPhone allows the microphone only on Glyph's secure address. Add that one to your Home Screen and the microphone works right in the app."
        : "Your iPhone allows the microphone only on a secure (https) address.");
      return;
    }
    paintVoice("working", "Starting the microphone…");
    try {
      voice.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      paintVoice("denied", "Glyph is not allowed to use the microphone. You can allow it in Settings.");
      return;
    }
    if (document.body.dataset.overlay !== "voice") { stopStream(); return; }   // cancelled meanwhile
    const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg"]
      .find((t) => MediaRecorder.isTypeSupported(t));
    voice.recorder = new MediaRecorder(voice.stream, type ? { mimeType: type } : undefined);
    voice.chunks = [];
    voice.recorder.addEventListener("dataavailable", (e) => { if (e.data && e.data.size) voice.chunks.push(e.data); });
    voice.recorder.start(1000);
    voice.started = Date.now();
    paintVoice("recording");
    meter();
    voice.timer = setInterval(() => {
      const c = voiceSheet.querySelector(".glyph-voice-clock");
      if (c) c.textContent = clock(Date.now() - voice.started);
      if (Date.now() - voice.started > 10 * 60 * 1000) finishVoice();   // ten minutes at most
    }, 250);
  }
  // A row of bars that follow her voice, so it is obvious the phone is listening.
  function meter() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      voice.audio = new Ctx();
      const source = voice.audio.createMediaStreamSource(voice.stream);
      const analyser = voice.audio.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      const samples = new Uint8Array(analyser.fftSize);
      const history = new Array(28).fill(0);
      const draw = () => {
        if (!voice.recorder || voice.recorder.state !== "recording") return;
        analyser.getByteTimeDomainData(samples);
        let sum = 0;
        for (let i = 0; i < samples.length; i++) { const v = (samples[i] - 128) / 128; sum += v * v; }
        history.push(Math.min(1, Math.sqrt(sum / samples.length) * 4));
        history.shift();
        const bars = voice.levelEl ? voice.levelEl.children : [];
        for (let i = 0; i < bars.length; i++) bars[i].style.setProperty("--v", history[i].toFixed(2));
        voice.frame = requestAnimationFrame(draw);
      };
      draw();
    } catch (e) { /* the bars are a nicety */ }
  }
  function stopStream() {
    clearInterval(voice.timer);
    cancelAnimationFrame(voice.frame);
    if (voice.stream) voice.stream.getTracks().forEach((t) => t.stop());
    if (voice.audio) voice.audio.close().catch(() => {});
    voice.stream = null;
    voice.audio = null;
  }
  function cancelVoice() {
    const rec = voice.recorder;
    voice.recorder = null;
    if (rec && rec.state !== "inactive") rec.stop();
    stopStream();
  }
  async function finishVoice() {
    const rec = voice.recorder;
    if (!rec) return;
    voice.recorder = null;
    const done = new Promise((resolve) => rec.addEventListener("stop", resolve, { once: true }));
    if (rec.state !== "inactive") rec.stop();
    await done;
    stopStream();
    voice.blob = new Blob(voice.chunks, { type: rec.mimeType || "audio/mp4" });
    sendVoice();
  }
  async function sendVoice() {
    paintVoice("working", "Writing it down…");
    let res;
    try {
      res = await glyphApi("/api/transcribe?lang=" + encodeURIComponent(voiceLang()), {
        method: "POST",
        headers: { "Content-Type": (voice.blob.type || "audio/mp4").split(";")[0] },
        body: voice.blob,
      });
    } catch (e) {
      paintVoice("failed", "Could not reach the computer. Your recording is kept.");
      return;
    }
    if (document.body.dataset.overlay !== "voice") return;
    if (res.status === 422) { paintVoice("failed", "No speech was heard."); return; }
    if (!res.ok) { paintVoice("failed", "Whisper could not write that down."); return; }
    const data = await res.json();
    voice.blob = null;
    delete document.body.dataset.overlay;
    placeTranscript(String(data.text || ""));
  }
  function placeTranscript(text) {
    const words = (text.match(/\S+/g) || []).length;
    const d = active();
    if (voice.target === "new" || !d || d.pdf || d.book || inLibrary()) newNote(text);
    else insertIntoNote(text);
    flash("Added " + plural(words, "word", "words"));
  }
  function insertIntoNote(text) {
    const paragraphs = text.split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
    if (!paragraphs.length) return;
    if (document.body.classList.contains("glyph-raw")) {
      const at = voice.rawAt != null ? voice.rawAt : rawArea.value.length;
      const before = rawArea.value.slice(0, at);
      const lead = before.trim() && !/\n\s*$/.test(before) ? "\n\n" : "";
      rawArea.value = before + lead + paragraphs.join("\n\n") + rawArea.value.slice(at);
      rawArea.dispatchEvent(new Event("input"));
      return;
    }
    const md = document.getElementById("md");
    md.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    let range = voice.range;
    if (!range) {
      range = document.createRange();
      range.selectNodeContents(md.lastElementChild || md);
      range.collapse(false);
    }
    sel.addRange(range);
    // In the middle of a sentence it joins the sentence; at the end of one, or on
    // an empty line, it starts paragraphs of its own.
    const blk = currentBlock();
    const tail = document.createRange();
    tail.setStart(range.endContainer, range.endOffset);
    if (blk) tail.setEndAfter(blk.lastChild || blk);
    const atEnd = !blk || !tail.toString().trim();
    if (!atEnd) {
      document.execCommand("insertText", false, " " + paragraphs.join(" ") + " ");
    } else {
      if (blk && blk.textContent.trim()) document.execCommand("insertParagraph");
      paragraphs.forEach((p, i) => {
        if (i) document.execCommand("insertParagraph");
        document.execCommand("insertText", false, p);
      });
    }
    window.glyphFlush();
  }
  micButton.addEventListener("click", () => startVoice("note"));
  voiceNoteButton.addEventListener("click", () => startVoice("new"));

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", (e) => {
    const mod = window.__glyphPlatform === "mac" ? e.metaKey : e.ctrlKey;
    if (!mod) return;
    const k = e.key.toLowerCase();
    // A PDF has nothing to format, save or show raw, and #md behind it still
    // holds another note. Open, new and close are all that apply.
    const cur = active();
    if (cur && (cur.pdf || cur.book) && !/^[wno]$/.test(k)) return;
    const map = {
      b: "bold", i: "italic", u: "underline", k: "link",
      1: "h1", 2: "h2", 3: "h3",
    };
    // Select All is handled here rather than left to the browser: with nothing
    // focused, a browser's own ⌘A selects the whole PAGE — toolbar, tabs and
    // file drawer included — which is never what was wanted. A real input field
    // keeps its own behavior.
    if (k === "a" && !e.shiftKey) {
      const ae = document.activeElement;
      if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return;
      e.preventDefault();
      window.glyphSelectAll();
      return;
    }
    // Plain ⌘C is left alone — that is the browser's copy, and it should stay
    // the browser's copy. ⇧⌘C is the one that yields markdown.
    if (e.shiftKey && k === "c") { e.preventDefault(); doCopy("selection"); return; }
    if (k === "s") { e.preventDefault(); doSave(); return; }
    if (k === "o") { e.preventDefault(); doOpen(); return; }
    if (k === "n") { e.preventDefault(); if (serverHost()) newNote(""); else openDoc("Untitled.md", ""); return; }
    if (k === "e") { e.preventDefault(); toggleRaw(); return; }
    if (k === "w") { e.preventDefault(); if (activeId != null) closeDoc(activeId); return; }
    if (e.shiftKey && k === "x") { e.preventDefault(); window.glyphToolbar("strike"); return; }
    if (e.shiftKey && k === "h") { e.preventDefault(); window.glyphToolbar("highlight"); return; }
    if (e.shiftKey && k === "l") { e.preventDefault(); window.glyphToolbar("checklist"); return; }
    if (e.shiftKey && k === "8") { e.preventDefault(); window.glyphToolbar("bullets"); return; }
    if (!e.shiftKey && map[k]) { e.preventDefault(); window.glyphToolbar(map[k]); }
  });

  /* ---------- drag and drop ---------- */
  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => {
    if (!e.dataTransfer || !e.dataTransfer.types.includes("Files")) return;
    dragDepth++;
    document.body.classList.add("glyph-dropping");
  });
  window.addEventListener("dragleave", () => {
    if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("glyph-dropping"); }
  });
  // A note or folder dragged inside the page is not a file from outside: only a
  // folder in the sidebar takes it, and anywhere else it is refused.
  window.addEventListener("dragover", (e) => { if (!dragging) e.preventDefault(); });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    if (dragging) { dragging = null; return; }
    dragDepth = 0;
    document.body.classList.remove("glyph-dropping");
    const files = [...(e.dataTransfer.files || [])];
    const img = files.find((f) => /^image\//.test(f.type));
    if (img && !files.some((f) => /\.md$/i.test(f.name))) { insertImageFile(img); return; }
    loadFiles(files);
  });

  window.addEventListener("beforeunload", (e) => {
    captureActive();
    if (docs.some((d) => d.dirty)) { e.preventDefault(); e.returnValue = ""; }
  });

  // The page starts holding whatever document was embedded in it.
  window.__glyphChromeReady = function (name, text, dir) {
    if (serverHost()) {
      // Land on the file list rather than a blank untitled tab; a document
      // opens when one is picked from the drawer.
      initServer();
      paintTabs();
      paintStatus();
      return;
    }
    openDoc(name || "Untitled.md", text || "", null, dir || null);
    paintTabs();
    paintStatus();
  };

  // The portable shell's side of the file dialogs. It opens a document it has
  // already read from disk, and confirms one it has written.
  window.__glyphOpened = function (name, text, dir) {
    // Reuse the tab if this file is already open, rather than stacking copies.
    const existing = docs.find((d) => d.dir === dir && d.name === name);
    let d;
    if (existing) {
      existing.text = text || "";
      existing.dirty = false;
      if (existing.id === activeId) { activeId = null; }
      activate(existing.id);
      d = existing;
    } else {
      d = openDoc(name || "Untitled.md", text || "", null, dir || null);
    }
    paintTabs();
    paintStatus();
    // The tab ids are minted here, and every later message about this document
    // carries this one. The shell parked the path it just read and is waiting
    // to learn which id it belongs to - without this, saving a file that came
    // from the Open dialog would ask where to put it.
    postToApp({ type: "opened", id: d.id, name: d.name });
  };

  window.__glyphSaved = function (id, name, dir) {
    const d = docs.find((x) => x.id === id);
    if (!d) return;
    d.dirty = false;
    if (name) d.name = name;
    if (dir) d.dir = dir;
    // A first save gives the document a folder, so its images can resolve now.
    if (d.id === activeId && nativeHost()) window.__glyphDocDir = d.dir || null;
    paintTabs();
    paintStatus();
    document.title = d.name + " — Glyph";
    flash("Saved");
  };
};

/*__INITIAL__*/
// The chrome flag is set by the block above, so installation happens here rather
// than where the module is defined.
if (window.__glyphChrome) {
  window.__glyphInstallChrome();
  window.__glyphChromeReady(window.__initialName, window.__initial, window.__initialDir);
  // Tell a native host the interface exists. Nothing may be evaluated into this
  // page before this point, so the portable shell waits for it rather than
  // sleeping and hoping.
  postToApp({ type: "ready" });
} else if (typeof window.__initial === "string") {
  window.renderMarkdown(window.__initial);
}
</script>
</body>
</html>
