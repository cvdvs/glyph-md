name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runner labels are pinned deliberately. The webkit2gtk 4.0 -> 4.1 rename has
# already broken this class of build once industry-wide; a pinned label means it
# breaks when someone bumps it on purpose, not on a random Tuesday.

jobs:
  # The cheapest, highest-value job: run the shared assertion suite against the
  # SAME engine Windows WebView2 uses (Blink), with no native build at all.
  engine:
    name: Shared UI — Blink (the Windows engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chrome
        run: |
          for p in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$p" ]; then echo "CHROME_PATH=$p" >> "$GITHUB_ENV"; echo "found $p"; exit 0; fi
          done
          echo "::error::No Chrome/Chromium on this runner; engine job cannot run."
          exit 1
      - name: Smoke test + screenshots
        run: node Scripts/engine-smoke.mjs --shots artifacts/blink
      - name: Smoke test the standalone app build
        run: node Scripts/engine-smoke.mjs --with-chrome
      - name: Security — a hostile document must not execute
        run: node Scripts/engine-smoke.mjs --security
      - name: Fidelity — a document must survive being written back
        run: node Scripts/engine-smoke.mjs --fidelity
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-blink
          path: artifacts/blink
          if-no-files-found: warn

  # Guards the shipping macOS app: it must build, and the shared UI must behave
  # identically under WKWebView, including byte-identical markdown output.
  macos:
    name: macOS app — build + WKWebView suite
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: The JSON decoder that stands between the page and a file
        run: |
          clang++ -std=c++17 -Ishell Scripts/json-smoke.cc -o /tmp/json-smoke
          /tmp/json-smoke
      - name: Build Glyph.app
        run: ./build.sh
      - name: Build the portable shell too, and run its suites
        run: |
          ./shell/build-portable.sh --selftest
      - name: Compose the page
        run: python3 Scripts/make-preview.py sample.md /tmp/composed.html
      - name: Build the WKWebView harness
        run: clang -fobjc-arc Scripts/webkit-smoke.m -o /tmp/webkit-smoke -framework Cocoa -framework WebKit
      - name: Run the shared assertion suite
        run: /tmp/webkit-smoke /tmp/composed.html sample.md Scripts/smoke.js /tmp/mac-result.json
      - name: Security — a hostile document must not execute
        run: |
          python3 Scripts/make-preview.py Scripts/fixtures/hostile.md /tmp/hostile.html
          /tmp/webkit-smoke /tmp/hostile.html Scripts/fixtures/hostile.md Scripts/security-smoke.js
      - name: Fidelity — a document must survive being written back
        run: |
          python3 Scripts/make-preview.py Scripts/fixtures/fidelity.md /tmp/fidelity.html
          /tmp/webkit-smoke /tmp/fidelity.html Scripts/fixtures/fidelity.md Scripts/fidelity-smoke.js
      - name: Wikilinks — resolve inside the vault, never outside it
        run: |
          clang -fobjc-arc Scripts/vault-smoke.m Sources/GlyphVault.m \
            -o /tmp/vault-smoke -framework Foundation
          mkdir -p /tmp/vaultdir
          /tmp/vault-smoke /tmp/vaultdir
      - name: Links — notes open, executables do not
        run: |
          clang -fobjc-arc Scripts/link-smoke.m -o /tmp/link-smoke -framework Foundation
          mkdir -p /tmp/linkdir
          /tmp/link-smoke /tmp/linkdir
      - name: Check the raw editor's syntax highlighting
        run: |
          clang -fobjc-arc Scripts/highlight-smoke.m Sources/GlyphTheme.m \
            Sources/GlyphHighlighter.m Sources/GlyphGutter.m \
            -o /tmp/highlight-smoke -framework Cocoa
          /tmp/highlight-smoke Scripts/fixtures/highlight-cases.md
      - name: Assert markdown output has not drifted
        run: |
          python3 - <<'EOF'
          import json, sys, difflib
          actual = json.load(open('/tmp/mac-result.json'))['serialized']
          golden = open('Scripts/fixtures/golden-sample.md').read()
          if actual != golden:
              print("Serialization drifted from Scripts/fixtures/golden-sample.md:")
              sys.stdout.writelines(difflib.unified_diff(
                  golden.splitlines(True), actual.splitlines(True),
                  fromfile='golden', tofile='actual'))
              sys.exit(1)
          print(f"markdown output identical to golden ({len(golden)} bytes)")
          EOF
      - name: Upload the built app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Glyph-macos
          path: build/Glyph.app
          if-no-files-found: warn

  # The portable shell on Linux. It must BUILD and it must RUN: a build that
  # only compiles proves nothing, because every interesting failure here -
  # WebKitGTK refusing to start, the CSP blocking the page, the bridge not
  # arriving - happens at runtime and looks like a blank window.
  linux:
    name: Linux — build + run the suites in WebKitGTK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: The JSON decoder that stands between the page and a file
        run: |
          c++ -std=c++17 -Ishell Scripts/json-smoke.cc -o /tmp/json-smoke
          /tmp/json-smoke
      - name: Build
        run: ./shell/build-portable.sh
      - name: Run the suites inside the real app
        env:
          # WebKitGTK's compositor cannot allocate dmabuf on a headless runner
          # and dies without a useful message. This is the single setting that
          # decides whether this job works at all.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          GDK_BACKEND: x11
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' ./shell/build/glyph --selftest
      - name: Package a .deb
        run: |
          # A Debian version must begin with a digit. There are no tags yet, so
          # git describe returns a bare commit sha and dpkg-deb refuses it.
          DESCRIBED=$(git describe --tags --always 2>/dev/null | sed 's/^v//')
          case "$DESCRIBED" in
            [0-9]*) VERSION="$DESCRIBED" ;;
            *)      VERSION="0.0.0+git$DESCRIBED" ;;
          esac
          echo "packaging version $VERSION"
          PKG=artifacts/deb/glyph_${VERSION}_amd64
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications" \
                   "$PKG/usr/share/doc/glyph"
          cp shell/build/glyph "$PKG/usr/bin/glyph"
          cp LICENSE "$PKG/usr/share/doc/glyph/copyright" 2>/dev/null || true
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: glyph
          Version: ${VERSION}
          Section: editors
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Maintainer: Glyph contributors
          Description: Markdown reader and editor for single files
           Opens a .md file, renders it the way Obsidian does, and lets you edit
           the rendered page directly. No vault, no database, no account.
          EOF
          cat > "$PKG/usr/share/applications/glyph.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Glyph
          Comment=Read and edit markdown files
          Exec=glyph %f
          Icon=text-x-generic
          Terminal=false
          Categories=Office;WordProcessor;TextEditor;
          MimeType=text/markdown;text/x-markdown;
          StartupWMClass=glyph
          EOF
          dpkg-deb --build --root-owner-group "$PKG"
          ls -la artifacts/deb/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Glyph-linux
          path: |
            shell/build/glyph
            artifacts/deb/*.deb
          if-no-files-found: warn

  # The portable shell on Windows. Same rule: build AND run.
  windows:
    name: Windows — build + run the suites in WebView2
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: The JSON decoder that stands between the page and a file
        shell: pwsh
        run: |
          . ./Scripts/msvc-env.ps1
          cl /nologo /std:c++17 /EHsc /utf-8 /I shell Scripts\json-smoke.cc /Fe:json-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "compiling the JSON test failed" }
          ./json-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "the JSON test failed" }
      - name: Build
        shell: pwsh
        run: ./shell/build-portable.ps1
      - name: Run the suites inside the real app
        shell: pwsh
        run: |
          # A GUI-subsystem binary has no stdout on a runner - there is no
          # console to attach to - so the selftest also writes a log, and that
          # is what CI reads. Without it the first Windows failure arrived with
          # no output whatsoever.
          $code = 0
          try { ./shell/build/glyph.exe --selftest } catch { $code = 1 }
          if ($LASTEXITCODE) { $code = $LASTEXITCODE }
          if (Test-Path glyph-selftest.log) {
            Write-Host "--- selftest log ---"
            Get-Content glyph-selftest.log | Write-Host
          } else {
            Write-Host "no glyph-selftest.log was written - the app died before it started"
          }
          if ($code -ne 0) { throw "the Windows selftest failed (exit $code)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Glyph-windows
          path: shell/build/glyph.exe
          if-no-files-found: warn

  # The standalone page: one HTML file that renders and edits markdown in any
  # browser, on any OS. No build, nothing to install — useful on its own.
  # One self-contained HTML file that runs Glyph in any browser on any OS:
  # tabs, toolbar, open/save, raw view. No install, nothing to build.
  app:
    name: Standalone app page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build glyph.html
        run: |
          mkdir -p artifacts
          python3 Scripts/make-preview.py sample.md artifacts/glyph.html --chrome
          python3 Scripts/make-preview.py sample.md artifacts/glyph-readonly.html
          ls -la artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: glyph-standalone-html
          path: artifacts/*.html
